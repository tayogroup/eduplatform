<style>/* The 1280x720 stage shared by the unit lecture films of every subject
 * (tools/create-ehel-unit-lecture.js; a storyboard may add its own sheet in
 * renderer.styles). It was the Computing film's until 2026-09-18.
 *
 * DARK, like the science and maths films. Every token below is the one the
 * standalone lesson pages render in: each kit's lib/lesson.css forces the
 * Wehel design language's dark block (:root, :root:not([data-theme="light"]),
 * :root[data-theme="dark"] { --ground: #0B1D2C; ... }), the same palette in
 * Science, Mathematics and Computing. The Computing machines are drawn in the
 * colours of that kit's own hardware drawings (computing.js FIGURES: a #2B5673
 * body, #93AABE edges, a #0B1D2C screen, #B9C8D6 for light plastic), so a
 * tablet in the film is the tablet in the lesson.
 *
 * NOTHING HERE TRANSITIONS OR ANIMATES. Every moving value is written inline
 * by the scene renderer as a pure function of t.
 */

:root {
  --ground: #0B1D2C; --card: #112A3D; --cell: #17384F; --line: #214560;
  --ink: #FFFFFF; --muted: #93AABE;
  --accent: #E9744F; --accent-soft: rgba(233, 116, 79, 0.18);
  --teal: #35BFB2; --teal-soft: #143A4A;
  --plum: #B78BD1; --gold: #F4C95D;
  --good: #4FD1A0; --good-soft: rgba(79, 209, 160, 0.18);
  --bad: #F0806F;
  --blue: #6E9DE8;
  --hue: #35BFB2;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1280px; height: 720px; overflow: hidden; }

body {
  background: var(--ground);
  color: var(--ink);
  font-family: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

#film {
  position: relative;
  width: 1280px; height: 720px;
  display: flex; flex-direction: column;
  background:
    radial-gradient(1100px 620px at 82% -14%, color-mix(in srgb, var(--hue) 26%, transparent), transparent 60%),
    radial-gradient(820px 520px at -6% 108%, rgba(233, 116, 79, 0.16), transparent 58%),
    var(--ground);
}
#film::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(120% 92% at 50% 42%, transparent 52%, rgba(0, 0, 0, 0.45) 100%);
}

/* ---- chrome ------------------------------------------------------------ */
.bar {
  position: relative; z-index: 2;
  flex: 0 0 auto; height: 58px;
  display: flex; align-items: center; gap: 13px;
  padding: 0 44px;
}
.bar .mark {
  width: 30px; height: 30px; border-radius: 9px;
  background: var(--hue); color: #04141B;
  font-family: "Inter", sans-serif; font-weight: 700; font-size: 17px;
  display: grid; place-items: center;
}
.bar .brand { font-family: "Inter", sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.01em; color: var(--ink); }
.bar .brand b { font-weight: 400; color: var(--muted); margin-left: 8px; }
.bar .brand b::before { content: "\00B7"; margin-right: 8px; }
.bar .unit { margin-left: auto; font-family: "Inter", sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.rail { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; z-index: 3; background: rgba(255, 255, 255, 0.10); }
.rail i { display: block; height: 3px; background: var(--hue); }

/* ---- the stage ----------------------------------------------------------- */
.stage { position: relative; z-index: 2; flex: 1 1 auto; padding: 4px 56px 0; display: flex; flex-direction: column; min-height: 0; }
.kicker { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; flex: 0 0 auto; }
.kicker .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--hue); flex: 0 0 auto; }
.kicker .codes { display: flex; gap: 6px; margin-left: auto; }
.kicker .codes span {
  font-family: "Inter", sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px;
}
.sceneh { font-family: "Inter", sans-serif; font-weight: 700; font-size: 40px; letter-spacing: -0.026em; line-height: 1.04; margin-bottom: 8px; flex: 0 0 auto; }
.eyebrow { font-family: "Inter", sans-serif; font-size: 11.5px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--hue); }

/* one drawing per scene, in one coordinate space: 1168 x 440 */
.scene { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-height: 0; }
.scene svg.sf { width: 1168px; height: 440px; display: block; overflow: visible; }

/* ---- the spoken line ------------------------------------------------------ */
.band { position: relative; z-index: 2; flex: 0 0 auto; min-height: 118px; display: flex; align-items: center; padding: 10px 56px 22px; }
.band p { position: relative; max-width: 1060px; padding-left: 20px; font-size: 29px; line-height: 1.30; font-weight: 700; color: var(--ink); text-shadow: 0 2px 14px rgba(0, 0, 0, 0.55); }
.band p::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 5px; border-radius: 3px; background: var(--hue); }

/* ---- SVG type -------------------------------------------------------------- */
.sf text { font-family: "Inter", sans-serif; font-weight: 700; }

<script>/* The shared engine of the unit lecture films, first half. Assembled by

 *     ehel-film-engine-tail.js   (the cards, the frame, the export; closes it)
 *

 * A scenes file must define, for the tail to use:

 * renderer screenshots frames one at a time and a self-animating page would
 * hand it whatever the clock happened to say. Every moving thing is a pure
 * function of t, so frame(12.5) draws the same pixels on the tenth run as on
 * the first, and frames can be drawn by several pages at once.
 *
 * This is the maths film's engine (the timeline, the speech cues, the chrome,
 * the caption band, the two cards), which is the science film's with cues
 * added. It was lifted out of the Computing film on 2026-09-18 so that a film
 * in any subject writes its pictures and nothing else; the Computing film's
 * frames were compared before and after, pixel for pixel.
 *
 * Each scene draws ONE svg in a 1168 x 440 space (svg() below).
 */

  var F = window.FILM;            /* the storyboard, plus the measured timeline */
  var GAP = 0.22;                 /* the tool's GAP_BEAT: the pause between two beats */

    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

     owner, 2026-09-19, for the Science Grade 2-4 films: "for human faces,
     make them brown color", and "you can mix yellow and brown faces"). Every
     emoji that can take a skin tone and has none, so would draw yellow, gets
     the medium-dark tone: a child, a hand, an ear. A tone the lesson chose is
     kept, and a smiley has no tone to take, so it stays yellow. A person inside
     a group of people joined by ZWJ (a family) is left alone, and so are the
     three that have no one-tone form: family, bunny ears, wrestlers. frame()

  var LEAD_IN = 0.12, TAIL_OUT = 0.3;

      else if ((ch === "-" || ch === "–" || ch === "—") && say.charAt(k - 1) === " ") x += 3;
      w.push(total);
      total += x;

    var at = b.art && b.art.at;
    if (!at) return;
    Object.keys(at).forEach(function (name) {

        throw new Error("storyboard beat " + (n + 1) + ': cue "' + name + '" is "' + at[name] +
          '", which that beat does not say');

    body: "#2B5673", edge: "#93AABE", glass: "#0B1D2C", plastic: "#B9C8D6",

  }

    return el("rect", Object.assign({ x: x, y: y, width: Math.max(0, w), height: Math.max(0, h), rx: rx, fill: fill || "none", stroke: stroke, "stroke-width": sw }, extra || {}));
  }
  function C(cx, cy, r, fill, stroke, sw, extra) {
    return el("circle", Object.assign({ cx: cx, cy: cy, r: Math.max(0, r), fill: fill || "none", stroke: stroke, "stroke-width": sw }, extra || {}));
  }
  function E(cx, cy, rx, ry, fill, stroke, sw, extra) {
    return el("ellipse", Object.assign({ cx: cx, cy: cy, rx: Math.max(0, rx), ry: Math.max(0, ry), fill: fill || "none", stroke: stroke, "stroke-width": sw }, extra || {}));
  }
  function L(x1, y1, x2, y2, stroke, sw, extra) {
    return el("line", Object.assign({ x1: x1, y1: y1, x2: x2, y2: y2, stroke: stroke, "stroke-width": sw, "stroke-linecap": "round" }, extra || {}));
  }
  function Pth(d, fill, stroke, sw, extra) {
    return el("path", Object.assign({ d: d, fill: fill || "none", stroke: stroke, "stroke-width": sw, "stroke-linecap": "round", "stroke-linejoin": "round" }, extra || {}));
  }
  /* A fill or a font-size given here goes into style, not an attribute: the
     .lab classes set both in CSS, and a stylesheet rule beats a presentation
     attribute, so an attribute would be silently ignored (the first cut drew
     every coloured word white for exactly that reason). */
  function Tx(x, y, s, cls, anchor, extra) {
    var o = Object.assign({ x: x, y: y, "class": cls, "text-anchor": anchor || "start" }, extra || {}), st = "";

    if (o["font-size"] != null) { st += "font-size:" + n2(o["font-size"]) + "px;"; delete o["font-size"]; }
    if (st) o.style = st;
    return el("text", o, esc(s));
  }
  /* an emoji, centred on (x, y) */
  function Em(x, y, size, ch, extra) {
    return el("text", Object.assign({ x: x, y: y, "font-size": size, "text-anchor": "middle", "dominant-baseline": "central" }, extra || {}), ch);

  /* points along a polyline, by distance */
  function polyLen(pts) {
    var d = 0;
    for (var k = 1; k < pts.length; k++) d += Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]);

  function polyAt(pts, s) {
    for (var k = 1; k < pts.length; k++) {
      var seg = Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]);
      if (s <= seg || k === pts.length - 1) {
        var u = seg ? clamp(s / seg, 0, 1) : 0;
        return [lerp(pts[k - 1][0], pts[k][0], u), lerp(pts[k - 1][1], pts[k][1], u), k - 1];

      } };
  }

  /* ---- the school whose film this is ----------------------------------
     Hard-coded to Ehel Academy until 2026-09-23, when a Professor Adow TVET
     film put another school's name and crest on every one of its frames.
     A storyboard now says who it belongs to:

       "brand": { "name": "…", "mark": "…", "by": "…" }

     EVERY DEFAULT IS THE STRING THAT WAS THERE, so a film that names no
     brand renders exactly as it did — the nine Ehel films included. */
  var BRAND = F.brand || {};
  var BRAND_NAME = BRAND.name || "Ehel Academy";
  var BRAND_MARK = BRAND.mark || "E";
  var BRAND_BY = BRAND.by || "A short unit lecture by the Ehel Academy Virtual Teacher";

  /* ---- chrome -------------------------------------------------------- */
  function chrome(scene, t) {
    var pct = clamp(t / TOTAL, 0, 1) * 100;
    return '<header class="bar">' +
      '<span class="mark">' + esc(BRAND_MARK) + "</span>" +
      '<span class="brand">' + esc(BRAND_NAME) + "<b>" + esc(F.subtitle) + "</b></span>" +
      '<span class="unit">' + esc(F.title) + "</span>" +
      "</header>" +
      '<div class="rail"><i style="width:' + pct.toFixed(3) + '%"></i></div>';
  }

  function heading(scene, t, i) {
    if (!scene.heading) return "";
    var at = BEATS[scene.first].start;
    var a = inAt(t, at, 0.55), b = inAt(t, at + 0.12, 0.55);
    var cs = (scene.codes || []).map(function (c) { return "<span>" + esc(c) + "</span>"; }).join("");
    return '<div class="kicker" style="opacity:' + b.toFixed(3) + '">' +
        '<i class="dot"></i>' +
        '<span class="eyebrow">Chapter ' + (BEATS[i].scene + 1) + " of " + F.scenes.length + "</span>" +
        (cs ? '<div class="codes">' + cs + "</div>" : "") +
      "</div>" +
      '<h2 class="sceneh" style="opacity:' + a.toFixed(3) +
      ";transform:translateY(" + ((1 - a) * 16).toFixed(2) + 'px)">' + esc(scene.heading) + "</h2>";
  }

  function band(beat, t) {
    var o = inAt(t, beat.start, 0.34);
    return '<footer class="band">' +
      '<p style="opacity:' + o.toFixed(3) + ";transform:translateY(" + ((1 - o) * 9).toFixed(2) + 'px)">' +
      esc(beat.say) + "</p></footer>";
  }

  /* one drawing per scene */
  function svg(inner) {
    return '<div class="scene"><svg class="sf" viewBox="0 0 1168 440" xmlns="http://www.w3.org/2000/svg">' + inner + "</svg></div>";
  }

  /* How far the change INTO beat i has gone: it starts in the pause before the
     beat, so the picture is already moving when the voice arrives. */
  function into(t, i) { return inAt(t, BEATS[i].start - GAP, 0.5); }
  /* the previous beat's picture, fading out, and this one's, fading in */
  function crossfade(t, i, scene, draw) {
    var u = into(t, i), out = "";
    if (u < 1 && i > scene.first) out += G(draw(i - 1), { opacity: 1 - u });
    return out + G(draw(i), { opacity: u });
  }


  /* ==== marks shared by every film ============================================
     tools/lib/ehel-film-marks.js. A storyboard lists it first in
     renderer.scenes, so it sits between the engine's head and the film's own
     pictures, in the same scope: it uses the head's svg helpers and palette,
     and every film that uses it ticks, crosses, points and recaps alike.

     Everything is one object, MK, so a film's own function of the same name
     can never replace one of these without anybody noticing. Like the rest of
     a film, every mark is a pure function of the time it is given.

       MK.tick(cx, cy, r, p)  MK.cross(cx, cy, r, p, col)  MK.qmark(cx, cy, r, o)
                                  a round mark that pops in as p goes 0 -> 1
       MK.pop(markup, cx, cy, p)  any markup, popped in about (cx, cy)
       MK.ripple(x, y, t, at, col)  a tap: a ring that spreads and fades
       MK.finger(x, y, op)        a pointing finger whose tip is at (x, y)
       MK.pic(cx, cy, size, pic, extra)
                                  an emoji, or one of the lesson's <svg> drawings,
                                  centred on (cx, cy); a Science film gets the
                                  kit's own drawing for an emoji too new for old
                                  devices, as the lesson does
       MK.arrow(x1, y1, x2, y2, u, col, w)
                                  an arrow that grows from (x1, y1) to (x2, y2)
       MK.leader(x1, y1, x2, y2, u, col)
                                  a line that draws itself, ending in a dot
       MK.waves(x, y, t, at, o)   sound spreading from (x, y) while it plays
       MK.glow(cx, cy, r, col, o) a soft pool of light
       MK.pill(x, y, text, o, opt) a word in a rounded box
       MK.bubble(x, y, w, h, text, o, tx, ty)
                                  a speech bubble whose tail points at (tx, ty)
       MK.list(x, y, rows, t, opt) rows that appear as they are said, each
                                  with a tick or a cross when it is decided
       MK.titleKind(opt)          the spoken title chapter, as a KINDS entry
       MK.recapKind(cards, opt)   the "what you now know" chapter, as a KINDS entry

  var MK = (function () {
    function tick(cx, cy, r, p) {
      if (!(p > 0)) return "";
      return G(C(cx, cy, r, "rgba(79,209,160,0.22)", P.good, r * 0.12) +
        Pth("M" + n2(cx - r * 0.42) + "," + n2(cy + r * 0.02) + " L" + n2(cx - r * 0.1) + "," + n2(cy + r * 0.34) +
          " L" + n2(cx + r * 0.46) + "," + n2(cy - r * 0.32), null, P.good, r * 0.2),
        { transform: around(cx, cy, p), opacity: Math.min(1, p) });
    }

    function cross(cx, cy, r, p, col) {
      if (!(p > 0)) return "";
      col = col || P.bad;
      var d = r * 0.36;
      return G(C(cx, cy, r, "rgba(240,128,111,0.18)", col, r * 0.12) +
        L(cx - d, cy - d, cx + d, cy + d, col, r * 0.2) + L(cx + d, cy - d, cx - d, cy + d, col, r * 0.2),
        { transform: around(cx, cy, p), opacity: Math.min(1, p) });
    }

    function qmark(cx, cy, r, o) {
      if (!(o > 0)) return "";
      return G(C(cx, cy, r, P.cell, P.line, 2) + Tx(cx, cy + r * 0.42, "?", "lab muted", "middle", { "font-size": r * 1.2 }), { opacity: o });
    }

    function pop(markup, cx, cy, p) {
      if (!(p > 0)) return "";
      return G(markup, { transform: around(cx, cy, p), opacity: Math.min(1, p) });
    }

    function ripple(x, y, t, at, col) {
      if (at == null || t < at || t > at + 0.8) return "";
      var u = (t - at) / 0.8;
      return C(x, y, 8 + 36 * u, "none", col || P.ink, 1 + 4 * (1 - u), { opacity: 1 - u }) +
        (u < 0.3 ? C(x, y, 11, col || P.ink, null, null, { opacity: 0.55 * (1 - u / 0.3) }) : "");
    }

    function finger(x, y, op) {
      if (!(op > 0)) return "";
      return G(Em(x + 5, y + 27, 50, "\u{1F446}"), { opacity: op });
    }

    function pic(cx, cy, size, p, extra) {
      var s = String(p == null ? "" : p);
      if (typeof ART === "object" && ART && ART.icon) s = ART.icon(s);
      /* markup around one of the kit's drawings (the lesson's zoom scene gives
         its country as <span><svg ...></span>): draw the drawing. Anything else
         starting with "<" would break the film's svg, so it is refused. */
      if (s.charAt(0) === "<" && s.slice(0, 4) !== "<svg") {
        var inner = s.match(/<svg[\s\S]*<\/svg>/);
        if (!inner) throw new Error("MK.pic: markup with no drawing in it: " + s.slice(0, 40));
        s = inner[0];
      }
      if (s.slice(0, 4) === "<svg") {
        var body = s.replace(/ width="1em" height="1em"/, "").replace(/ style="vertical-align:[^"]*"/, "");
        return G('<svg x="' + n2(cx - size / 2) + '" y="' + n2(cy - size / 2) + '" width="' + n2(size) + '" height="' + n2(size) + '"' + body.slice(4), extra);
      }
      return Em(cx, cy, size, s, extra);
    }

    /* The head never reaches back past the tail: while the arrow is still short
       the head shrinks with it (it used to hang behind the tail, and poked out
       of the box for a few frames when a tail sat near the edge). */
    function arrow(x1, y1, x2, y2, u, col, w) {
      if (!(u > 0)) return "";
      col = col || P.gold; w = w || 8;
      var ex = lerp(x1, x2, u), ey = lerp(y1, y2, u), a = Math.atan2(y2 - y1, x2 - x1);
      var len = Math.hypot(ex - x1, ey - y1);
      if (len < 1) return "";
      var h = Math.min(w * 2.6, len * 0.7);
      var bx = ex - Math.cos(a) * h * 0.8, by = ey - Math.sin(a) * h * 0.8;
      return L(x1, y1, bx, by, col, w) +
        Pth("M" + n2(ex) + "," + n2(ey) +
          " L" + n2(ex - Math.cos(a) * h - Math.sin(a) * h * 0.62) + "," + n2(ey - Math.sin(a) * h + Math.cos(a) * h * 0.62) +
          " L" + n2(ex - Math.cos(a) * h + Math.sin(a) * h * 0.62) + "," + n2(ey - Math.sin(a) * h - Math.cos(a) * h * 0.62) + " Z", col, col, 2);
    }

    function leader(x1, y1, x2, y2, u, col) {
      if (!(u > 0)) return "";
      col = col || P.gold;
      var ex = lerp(x1, x2, u), ey = lerp(y1, y2, u);
      return L(x1, y1, ex, ey, col, 3) + C(x1, y1, 5, col) + (u >= 1 ? C(x2, y2, 7, col, P.ground, 2) : "");
    }

    /* o: {dir (radians, 0 = to the right), spread (radians), n rings, period s,
       reach px, col, until (time the sound stops; the rings then fade)} */
    function waves(x, y, t, at, o) {
      if (at == null || t < at) return "";
      o = o || {};
      var dir = o.dir || 0, spread = o.spread == null ? 0.9 : o.spread, n = o.n || 3, period = o.period || 1.2,
        reach = o.reach || 140, col = o.col || P.gold, fade = o.until == null ? 1 : 1 - clamp((t - o.until) / 0.5, 0, 1);
      if (fade <= 0) return "";
      var out = "", start = clamp((t - at) / 0.3, 0, 1);
      for (var k = 0; k < n; k++) {

          " A" + n2(r) + "," + n2(r) + " 0 0 1 " + n2(x + r * Math.cos(a1)) + "," + n2(y + r * Math.sin(a1)),
          null, col, 5, { opacity: (1 - ph) * fade * start });
      }
      return out;
    }

    /* One disc filled with a radial gradient that fades to nothing at its rim.
       (Three stacked see-through discs showed as grey plates on the dark cards.)
       The gradient is defined beside each glow, under an id made from its
       colour, so every definition of one id is the same and any of them serves. */
    function glow(cx, cy, r, col, o) {
      if (!(o > 0)) return "";
      col = col || P.gold;
      var id = "mkglow" + String(col).replace(/[^0-9a-zA-Z]/g, "");
      return '<defs><radialGradient id="' + id + '"><stop offset="0" stop-color="' + col + '" stop-opacity="0.42"/>' +
        '<stop offset="0.55" stop-color="' + col + '" stop-opacity="0.16"/><stop offset="1" stop-color="' + col + '" stop-opacity="0"/></radialGradient></defs>' +
        C(cx, cy, r, "url(#" + id + ")", null, null, { opacity: Math.min(1, o) });
    }

    /* opt: {size (px, 22), col (border), fill, ink, anchor ("middle")} */
    function pill(x, y, text, o, opt) {
      if (!(o > 0)) return "";
      opt = opt || {};
      var size = opt.size || 22, w = String(text).length * size * 0.56 + size * 1.3, h = size * 1.8;
      var left = opt.anchor === "start" ? x : opt.anchor === "end" ? x - w : x - w / 2;
      return G(R(left, y - h / 2, w, h, h / 2, opt.fill || P.card, opt.col || P.line, 2) +
        Tx(left + w / 2, y + size * 0.36, text, "lab", "middle", { "font-size": size, fill: opt.ink || P.ink }), { opacity: o });
    }

    function bubble(x, y, w, h, text, o, tx, ty) {
      if (!(o > 0)) return "";
      var mx = x + w / 2, tail = tx == null ? "" :
        Pth("M" + n2(mx - 16) + "," + n2(y + h - 2) + " L" + n2(tx) + "," + n2(ty) + " L" + n2(mx + 16) + "," + n2(y + h - 2) + " Z", P.paper);
      return G(tail + R(x, y, w, h, 22, P.paper) + Tx(mx, y + h / 2 + 9, text, "lab big dark", "middle"), { opacity: o, transform: around(mx, y + h, 0.9 + 0.1 * Math.min(1, o)) });
    }

    /* rows: [{text, at, mark: "tick" | "cross", markAt}]; a row appears at its
       time, and its mark pops in at markAt (or just after the row).
       opt: {lh (line height, 50), cls ("lab big"), markR (17)} */
    function list(x, y, rows, t, opt) {
      opt = opt || {};
      var lh = opt.lh || 50, cls = opt.cls || "lab big", mr = opt.markR || 17, out = "";
      rows.forEach(function (r, k) {
        var o = on(t, r.at, 0.4);
        if (o <= 0) return;
        var ry = y + k * lh;
        out += Tx(x + mr * 2 + 16, ry + 10, r.text, cls, "start", { opacity: o, transform: "translate(" + n2((1 - o) * 14) + ",0)" });
        var mAt = r.markAt != null ? r.markAt : r.at == null ? null : r.at + 0.3;
        if (r.mark === "tick") out += tick(x + mr, ry, mr, popIn(t, mAt, 0.35));
        else if (r.mark === "cross") out += cross(x + mr, ry, mr, popIn(t, mAt, 0.35));
        else out += C(x + mr, ry, 6, P.muted, null, null, { opacity: o });

    }

    /* ---- two chapters every film has ------------------------------------------ */

    /* The spoken title chapter: the film's motif large on the left, its title
       and a few lines on the right, rising in as the first two lines are said.
       opt: {sub: [lines], motif: function (o) -> <svg> (the film's titleMotif by default)} */
    function titleKind(opt) {
      opt = opt || {};
      return function (scene, beat, t, i) {
        var one = scene.first, two = scene.first + (scene.beats.length > 1 ? 1 : 0);
        var a = inAt(t, BEATS[one].start, 1.0), b = inAt(t, BEATS[two].start, 0.7);
        var motif = (opt.motif || titleMotif)({ t: t, scene: scene, i: i, spoken: true });
        return '<div class="title">' +
          '<div class="tfig glow" style="opacity:' + (0.18 + a * 0.82).toFixed(3) +
            ";transform:translateY(" + ((1 - a) * 26).toFixed(2) + "px) scale(" + (0.94 + a * 0.06).toFixed(3) + ')">' + motif + "</div>" +
          '<div class="tw">' +
            '<p class="eyebrow" style="opacity:' + a.toFixed(3) + '">' + esc(F.subtitle) + " · Unit lecture</p>" +
            '<h1 style="text-wrap:balance;opacity:' + a.toFixed(3) + ";transform:translateY(" + ((1 - a) * 16).toFixed(2) + 'px)">' + esc(F.title) + "</h1>" +
            '<p class="tsub" style="opacity:' + b.toFixed(3) + ";transform:translateY(" + ((1 - b) * 12).toFixed(2) + 'px)">' +
              (opt.sub || []).map(esc).join("<br>") + "</p>" +
          "</div></div>";
      };
    }

    /* "What you now know": one card per idea, lit as it is said.
       cards: [{beat: k (the scene's k-th beat), at: cue name, title, sub, pic}]
       where pic is an emoji, one of the lesson's <svg> drawings, or a function
       (cx, cy, size, t) -> markup. opt: {goBeat, goAt}: from that cue every
       lit card breathes, for the film's last line. */
    /* The grid sits inside a 4 px margin, so a lit card's border (3 px, and a
       pop-in that overshoots) stays inside the 1168 x 440 box. A card's second
       line is lab mid, the brief's smallest size for words in a picture. */
    function recapKind(cards, opt) {
      opt = opt || {};
      var M = 4, n = cards.length, cols = n <= 3 ? n : n === 4 ? 2 : 3, rows = Math.ceil(n / cols), gap = 14;
      var w = (1168 - 2 * M - (cols - 1) * gap) / cols, h = Math.min(212, (440 - 2 * M - (rows - 1) * gap) / rows);
      var top = (440 - rows * h - (rows - 1) * gap) / 2;
      return function (scene, beat, t, i) {
        var out = "", go = opt.goAt ? sc(scene, opt.goBeat || 0, opt.goAt) : null;
        cards.forEach(function (c, k) {
          var row = Math.floor(k / cols), inRow = row < rows - 1 ? cols : n - cols * (rows - 1);
          var x = (1168 - inRow * w - (inRow - 1) * gap) / 2 + (k % cols) * (w + gap), y = top + row * (h + gap);
          var p = popIn(t, sc(scene, c.beat, c.at), 0.4), lit = p > 0;
          var pulse = go != null && t >= go ? 0.6 + 0.4 * breathe(t + k * 0.4) : 1;
          var size = h * 0.44, cx = x + w / 2, cy = y + h * 0.36;
          var art = typeof c.pic === "function" ? c.pic(cx, cy, size, t) : pic(cx, cy, size, c.pic);
          out += G(R(x, y, w, h, 22, lit ? "#1B3A52" : P.card, lit ? P.teal : P.line, lit ? 3 : 2, { "stroke-opacity": lit ? pulse : 1 }) +
            art + Tx(cx, y + h - 42, c.title, "lab big", "middle") +
            (c.sub ? Tx(cx, y + h - 15, c.sub, "lab mid muted readable", "middle") : ""),
            { opacity: 0.32 + 0.68 * Math.min(1, p), transform: around(cx, y + h / 2, lit ? 0.96 + 0.04 * Math.min(p, 1.08) : 0.96) });
        });

      };
    }

    return {
      tick: tick, cross: cross, qmark: qmark, pop: pop, ripple: ripple, finger: finger, pic: pic,
      arrow: arrow, leader: leader, waves: waves, glow: glow, pill: pill, bubble: bubble, list: list,
      titleKind: titleKind, recapKind: recapKind
    };
  })();

  /* ==== Professor Adow TVET — Replace a Broken Tile ========================
     The pictures of the tiling film, between the shared engine's head and
     tail (tools/lib/ehel-film-engine-head.js explains the assembly).

     EVERY TOOL WORKS. The first cut of this film faded things in and out and
     nothing ever travelled: measured against the halving-joint film it had
     16 fewer lerps — none at all — and a learner saw a static chisel beside a
     shape that changed by itself. For a learner at grade 8 to 12 who has
     never done this, the MOVEMENT is the teaching: which way the rake runs,
     how far the drill goes in, that the chisel is struck rather than pushed,
     that the spreader travels across the back of the tile. So every scene
     here has a tool that moves, and something that comes off the work when
     it does — dust, crumbs, shavings, fragments.

     EVERY FRAME SHOWS THE NEIGHBOURS. The broken tile is never drawn alone,
     because it is never alone on a wall and because the sound tiles around
     it ARE the difficulty of the job.

     THE JOINTS ARE GAPS, NOT LINES: the wall is a bed with tiles laid on it,
     so a raked joint is an empty channel and a grouted one is the bed covered
     over, with no redrawing.

     THE ANIMATION IS CUED OFF THE WORDS. cue(beat, name) is the measured
     moment a phrase is spoken, so the chisel bites as the narrator says
     "starts in the middle". Motion that has no phrase of its own is timed
     from the beat itself with beatU(). */

  /* ---- the materials --------------------------------------------------- */
  var TILE = "#DCE6EA", TILE_D = "#A8BCC6", TILE_NEW = "#EEF6F9";
  var GROUT = "#8C9AA3", BED = "#6E5B4A", BED_D = "#54453A";
  var STEEL = "#B9C6D0", STEEL_D = "#7E8E9B", HANDLE = "#7A4A22", HANDLE_D = "#5E3A1B";
  var TAPE = "#E8D9A0", ADH = "#CFCAC0", SKIN = "#C98A5B", SKIN_D = "#96683F";

  var HUE = {
    title: P.teal, ppe: P.accent, mask: P.gold, rake: P.blue,
    chip: P.accent, bed: P.plum, fit: P.gold, set: P.good,
    grout: P.teal, recap: P.teal
  };

  /* ---- time ------------------------------------------------------------- */

  /* 0..1 across the SPOKEN part of beat i, for motion that belongs to the
     whole sentence rather than to one phrase in it. */
  function beatU(t, i) {
    var b = BEATS[i], end = spokenEnd(i);
    return clamp((t - b.start) / Math.max(0.2, end - b.start), 0, 1);
  }

  /* A tool being struck: travels back, lands, recoils. Returns how far it is
     drawn back (0 at the work, 1 at the top of the swing), which blow number
     this is, and a short spike at the moment of contact for the debris. */
  function strike(t, at, period) {
    if (at == null || t < at) return { back: 1, blow: -1, hit: 0 };
    var e = t - at, ph = (e % period) / period;
    var back = ph < 0.55 ? 1 - ease(ph / 0.55) : ease((ph - 0.55) / 0.45);
    return { back: back, blow: Math.floor(e / period), hit: ph > 0.5 && ph < 0.66 ? 1 - (ph - 0.5) / 0.16 : 0 };
  }

  /* ---- debris ----------------------------------------------------------- */
  function dust(cx, cy, amount, col) {
    if (!(amount > 0)) return "";
    var out = "";
    for (var k = 0; k < 7; k++) {
      var a = (k / 7) * Math.PI * 2, r = 9 + amount * 26;
      out += C(cx + Math.cos(a) * r, cy + Math.sin(a) * r * 0.6 - amount * 9,
        2.4 + (k % 2), col || BED_D, "none", 0, { opacity: 0.6 * (1 - amount) });
    }
    return out;
  }

  function crumbs(x, y, p, n, col) {
    if (!(p > 0)) return "";
    var out = "";
    for (var k = 0; k < (n || 5); k++) {
      var u = clamp(p * 1.5 - k * 0.12, 0, 1);
      if (u <= 0) continue;
      out += R(x + k * 9 - 12, y + u * u * 58, 4, 3.5, 1, col || GROUT, "none", 0,
        { opacity: 0.85 * (1 - u * 0.8) });
    }
    return out;
  }

  function shaving(x, y, p, col) {
    if (!(p > 0) || p > 1) return "";
    var r = 7 + p * 5;
    return Pth("M" + n2(x) + "," + n2(y) + "q" + n2(r) + ",-" + n2(r) + " " + n2(2 * r) + ",0",
      "none", col || ADH, 3, { opacity: 0.9 * (1 - p) });
  }

  /* ---- the wall --------------------------------------------------------- */
  var TW = 116, TH = 92, J = 9;
  var WX = 380, WY = 96;
  var TARGET = 5;

  function tileXY(i) {
    var c = i % 4, r = Math.floor(i / 4);
    return [WX + c * (TW + J), WY + r * (TH + J)];
  }

  function crack(x, y, p) {
    p = p == null ? 1 : clamp(p, 0, 1);
    var d1 = "M" + (x + 14) + "," + (y + 70) + "L" + (x + 44) + "," + (y + 36) +
      "L" + (x + 37) + "," + (y + 52) + "L" + (x + 74) + "," + (y + 18);
    var d2 = "M" + (x + 44) + "," + (y + 36) + "L" + (x + 86) + "," + (y + 62) +
      "L" + (x + 108) + "," + (y + 30);
    /* the crack DRAWS ON rather than appearing: a learner sees it travel */
    return Pth(d1, "none", P.bad, 3, { "stroke-dasharray": 150, "stroke-dashoffset": n2(150 * (1 - p)) }) +
      Pth(d2, "none", P.bad, 2.5, { "stroke-dasharray": 110, "stroke-dashoffset": n2(110 * (1 - Math.max(0, p * 1.6 - 0.6))) });
  }

  /* o: { broken, crackP, missing, lumpy, newTile, rakedP, holes, tapeP, hole, lift } */
  function wall(o) {
    o = o || {};
    var out = R(WX - J, WY - J, 4 * TW + 5 * J, 3 * TH + 4 * J, 4, GROUT, GROUT, 2, {});
    if (o.rakedP > 0) {
      var t0 = tileXY(TARGET), rx = t0[0], ry = t0[1], p = clamp(o.rakedP, 0, 1);
      /* the four joints empty in sequence, a quarter of the progress each */
      var seg = [0, 0.25, 0.5, 0.75].map(function (s) { return clamp((p - s) * 4, 0, 1); });
      out += R(rx - J, ry - J, (TW + 2 * J) * seg[0], J, 0, BED, BED_D, 1, {});
      out += R(rx + TW, ry - J, J, (TH + 2 * J) * seg[1], 0, BED, BED_D, 1, {});
      out += R(rx - J + (TW + 2 * J) * (1 - seg[2]), ry + TH, (TW + 2 * J) * seg[2], J, 0, BED, BED_D, 1, {});
      out += R(rx - J, ry - J + (TH + 2 * J) * (1 - seg[3]), J, (TH + 2 * J) * seg[3], 0, BED, BED_D, 1, {});
    }
    for (var i = 0; i < 12; i++) {
      var xy = tileXY(i), x = xy[0], y = xy[1];
      if (i === TARGET && o.missing) {
        out += R(x, y, TW, TH, 2, BED, BED_D, 2, {});
        if (o.lumpy > 0) {
          for (var k = 0; k < 4; k++) {
            var gone = clamp((o.sweep || 0) * 4 - k, 0, 1);
            if (gone >= 1) continue;
            out += E(x + 24 + k * 24, y + 28 + (k % 2) * 34, 15, 9, ADH, BED_D, 1,
              { opacity: clamp(o.lumpy, 0, 1) * (1 - gone) });
          }
        }
        continue;
      }
      if (i === TARGET && o.hole > 0) {
        var h = clamp(o.hole, 0, 1);
        out += R(x, y, TW, TH, 2, TILE, TILE_D, 2, {});
        out += R(x + TW / 2 - (TW / 2) * h, y + TH / 2 - (TH / 2) * h, TW * h, TH * h, 2, BED, BED_D, 1.5, {});
        continue;
      }
      out += R(x, y, TW, TH, 2, i === TARGET && o.newTile ? TILE_NEW : TILE, TILE_D, 2, {});
      if (i === TARGET && (o.broken || o.crackP > 0)) out += crack(x, y, o.crackP == null ? 1 : o.crackP);
    }
    if (o.tapeP > 0) out += tape(o.tapeP, o.lift);
    if (o.holes > 0) out += holes(o.holes);
    return out;
  }

  function tape(p, lift) {
    var xy = tileXY(TARGET), x = xy[0], y = xy[1], u = clamp(p, 0, 1);
    var out = "";
    var legs = [[x + 6, y + 6, x + TW - 6, y + TH - 6], [x + TW - 6, y + 6, x + 6, y + TH - 6]];
    for (var k = 0; k < 2; k++) {
      var g4 = legs[k], f = clamp(u * 2 - k, 0, 1);
      if (f <= 0) continue;
      out += Pth("M" + g4[0] + "," + g4[1] + "L" + n2(g4[0] + (g4[2] - g4[0]) * f) + "," +
        n2(g4[1] + (g4[3] - g4[1]) * f), "none", TAPE, 14, { "stroke-linecap": "butt", opacity: 0.93 });
    }
    /* peeling: the X lifts away to the upper right, carrying the tile with it */
    if (lift > 0) {
      return G(out, {
        transform: "translate(" + n2(lift * 150) + "," + n2(-lift * 96) + ") rotate(" + n3(lift * 22) + "," + (x + TW / 2) + "," + (y + TH / 2) + ")",
        opacity: 1 - lift * 0.35
      });
    }
    return out;
  }

  function holes(p) {
    var xy = tileXY(TARGET), x = xy[0], y = xy[1];
    var n = 10, u = clamp(p, 0, 1), out = "";
    for (var k = 0; k < n; k++) {
      var f = clamp(u * n - k, 0, 1);
      if (f <= 0) continue;
      var leg = k % 2, idx = Math.floor(k / 2), s = 0.18 + idx * 0.16;
      var px = leg ? x + TW - 6 - (TW - 12) * s : x + 6 + (TW - 12) * s;
      var py = y + 6 + (TH - 12) * s;
      out += C(px, py, 4.5 * f, "#1B2830", "none", 0, {});
    }
    return out;
  }

  /* index of the hole the drill is working on, and where it is */
  function holeAt(k) {
    var xy = tileXY(TARGET), x = xy[0], y = xy[1];
    var leg = k % 2, idx = Math.floor(k / 2), s = 0.18 + idx * 0.16;
    return [leg ? x + TW - 6 - (TW - 12) * s : x + 6 + (TW - 12) * s, y + 6 + (TH - 12) * s];
  }

  /* ---- the tools, which now move --------------------------------------- */
  function chiselFig(cx, cy, len, ang, bevel) {
    var inner = R(0, -9, len * 0.44, 18, 4, HANDLE, HANDLE_D, 2, {}) +
      R(len * 0.44, -6, len * 0.42, 12, 1, STEEL, STEEL_D, 2, {}) +
      Pth("M" + n2(len * 0.86) + "," + (bevel ? -6 : -7) + "L" + n2(len) + ",0L" +
        n2(len * 0.86) + "," + (bevel ? 6 : 7) + "z", STEEL, STEEL_D, 1.5, {});
    return G(inner, { transform: "translate(" + n2(cx) + "," + n2(cy) + ") rotate(" + n3(ang) + ")" });
  }

  function malletFig(cx, cy, ang) {
    return G(R(0, -7, 78, 14, 4, HANDLE, HANDLE_D, 2, {}) +
      R(-34, -22, 38, 44, 5, "#B8763A", "#8A5326", 2, {}),
      { transform: "translate(" + n2(cx) + "," + n2(cy) + ") rotate(" + n3(ang) + ")" });
  }

  function rakeFig(cx, cy, ang) {
    return G(R(0, -10, 54, 20, 5, HANDLE, HANDLE_D, 2, {}) +
      L(54, 0, 112, 0, STEEL_D, 5, {}) +
      Pth("M112,-9 l18,9 l-18,9 z", "#C9433A", "#8E2E28", 1.5, {}),
      { transform: "translate(" + n2(cx) + "," + n2(cy) + ") rotate(" + n3(ang) + ")" });
  }

  function drillFig(cx, cy, stopP) {
    return G(R(0, 0, 96, 36, 7, "#3C4B57", "#2A363F", 2, {}) +
      R(10, 36, 30, 30, 5, "#3C4B57", "#2A363F", 2, {}) +
      L(96, 18, 156, 18, STEEL_D, 6, {}) +
      (stopP > 0 ? R(128, 9, 15, 18, 2, TAPE, "#B2941F", 1.5, { opacity: stopP }) : ""),
      { transform: "translate(" + n2(cx) + "," + n2(cy) + ")" });
  }

  function spreaderFig(cx, cy, ang) {
    var teeth = "";
    for (var k = 0; k < 6; k++) teeth += R(6 + k * 12, 22, 6, 10, 0, P.ground, "none", 0, {});
    return G(R(-44, -8, 44, 20, 4, HANDLE, HANDLE_D, 2, {}) +
      R(0, -6, 78, 32, 2, STEEL, STEEL_D, 2, {}) + teeth,
      { transform: "translate(" + n2(cx) + "," + n2(cy) + ") rotate(" + n3(ang) + ")" });
  }

  function floatFig(cx, cy, ang) {
    return G(R(-50, -10, 100, 22, 3, "#D8D2C4", "#A79F8E", 2, {}) +
      R(-22, -30, 44, 20, 5, HANDLE, HANDLE_D, 2, {}),
      { transform: "translate(" + n2(cx) + "," + n2(cy) + ") rotate(" + n3(ang) + ")" });
  }

  /* a fingertip, for pressing a corner */
  function finger(cx, cy, press) {
    return G(Pth("M0,0 q14,-10 28,0 v34 q-14,10 -28,0 z", SKIN, SKIN_D, 2, {}) +
      E(14, 2, 14, 7, SKIN, SKIN_D, 1.5, {}),
      { transform: "translate(" + n2(cx) + "," + n2(cy + press * 5) + ")" });
  }

  function spacerFig(cx, cy, s) {
    var a = s * 0.3;
    return Pth("M" + (cx - s) + "," + (cy - a) + "h" + (s - a) + "v" + (-(s - a)) + "h" + (2 * a) +
      "v" + (s - a) + "h" + (s - a) + "v" + (2 * a) + "h" + (-(s - a)) + "v" + (s - a) +
      "h" + (-2 * a) + "v" + (-(s - a)) + "h" + (-(s - a)) + "z", P.gold, "#B2941F", 1.5, {});
  }

  function cap(x, y, s, p, col) {
    if (!(p > 0)) return "";
    return Tx(x, y, s, "lab big", "middle", { fill: col || P.ink, opacity: Math.min(1, p),
      transform: "translate(0," + n2((1 - Math.min(1, p)) * 9) + ")" });
  }
  function note(x, y, s, p, col) {
    if (!(p > 0)) return "";
    return Tx(x, y, s, "lab", "middle", { fill: col || P.muted, opacity: Math.min(1, p) });
  }

  /* ==== scenes ============================================================ */

  function sceneTitle(scene, beat, t) {
    var one = scene.first;
    var a = inAt(t, BEATS[one].start, 1.0);
    var cp = on(t, cue(one, "broken"), 1.1);          /* the crack travels */
    var n = on(t, cue(one, "eight"), 0.9);
    var out = wall({ crackP: cp });
    if (n > 0) {
      for (var i = 0; i < 12; i++) {
        if (i === TARGET) continue;
        var xy = tileXY(i);
        var pulse = 0.35 + 0.3 * breathe(t + i * 0.2);
        out += R(xy[0], xy[1], TW, TH, 2, "none", P.good, 3, { opacity: pulse * n });
      }
    }
    out += cap(584, 424, "one is ruined; the other eight are the job", n, P.teal);
    return svg(G(out, { opacity: 0.35 + a * 0.65 }));
  }

  function titleMotif(o) {
    var t = (o && o.t) || 0;
    return '<svg viewBox="0 0 360 360" role="img" aria-label="A wall of tiles with one cracked">' +
      G(R(0, 0, 100, 80, 2, TILE, TILE_D, 3, {}) +
        R(109, 0, 100, 80, 2, TILE, TILE_D, 3, {}) +
        R(0, 89, 100, 80, 2, TILE, TILE_D, 3, {}) +
        R(109, 89, 100, 80, 2, TILE, TILE_D, 3, {}) +
        Pth("M124,150 L150,110 L144,130 L182,100", "none", P.bad, 4, {}) +
        L(0, 186, 209, 186, P.teal, 3, { opacity: 0.5 + 0.3 * breathe(t) }),
        { transform: "translate(75,95)" }) +
      "</svg>";
  }

  /* PPE: a splinter is thrown off the tile and turned away by the lens, on a
     loop. The reason for goggles is a thing that happens, not a label. */
  function scenePpe(scene, beat, t, i) {
    var b0 = scene.first;
    var g = on(t, cue(b0, "goggles"), 0.7), gl = on(t, cue(b0, "gloves"), 0.7);
    var out = wall({ broken: true });
    if (g > 0) {
      var xy = tileXY(TARGET);
      var f = ((t - cue(b0, "goggles")) % 1.6) / 1.6;      /* one splinter every 1.6 s */
      var sx = lerp(xy[0] + 30, 262, clamp(f * 1.6, 0, 1));
      var sy = lerp(xy[1] + 20, 196, clamp(f * 1.6, 0, 1));
      if (f < 0.62) {
        out += Pth("M0,0 l11,4 l-8,6 z", "#EAF3F7", TILE_D, 1, {
          transform: "translate(" + n2(sx) + "," + n2(sy) + ") rotate(" + n3(f * 900) + ")", opacity: g });
      } else {
        /* deflected: it drops away below the lens */
        var d = (f - 0.62) / 0.38;
        out += Pth("M0,0 l11,4 l-8,6 z", "#EAF3F7", TILE_D, 1, {
          transform: "translate(" + n2(262 - d * 48) + "," + n2(196 + d * d * 150) + ") rotate(" + n3(d * 400) + ")",
          opacity: g * (1 - d) });
      }
      out += G(Pth("M0,20 q38,-26 76,0 q-10,26 -38,26 q-28,0 -38,-26 z", "#2E5A6E", "#1C3C4A", 2.5, {}) +
        E(23, 22, 14, 11, "#BEE3F0", "none", 0, { opacity: 0.85 }) +
        E(53, 22, 14, 11, "#BEE3F0", "none", 0, { opacity: 0.85 }),
        { transform: "translate(198,168)", opacity: g });
      out += note(236, 244, "goggles", g, P.accent);
    }
    if (gl > 0) {
      var grip = 0.5 + 0.5 * breathe(t * 0.6);
      out += G(Pth("M0,44 v-22 q0,-10 9,-10 q9,0 9,10 v-16 q0,-10 9,-10 q9,0 9,10 v13 q0,-10 9,-10 q9,0 9,10 v28 q0,18 -18,18 h-18 q-18,0 -18,-23 z",
        "#C96A3A", "#8E4623", 2.5, {}),
        { transform: "translate(206," + n2(292 + grip * 4) + ")", opacity: gl });
      out += note(236, 384, "gloves", gl, P.accent);
    }
    out += cap(584, 424, "neither of these is advice", Math.min(g, gl), P.accent);
    return svg(out);
  }

  /* Masking, then drilling: the drill TRAVELS hole to hole and plunges. */
  function sceneMask(scene, beat, t, i) {
    var b0 = scene.first, bD = b0 + 1;
    var out;
    if (i === b0) {
      var tp = on(t, cue(b0, "diagonals"), 1.5);
      out = wall({ broken: true, tapeP: tp });
      /* a fingertip runs along each strip as it is laid */
      if (tp > 0 && tp < 1) {
        var xy0 = tileXY(TARGET);
        var leg = tp < 0.5 ? 0 : 1, f = clamp(tp * 2 - leg, 0, 1);
        var ax = leg ? xy0[0] + TW - 6 : xy0[0] + 6, bx = leg ? xy0[0] + 6 : xy0[0] + TW - 6;
        out += finger(lerp(ax, bx, f) - 14, lerp(xy0[1] + 6, xy0[1] + TH - 6, f) - 18, 1);
      }
      out += cap(584, 424, "an X, corner to corner", on(t, cue(b0, "slipping"), 0.8), P.gold);
    } else {
      var hp = on(t, cue(bD, "holes"), 1.9);
      out = wall({ broken: true, tapeP: 1, holes: hp });
      var k = clamp(Math.floor(hp * 10), 0, 9);
      var hxy = holeAt(k);
      /* the drill plunges in and withdraws for each hole */
      var sub = clamp(hp * 10 - k, 0, 1);
      var plunge = sub < 0.5 ? ease(sub / 0.5) : 1 - ease((sub - 0.5) / 0.5);
      var dg = on(t, cue(bD, "depth"), 0.8);
      out += drillFig(hxy[0] - 168 + plunge * 14, hxy[1] - 18, dg);
      out += dust(hxy[0], hxy[1], hp > 0 ? 1 - plunge : 0, "#C6CED3");
      out += note(250, 300, "a wrap of tape = a depth stop", dg, P.accent);
      out += cap(584, 424, "the thickness of the tile, and no further", dg, P.gold);
    }
    return svg(out);
  }

  /* Raking: the rake travels each joint and the joint empties behind it. */
  function sceneRake(scene, beat, t, i) {
    var b0 = scene.first;
    var p = on(t, cue(b0, "four"), 2.2);
    var out = wall({ broken: true, rakedP: p });
    var xy = tileXY(TARGET);
    if (p > 0 && p < 1) {
      var side = Math.min(3, Math.floor(p * 4)), f = clamp(p * 4 - side, 0, 1);
      var px, py, ang;
      if (side === 0) { px = lerp(xy[0] - J, xy[0] + TW + J, f); py = xy[1] - J / 2; ang = 0; }
      else if (side === 1) { px = xy[0] + TW + J / 2; py = lerp(xy[1] - J, xy[1] + TH + J, f); ang = 90; }
      else if (side === 2) { px = lerp(xy[0] + TW + J, xy[0] - J, f); py = xy[1] + TH + J / 2; ang = 180; }
      else { px = xy[0] - J / 2; py = lerp(xy[1] + TH + J, xy[1] - J, f); ang = 270; }
      out += rakeFig(px - 130, py, ang === 90 || ang === 270 ? ang - 180 : ang);
      out += crumbs(px - 16, py + 6, (t * 1.6) % 1, 4, GROUT);
    } else if (p >= 1) {
      out += rakeFig(xy[0] + TW + 150, xy[1] + 20, 0);
    }
    out += cap(584, 424, "now it is an island", on(t, cue(b0, "island"), 0.8), P.blue);
    return svg(out);
  }

  /* Chipping: the chisel is STRUCK. The hole opens a step per blow, and each
     blow throws fragments. Then the tape peels and carries the tile away. */
  function sceneChip(scene, beat, t, i) {
    var b0 = scene.first, bE = b0 + 1;
    var xy = tileXY(TARGET);
    var out;
    if (i === b0) {
      var at = cue(b0, "middle");
      var s = strike(t, at, 0.62);
      var h = clamp((s.blow + 1) / 7, 0, 1) * (at != null && t >= at ? 1 : 0);
      out = wall({ broken: true, tapeP: 1, rakedP: 1, hole: h });
      var cx = xy[0] + TW / 2, cy = xy[1] + TH / 2;
      out += chiselFig(cx + 118 + s.back * 26, cy - 92 - s.back * 22, 150, 128, false);
      /* The swing is kept low deliberately: at -168 - back*60 the mallet head
         left the top of the 1168 x 440 box by 25 px at the top of every blow,
         which --sweep catches and --sample cannot, because it only ever looks
         0.75 s after a cue and the overshoot is mid-swing. */
      out += malletFig(cx + 226 + s.back * 40, cy - 124 - s.back * 40, 128);
      out += dust(cx, cy, s.hit, BED_D);
      if (s.hit > 0) {
        for (var k = 0; k < 3; k++) {
          var a2 = -2.2 + k * 0.7, d2 = (1 - s.hit) * 54;
          out += Pth("M0,0 l13,5 l-9,8 z", TILE, TILE_D, 1, {
            transform: "translate(" + n2(cx + Math.cos(a2) * d2) + "," + n2(cy + Math.sin(a2) * d2) + ")",
            opacity: s.hit });
        }
      }
      out += cap(584, 424, "from the centre, outwards", on(t, cue(b0, "middle"), 0.9), P.accent);
    } else {
      var lift = on(t, cue(bE, "adhesive"), 1.5);
      out = wall({ rakedP: 1, missing: lift > 0.45, hole: lift > 0.45 ? 0 : 1,
        tapeP: 1, lift: lift, lumpy: lift > 0.45 ? lift : 0 });
      out += cap(584, 424, "strike it — never lever it", on(t, cue(bE, "lever"), 0.8), P.bad);
    }
    return svg(out);
  }

  /* Clearing: the chisel SWEEPS across and the lumps go as it passes. */
  function sceneBed(scene, beat, t, i) {
    var b0 = scene.first;
    var sweep = on(t, cue(b0, "flat"), 2.0);
    var xy = tileXY(TARGET);
    var out = wall({ rakedP: 1, missing: true, lumpy: 1, sweep: sweep });
    var cx = lerp(xy[0] - 6, xy[0] + TW + 6, sweep);
    out += chiselFig(cx - 132, xy[1] + TH / 2 + 26, 140, -14, true);
    if (sweep > 0 && sweep < 1) out += shaving(cx + 6, xy[1] + TH / 2 + 8, (t * 1.3) % 1, ADH);
    out += note(584, 74, "bevel side DOWN, so the tool rides out of the work",
      on(t, cue(b0, "bevel"), 0.8), P.muted);
    out += cap(584, 424, "a flat bed, or nothing sits flush", sweep, P.plum);
    return svg(out);
  }

  /* The dry fit: the tile rocks, and a finger presses each corner in turn. */
  function sceneFit(scene, beat, t, i) {
    var b0 = scene.first;
    var r = on(t, cue(b0, "rocks"), 0.9);
    var xy = tileXY(TARGET);
    var out = wall({ rakedP: 1, missing: true, lumpy: 0.8 });
    var swing = Math.sin(t * 2.6);
    var tilt = -5 * swing * r;
    out += G(R(0, 0, TW, TH, 2, TILE_NEW, TILE_D, 2.5, {}),
      { transform: "translate(" + xy[0] + "," + (xy[1] - 6) + ") rotate(" + n3(tilt) + "," + (TW / 2) + "," + (TH / 2) + ")" });
    if (r > 0.3) {
      /* the finger presses whichever corner is currently high */
      var left = swing > 0;
      out += finger((left ? xy[0] + 6 : xy[0] + TW - 34), xy[1] - 58, Math.abs(swing));
      var gx = left ? xy[0] + TW - 16 : xy[0] + 4;
      out += R(gx, xy[1] - 10 + Math.abs(swing) * 5, 12, 4, 1, P.bad, "none", 0, { opacity: 0.8 * r });
    }
    out += cap(584, 424, "it rocks — that is the WALL talking, not the tile", r, P.gold);
    return svg(out);
  }

  /* Setting: the spreader travels across the back leaving ribs; then the tile
     moves into the hole and settles flush, and the spacers go in. */
  function sceneSet(scene, beat, t, i) {
    var b0 = scene.first, bS = b0 + 1;
    var xy = tileXY(TARGET);
    var out;
    if (i === b0) {
      var b = on(t, cue(b0, "sparingly"), 1.8);
      out = wall({ rakedP: 1, missing: true });
      var bx = xy[0] - 232, by = xy[1] + 4;
      var ribs = "";
      for (var k = 0; k < 6; k++) {
        var f = clamp(b * 6 - k, 0, 1);
        if (f <= 0) continue;
        ribs += R(12 + k * 17, 12, 10, (TH - 24) * f, 2, ADH, "none", 0, { opacity: 0.9 });
      }
      out += G(R(0, 0, TW, TH, 2, TILE_NEW, TILE_D, 2.5, {}) + ribs, { transform: "translate(" + bx + "," + by + ")" });
      if (b > 0 && b < 1) out += spreaderFig(bx + 16 + b * (TW - 20), by + TH + 34, -90);
      out += cap(584, 424, "sparingly — too much and it stands proud", b, P.good);
    } else {
      var f2 = on(t, cue(bS, "flush"), 1.5);
      out = wall({ rakedP: 1 - f2, missing: f2 < 0.95, newTile: f2 >= 0.95 });
      if (f2 < 0.95) {
        /* the tile travels in from the left and seats */
        out += G(R(0, 0, TW, TH, 2, TILE_NEW, TILE_D, 2.5, {}),
          { transform: "translate(" + n2(lerp(xy[0] - 232, xy[0], ease(f2))) + "," + n2(lerp(xy[1] + 4, xy[1], ease(f2))) + ")" });
      }
      var sp = on(t, cue(bS, "hours"), 0.7);
      if (sp > 0) {
        out += spacerFig(xy[0] - 4, xy[1] - 4, 11 * sp);
        out += spacerFig(xy[0] + TW + 4, xy[1] - 4, 11 * sp);
        out += spacerFig(xy[0] - 4, xy[1] + TH + 4, 11 * sp);
        out += spacerFig(xy[0] + TW + 4, xy[1] + TH + 4, 11 * sp);
      }
      out += cap(584, 424, "flush on all four edges, then left alone", sp, P.good);
    }
    return svg(out);
  }

  /* Grouting: the float sweeps diagonally across the joints, then the
     finishing tool runs one joint, then the polish passes over. */
  function sceneGrout(scene, beat, t, i) {
    var b0 = scene.first;
    var g = on(t, cue(b0, "grout"), 2.0);
    var xy = tileXY(TARGET);
    var out = wall({ newTile: true, rakedP: 1 - g });
    if (g > 0 && g < 1) {
      out += floatFig(lerp(xy[0] - 40, xy[0] + TW + 40, g), lerp(xy[1] - 40, xy[1] + TH + 40, g), -38);
    }
    var w = on(t, cue(b0, "which"), 1.2);
    if (w > 0 && w < 1) {
      /* the polish: a soft highlight travelling across the finished tile */
      out += R(lerp(xy[0] - 30, xy[0] + TW, w), xy[1], 26, TH, 2, P.ink, "none", 0, { opacity: 0.18 });
    }
    out += cap(584, 424, "and nobody can tell which one it was", w, P.teal);
    return svg(out);
  }

  function sceneRecap(scene, beat, t, i) {
    var b0 = scene.first;
    var rows = [
      ["protect", "goggles, gloves, and the eight sound tiles", P.accent, "protect"],
      ["release", "rake all four joints before you strike", P.blue, "release"],
      ["remove", "from the centre outwards, striking not levering", P.gold, "remove"],
      ["replace", "flat bed, sparing adhesive, flush, then wait", P.good, "replace"]
    ];
    var out = "";
    for (var k = 0; k < rows.length; k++) {
      var p = on(t, cue(b0, rows[k][3]), 0.5);
      if (!(p > 0)) continue;
      var yy = 130 + k * 66;
      /* each row slides in from the left rather than fading in place */
      var dx = (1 - Math.min(1, p)) * -60;
      out += G(R(250, yy, 670, 50, 10, P.cell, rows[k][2], 2, { opacity: 0.9 * p }) +
        Tx(274, yy + 31, rows[k][0], "lab", "start", { fill: rows[k][2], opacity: p }) +
        Tx(896, yy + 31, rows[k][1], "lab", "end", { fill: P.ink, opacity: p }),
        { transform: "translate(" + n2(dx) + ",0)" });
    }
    out += cap(584, 424, "the repair you cannot find is the finished one",
      on(t, cue(b0, "finished"), 0.8), P.teal);
    return svg(out);
  }

  var KINDS = {
    title: sceneTitle, ppe: scenePpe, mask: sceneMask, rake: sceneRake,
    chip: sceneChip, bed: sceneBed, fit: sceneFit, set: sceneSet,
    grout: sceneGrout, recap: sceneRecap
  };


  /* ==== the shared engine, second half ======================================
     The cards, the frame and the export. HUE, KINDS and titleMotif come from
     the film's scenes file (see ehel-film-engine-head.js). */
  if (typeof HUE !== "object" || typeof KINDS !== "object" || typeof titleMotif !== "function")
    throw new Error("the scenes file must define HUE, KINDS and titleMotif");

  /* ---- the title card and the end card ---------------------------------
     The maths film's cards: silent timeline segments, not beats. */
  function openCard(t) {
    var c = F.cards.open;
    var u = clamp((t - c.start) / Math.max(c.end - c.start, 0.001), 0, 1);
    var a = inAt(t, c.start + 0.15, 0.85);
    var b = inAt(t, c.start + 0.55, 0.9);
    var d = inAt(t, c.start + 1.15, 0.9);
    var out = 1 - ease((u - 0.86) / 0.14);
    return '<div class="card-slide open" style="opacity:' + (a * out).toFixed(3) + '">' +
      '<div class="cs-fig" style="opacity:' + (a * 0.13).toFixed(3) +
        ";transform:scale(" + (1.04 + u * 0.05).toFixed(4) + ')">' + titleMotif({ t: t }) + "</div>" +
      '<div class="cs-in">' +
        '<div class="cs-mark" style="opacity:' + a.toFixed(3) +
          ";transform:scale(" + (0.86 + a * 0.14).toFixed(3) + ')">' + esc(BRAND_MARK) + "</div>" +
        '<p class="eyebrow" style="opacity:' + a.toFixed(3) + '">' + esc(BRAND_NAME) + " · " + esc(F.subtitle) + "</p>" +
        '<h1 style="opacity:' + b.toFixed(3) + ";transform:translateY(" + ((1 - b) * 18).toFixed(2) + 'px)">' +
          esc(F.title) + "</h1>" +
        '<div class="cs-rule" style="transform:scaleX(' + d.toFixed(3) + ')"></div>' +
        '<p class="cs-by" style="opacity:' + d.toFixed(3) +
          ";transform:translateY(" + ((1 - d) * 8).toFixed(2) + 'px)">' +
          esc(BRAND_BY) + "</p>" +
        '<p class="cs-sub" style="opacity:' + inAt(t, c.start + 1.55, 0.8).toFixed(3) +
          '">' + esc(F.framework || "Cambridge Primary Computing 0059") + " · Stage " + esc(F.stage) + "</p>" +
      "</div></div>";
  }

  function endCard(t) {
    var c = F.cards.end;
    var u = clamp((t - c.start) / Math.max(c.end - c.start, 0.001), 0, 1);
    var a = inAt(t, c.start + 0.35, 0.8);
    var b = inAt(t, c.start + 0.85, 0.8);
    var codes = (F.objectives || []).map(function (o, n) {
      var k = inAt(t, c.start + 1.15 + n * 0.09, 0.5);
      return '<span style="opacity:' + k.toFixed(3) +
        ";transform:translateY(" + ((1 - k) * 8).toFixed(2) + 'px)">' + esc(o[0]) + "</span>";
    }).join("");
    return '<div class="card-slide end" style="opacity:' + a.toFixed(3) + '">' +
      '<div class="cs-fig" style="opacity:' + (a * 0.11).toFixed(3) +
        ";transform:scale(" + (1.0 + u * 0.05).toFixed(4) + ')">' + titleMotif({ t: t }) + "</div>" +
      '<div class="cs-in">' +
        '<p class="eyebrow" style="opacity:' + a.toFixed(3) + '">That is the whole lesson</p>' +
        '<h1 style="opacity:' + a.toFixed(3) + ";transform:translateY(" + ((1 - a) * 14).toFixed(2) + 'px)">' +
          esc(F.title) + "</h1>" +
        '<div class="cs-rule" style="transform:scaleX(' + b.toFixed(3) + ')"></div>' +
        '<p class="cs-cap" style="opacity:' + b.toFixed(3) + '">What this lesson covered</p>' +
        '<div class="cs-codes">' + codes + "</div>" +
        '<p class="cs-sign" style="opacity:' + inAt(t, c.start + 2.2, 0.8).toFixed(3) + '">' +
          '<span class="cs-mark sm">' + esc(BRAND_MARK) + "</span>" + esc(BRAND_NAME) + " · " + esc(F.subtitle) + "</p>" +
      "</div></div>";
  }

  /* ---- the frame --------------------------------------------------------- */
  function frame(t) {
    var film = document.getElementById("film");
    if (F.cards && t < F.cards.open.end) {
      film.style.setProperty("--hue", HUE.title);
      film.innerHTML = skin(openCard(t));
      return;
    }
    if (F.cards && t >= F.cards.end.start) {
      film.style.setProperty("--hue", HUE.recap);
      film.innerHTML = skin(endCard(t));
      return;
    }

    var i = beatAt(t);
    var beat = BEATS[i];
    var scene = F.scenes[beat.scene];
    var draw = KINDS[scene.kind];
    if (!draw) throw new Error("storyboard scene " + scene.id + ": no drawing for kind " + scene.kind);

    var fade = inAt(t, scene.start, 0.4);
    film.style.setProperty("--hue", HUE[scene.id] || P.teal);

    var span = Math.max(scene.end - scene.start, 0.001);
    var d = clamp((t - scene.start) / span, 0, 1);

    film.innerHTML = skin(
      chrome(scene, t) +
      '<main class="stage" style="opacity:' + fade.toFixed(3) +
        ";transform:translateY(" + ((1 - fade) * 14 - d * 4).toFixed(2) +
        "px) scale(" + (1 + d * 0.008).toFixed(4) + ')">' +
        heading(scene, t, i) +
        draw(scene, beat, t, i) +
      "</main>" +
      band(beat, t));
  }

  /* cues(i) is for checking, not rendering: when each named phrase of beat i
     is estimated to be said, so a frame can be taken exactly there */
  window.EHEL_FILM = {
    frame: frame,
    total: TOTAL,
    cues: function (i) {
      var at = (BEATS[i].art && BEATS[i].art.at) || {}, out = {};
      Object.keys(at).forEach(function (k) { out[k] = cue(i, k); });
      return { start: BEATS[i].start, spokenEnd: spokenEnd(i), cues: out };
    }
  };
})();


  /* ==== the slide driver ====================================================
     Appended AFTER the engine tail, and only when the page is built with
     --slides. It turns the same film into something a learner steps through
     at their own pace: one beat per slide, Back and Next, and the beat's own
     animation replayed on arrival rather than a frozen still.

     NOTHING IN THE ENGINE IS TOUCHED. The tail already ends by publishing

         window.EHEL_FILM = { frame: frame, total: TOTAL, cues: cues }

     and that is the whole contract this needs: frame(t) draws the film at
     any moment, cues(i) gives beat i's start and the moment its narration
     stops. Every film in the repo satisfies it, so this driver works for all
     of them, not just this one.

     WHY THE BEAT IS ANIMATED RATHER THAN FROZEN. A still has to be taken at
     some instant, and there is no instant that is right for every beat: at
     the moment the words stop, the halving joint in beat 2 has not finished
     closing, and "the two faces come together level" is the one thing that
     beat is for. Replaying the beat sidesteps the choice and is a better
     lesson anyway - the learner watches the plane travel, the saw cut and
     the joint close, as many times as they like.

     WHY THE HOLD TIME IS MEASURED AND NOT ASSUMED. After the narration stops
     a beat still has a gap before the next one, and some scenes keep moving
     into it while others have already begun to fade or have switched scene
     entirely - measured on the halving-joint film, 16 of 30 beats look
     different at the end of the beat than at the end of the words, and two
     render nothing at all there. So the driver finds, once at load, the last
     moment that still belongs to this beat, by asking the page: it steps
     forward while the narration band still reads as this beat's line. That
     is self-correcting, needs no per-film tuning, and cannot be wrong in the
     way a hand-picked offset can. */
  (function () {
    if (!window.EHEL_FILM || !window.FILM || !window.FILM.beats) return;

    var EF = window.EHEL_FILM;
    var BE = window.FILM.beats;
    var N = BE.length;
    var film = document.getElementById("film");

    /* The page's own stylesheet is the FILM's, and knows nothing about a
       learner pressing Next. These are the only rules the driver adds. */
    var css = document.createElement("style");
    css.textContent =
      /* The film's own stylesheet pins `body { width: 1280px; height: 720px }`,
         because a render page IS exactly one frame and never anything else.
         In a lesson iframe that is wrong twice over: the body stays 1280 wide
         however narrow the frame is, so everything centres inside 1280 and
         lands off to one side, with the narration band's first words past the
         left edge. Released here, and NOT by editing the film's stylesheet,
         which every other film still depends on. */
      "html,body{width:100%;min-width:0;max-width:100%;height:100%;" +
        "overflow:hidden;background:#0b1720}" +
      "body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;margin:0}" +
      /* overflow:hidden is load-bearing. A transform does NOT change layout
         size, so #film stays 1280 x 720 in the flow however small it is
         drawn; without clipping it here, that box overflows the flex column
         and drags the centring, which crops the narration band's first words
         off the left edge. */
      ".sl-fit{position:relative;flex:0 0 auto;overflow:hidden}" +
      ".sl-bar{display:flex;align-items:center;gap:10px;font:600 15px/1 Inter,system-ui,sans-serif}" +
      ".sl-bar button{font:inherit;padding:9px 16px;border-radius:999px;border:1px solid #2f4a5c;" +
        "background:#162836;color:#dbe9f2;cursor:pointer}" +
      ".sl-bar button:hover:not(:disabled){border-color:#4fbfa8;color:#fff}" +
      ".sl-bar button:disabled{opacity:.38;cursor:default}" +
      ".sl-bar #slCount{color:#8fa8b8;min-width:104px;text-align:center;font-variant-numeric:tabular-nums}" +
      "@media (prefers-reduced-motion:reduce){.sl-bar button{transition:none}}";
    document.head.appendChild(css);

    /* ---- fit the film to whatever it is shown in -------------------------
       The film is drawn at a fixed 1280 x 720. In a lesson it sits in an
       iframe that is rarely either. Scale it, rather than letting it spill
       or shrink to a corner. */
    var stageWrap = document.createElement("div");
    stageWrap.className = "sl-fit";
    film.parentNode.insertBefore(stageWrap, film);
    stageWrap.appendChild(film);

    function fit() {
      var s = Math.min(innerWidth / 1280, (innerHeight - 76) / 720);
      film.style.transformOrigin = "0 0";
      film.style.transform = "scale(" + s.toFixed(4) + ")";
      stageWrap.style.width = Math.round(1280 * s) + "px";
      stageWrap.style.height = Math.round(720 * s) + "px";
    }
    /* `resize` alone is not enough. In an iframe the first layout can happen
       AFTER the script runs, so a single fit() at init measures a viewport
       that is about to change and scales the film too large — it then sits
       cropped, and the narration band loses its first words off the left
       edge. Observe the element instead of trusting one measurement. */
    addEventListener("resize", fit);
    addEventListener("load", fit);
    if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);

    /* ---- what each beat's last frame is ---------------------------------
       Asked of the page, not assumed. bandOf(t) is the narration line the
       engine paints at t; while that still matches beat i's line, t is still
       beat i. */
    function bandOf(t) {
      EF.frame(t);
      var b = film.querySelector(".band");
      return b ? b.textContent.replace(/\s+/g, " ").trim() : "";
    }

    var HOLD = [], SPOKEN = [];
    (function measureHolds() {
      for (var i = 0; i < N; i++) {
        var c = EF.cues(i);
        SPOKEN.push(c.spokenEnd);
        var mine = bandOf(c.spokenEnd - 0.05);
        var limit = (i < N - 1 ? EF.cues(i + 1).start : EF.total) - 0.05;
        var t = c.spokenEnd - 0.05, best = t;
        while (t < limit) {
          t += 0.1;
          if (bandOf(t) !== mine) break;
          best = t;
        }
        HOLD.push(best);
      }
    })();

    /* ---- THE NARRATION, the same voice the film speaks ---------------------
       A deck with no voice is not the lecture, it is a picture book of it.
       One audio file on the MEASURED timeline — the same timeline the marks
       are cued off — so a beat is played by seeking to its start and stopping
       when its sentence ends. Nothing is re-bought and nothing is re-timed. */
    var audio = null, stopAt = null;
    /* window.FILM, not the engine's `F`: that name lives inside the engine's
       own IIFE and this driver is a separate one appended after it. Reaching
       for it threw a ReferenceError that took the WHOLE driver down - no
       bar, no slides, no narration - while the page still looked like a
       film, because the engine had already drawn frame zero. */
    if (window.FILM.narrationAudio) {
      audio = new Audio(window.FILM.narrationAudio);
      audio.preload = "auto";
      audio.addEventListener("timeupdate", function () {
        if (stopAt != null && audio.currentTime >= stopAt) { audio.pause(); stopAt = null; }
      });
    }
    function playAudio(i) {
      if (!audio) return;
      try { audio.currentTime = BE[i].start; } catch (e) { /* not seekable yet */ }
      stopAt = SPOKEN[i];
      /* Browsers refuse sound before the viewer has interacted, so the very
         first slide on load is usually silent. That is a rejected promise,
         not an error, and pressing Again or Next plays it. */
      var p = audio.play();
      if (p && p.catch) p.catch(function () {});
    }
    function stopAudio() { if (audio) { audio.pause(); stopAt = null; } }

    /* A click anywhere on the stage counts as the gesture that unblocks
       sound, so a learner who just presses play on slide one is not left
       wondering. Clicks on the bar are excluded: those buttons start their
       own slide's audio a moment later, and starting the old one first would
       clip a fraction of the previous sentence. */
    addEventListener("pointerdown", function (e) {
      if (!audio || !audio.paused) return;
      if (e.target && e.target.closest && e.target.closest(".sl-bar")) return;
      playAudio(at);
    });

    /* ---- the controls ---------------------------------------------------- */
    var bar = document.createElement("div");
    bar.className = "sl-bar";
    bar.innerHTML =
      '<button type="button" id="slBack" aria-label="Previous slide">&#8592; Back</button>' +
      '<button type="button" id="slAgain" aria-label="Play this slide again">&#8635; Again</button>' +
      '<span id="slCount" aria-live="polite"></span>' +
      '<button type="button" id="slNext" aria-label="Next slide">Next &#8594;</button>';
    document.body.appendChild(bar);

    var back = document.getElementById("slBack");
    var again = document.getElementById("slAgain");
    var next = document.getElementById("slNext");
    var count = document.getElementById("slCount");

    /* ---- playing one beat ------------------------------------------------ */
    var at = 0, raf = 0;

    function play(i) {
      cancelAnimationFrame(raf);
      at = i;
      /* The drawing and the voice both run in real time from the beat's
         start, so they stay together without being coupled: the sentence
         stops at its spoken end, the picture carries on to its hold. That is
         exactly what the film does. */
      playAudio(i);
      var from = BE[i].start, to = HOLD[i];
      var t0 = performance.now();
      (function step(now) {
        var t = from + (now - t0) / 1000;
        if (t >= to) { EF.frame(to); paint(); return; }
        EF.frame(t);
        raf = requestAnimationFrame(step);
      })(t0);
      paint();
    }

    function paint() {
      count.textContent = "Slide " + (at + 1) + " of " + N;
      back.disabled = at === 0;
      next.disabled = at === N - 1;
      next.textContent = at === N - 1 ? "The end" : "Next →";
    }

    back.addEventListener("click", function () { if (at > 0) play(at - 1); });
    next.addEventListener("click", function () { if (at < N - 1) play(at + 1); });
    again.addEventListener("click", function () { play(at); });
    addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight" && at < N - 1) play(at + 1);
      else if (e.key === "ArrowLeft" && at > 0) play(at - 1);
      else if (e.key === " ") { e.preventDefault(); play(at); }
    });

    /* Land on a slide WITHOUT replaying it: the beat's last frame, at once.
       A learner pressing Next wants to watch the plane travel and the joint
       close, so play() is the default — but a page deep-linking to slide 18
       should not make them sit through seven seconds first, and a check
       wanting the settled picture should not have to sleep for it. */
    function settle(i) {
      cancelAnimationFrame(raf);
      stopAudio();   /* an instant jump has no sentence to speak */
      at = Math.max(0, Math.min(N - 1, i | 0));
      EF.frame(HOLD[at]);
      paint();
    }

    /* A lesson page asks for a slide by number: the step that embeds this
       can deep-link, and the film answers. */
    addEventListener("message", function (e) {
      var d = e.data || {};
      if (d.ehelSlide != null) (d.settle ? settle : play)(Math.max(0, Math.min(N - 1, d.ehelSlide | 0)));
    });

    window.EHEL_SLIDES = { play: play, settle: settle, count: N, hold: HOLD,
                           audio: audio, at: function () { return at; } };

    fit();
    play(0);
  })();
</script>
</body></html>
