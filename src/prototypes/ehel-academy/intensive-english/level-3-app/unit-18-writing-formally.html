<!doctype html>
<html lang="en-GB">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="modulepreload" href="./learner-controls.js">
<link rel="modulepreload" href="./wehel.js">
<link rel="modulepreload" href="./course-shell.js">
<link rel="modulepreload" href="./seb-session.js">
<script>
  /* preconnect to whichever platform the launch names: DNS and TLS happen
     while the page parses, instead of in front of the first POST */
  (function () {
    try {
      var ep = new URLSearchParams(location.search).get("pwsEndpoint");
      if (!ep) return;
      var origin = new URL(ep, location.href).origin;
      var l = document.createElement("link");
      l.rel = "preconnect"; l.href = origin; l.crossOrigin = "anonymous";
      document.head.appendChild(l);
    } catch (e) { /* a malformed pwsEndpoint must not stop the lesson loading */ }
  })();
</script>
<title>Writing Formally</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Inter:wght@400;600;700;800&display=swap">
<style>
  /* ==================================================================
     THE BASE - lifted verbatim from the Grade 1 Mathematics standalone
     build (mathematics/grade-1-app/g1v2), because these two are meant to
     be one product. Everything above the ENGLISH heading further down is
     that build's design system unchanged: the same tokens, the same deck,
     the same gold action colour, the same voice bar.

     The light palette is declared first and then overridden by the Wehel
     block below, exactly as it is there. It is kept rather than deleted
     so a token the override forgets still resolves to something legible
     instead of to nothing.
     ================================================================== */
  :root {
    --ground: #F3F8F5; --card: #FFFFFF; --ink: #1B2A2F; --muted: #6B7F82; --line: #D6E3DE; --cell: #E4EEE9;
    --accent: #F26B2A; --accent-ink: #FFFFFF; --accent-soft: #FDE4D6;
    --teal: #1E8C86; --teal-soft: #D5EFEC; --plum: #8E5AA8; --gold: #C99700;
    --good: #2E8B57; --good-soft: #DCF3E4; --bad: #C4453A; --bad-soft: #F9DEDB;
    --shadow: 0 1px 2px rgba(27,42,47,0.06), 0 8px 24px rgba(27,42,47,0.08);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif; font-size: 20px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  h1, h2 { font-family: "Inter", "Segoe UI", sans-serif; font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; }
  p { margin: 0; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 4px solid var(--teal); outline-offset: 3px; }

  /* THE SKIP LINK. Off-screen until it is focused, then a real button in the
     top-left corner. It is not `display: none` and not `visibility: hidden` -
     either of those would take it out of the tab order and there would be
     nothing to focus. Moving it off-screen keeps it reachable by Tab while
     leaving the page looking untouched.

     z-index clears the two app bars, which are sticky at 40. A skip link that
     appears UNDER the chrome it exists to skip is a skip link nobody can see
     they have focused.

     THE FILL IS --ink, NOT --teal, and that is a contrast decision rather than
     a style one. This build is a single dark theme - the Wehel block below
     redefines every token from bare :root, so the light palette above it never
     renders and only the dark values matter. There --teal is #35BFB2, and the
     obvious teal-pill-with-white-text measures 2.3:1 on it. The link renders
     at 18px bold, which is below the 18.66px that would let it count as large
     text, so it needs 4.5:1 and not 3:1 - it fails twice over. --ink and
     --ground are the pair that is guaranteed to oppose each other whatever the
     palette does, and here they give a white pill with #142B3E text at 14.5:1
     (measured, not derived). Teal stays as the ring, which is the same 4px the
     buttons already focus with, so the link still reads as part of this
     product. */
  .skip { position: absolute; left: -9999px; top: 0; z-index: 100; }
  .skip:focus {
    left: 8px; top: 8px; padding: 12px 18px; border-radius: 12px;
    background: var(--ink); color: var(--ground); font-weight: 700; text-decoration: none;
    box-shadow: var(--shadow); outline: 4px solid var(--teal); outline-offset: 2px;
  }

  .wrap { max-width: 820px; margin: 0 auto; padding: 16px 16px 40px; }
  .hero { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 4px 14px; }
  .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--teal); white-space: nowrap; }
  .hero h1 { font-size: clamp(30px, 6vw, 44px); }
  .hero h1 em { font-style: normal; color: var(--accent); }
  /* THE DOT IS NOT THE TARGET ANY MORE. There are 23 of these — one per step —
     and each used to BE a 16px button with a 6px gap, so the tap area was 16px
     across with centres 22px apart. WCAG 2.5.8 asks for 24x24, and its spacing
     exception wants 24px between centres, so this failed on both counts in an
     app whose users are five and six years old.

     The button is now a 28px target with the dot drawn inside it by ::before,
     which buys the tap area without turning the rail into a row of fat circles:
     the dot a child SEES is the same 16px it always was. gap goes to 0 because
     the spacing now lives in the button's own box — leaving the 6px there would
     push the centres to 34px and cost a row on a phone for nothing.

     Every state moved to ::before with it. Leaving `background` on the button
     would paint the whole 28px square, which is what makes this look like a
     grid of blocks rather than a row of dots — check the dark-theme block
     further down if you change either one. */
  .dots { display: flex; flex-wrap: wrap; gap: 0; justify-content: flex-end; max-width: 45%; }
  /* 44px TOUCH TARGET, 16px DOT. The two numbers are different things and
     only one of them is the accessibility requirement: WCAG 2.5.5 asks for a
     44px TARGET, not a 44px mark, so the button grows and the circle inside
     it does not. A 44px dot would be a row of buttons the size of the text
     beside them; a 44px target with a 16px dot is the same rail a child
     already recognises, with a hit area their finger can actually land on.
     Was 28px, which cleared WCAG 2.5.8's 24px minimum but not this one. */
  .dots button { width: 44px; height: 44px; padding: 0; border: 0; background: none; display: grid; place-items: center; }
  .dots button::before { content: ""; width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; border: 2px solid var(--line); background: var(--card); }
  .dots button.now::before { background: var(--accent); border-color: var(--accent); transform: scale(1.2); }
  .dots button.done::before { background: var(--good); border-color: var(--good); }
  /* Growing the target costs rows, and on a phone the rail is capped at 45% of
     380px — six per row, five rows, 140px of dots above the lesson. Letting it
     take the full width below the title puts thirteen on a row and two rows on
     the screen, which is shorter than the 16px version ever was. The cap is
     what needs lifting, not the target size. */
  @media (max-width: 560px) {
    .hero { flex-wrap: wrap; }
    .dots { max-width: 100%; width: 100%; justify-content: flex-start; }
  }

  .deck { background: var(--card); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); padding: 22px; min-height: 520px; display: flex; flex-direction: column; }
  /* The deck carries tabindex="-1" so the skip link can move focus into it.
     That makes it focusable, and a browser that rings a programmatically
     focused container would draw a 4px outline around the whole lesson. The
     ring is kept for :focus-visible, which is what a genuine keyboard focus
     would match, and dropped for the skip link's own arrival. */
  .deck:focus { outline: none; }
  .deck:focus-visible { outline: 4px solid var(--teal); outline-offset: 3px; }
  .slide { display: none; flex: 1; flex-direction: column; gap: 14px; }
  .slide.active { display: flex; }
  .slide-head { display: flex; align-items: center; gap: 12px; }
  .slide-head .n { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--teal); color: #fff; font-family: "Inter", "Segoe UI", sans-serif; font-weight: 700; font-size: 20px; }
  .slide h2 { font-size: clamp(26px, 5vw, 36px); }
  .say { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; background: var(--teal-soft); font-size: 21px; }
  .say button { flex: 0 0 auto; width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--teal); color: #fff; font-size: 24px; display: grid; place-items: center; }
  .say button:active { transform: scale(0.94); }
  .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 8px 0; }
  .fb { min-height: 1.6em; font-family: "Inter", "Segoe UI", sans-serif; font-weight: 600; font-size: 24px; text-align: center; }
  .fb.good { color: var(--good); } .fb.bad { color: var(--bad); }
  /* The feedback and its Listen button are one row, built at run time by
     wireFeedbackListen(), which also copies the feedback's state class onto
     the button so a correction's speaker is red and a cheer's is green.
     The button is 28px - the step dots' size, over WCAG 2.5.8's 24px, and
     under the 44px a phone would want, for the same reason the dots are:
     it sits beside text, not in a row of its own. `.fb` keeps its
     1.6em min-height, so the row reserves its space whether or not there
     is anything to hear and the page does not jump on an answer. */
  .fbrow { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .fbsay {
    width: 28px; height: 28px; flex: 0 0 28px; padding: 0; border: 0; border-radius: 50%;
    background: none; color: inherit; font-size: 15px; line-height: 1; cursor: pointer;
    display: grid; place-items: center;
  }
  /* `display: grid` above is an AUTHOR rule and the browser's own
     `[hidden] { display: none }` is a user-agent rule, so without this line
     the author rule wins and `btn.hidden = true` hides nothing: the speaker
     sat under every empty feedback line, offering to read out nothing. The
     property said hidden and the page disagreed - caught by looking at it,
     not by asking the element. */
  .fbsay[hidden] { display: none; }
  .fbsay.good { color: var(--good); } .fbsay.bad { color: var(--bad); }
  .fbsay:hover { background: var(--line); }
  .fbsay:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .score { color: var(--muted); font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; text-align: center; }

  .bigbtns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .big { min-width: 64px; height: 64px; padding: 0 22px; border-radius: 18px; border: 0; background: var(--accent); color: var(--accent-ink); font-family: "Inter", "Segoe UI", sans-serif; font-weight: 700; font-size: 28px; box-shadow: 0 4px 0 rgba(0,0,0,0.15); }
  .big:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.15); }
  .big.teal { background: var(--teal); color: #fff; }
  .big.ghost { background: var(--card); color: var(--ink); border: 3px solid var(--line); box-shadow: none; }
  .big.small { height: 52px; font-size: 22px; }
  .big:disabled { opacity: 0.45; cursor: default; transform: none; }

  .choices { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .choice { min-width: 96px; height: 78px; padding: 0 18px; border-radius: 20px; border: 4px solid var(--line); background: var(--card); font-family: "Inter", "Segoe UI", sans-serif; font-weight: 700; font-size: 34px; transition: transform 100ms ease; }
  .choice.small { min-width: 80px; height: 64px; font-size: 24px; }
  .choice:active { transform: scale(0.96); }
  .choice.right { background: var(--good-soft); border-color: var(--good); }
  .choice.wrong { background: var(--bad-soft); border-color: var(--bad); }
  .choice:disabled { cursor: default; }

  /* stickers */
  .stickers { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; width: 100%; }
  .sticker { border-radius: 18px; border: 3px solid var(--line); background: var(--card); padding: 14px 10px; text-align: center; font-family: "Inter", "Segoe UI", sans-serif; font-weight: 700; font-size: 15px; }
  .sticker .ic { display: block; font-size: 38px; line-height: 1.2; }
  .sticker.got { background: var(--good-soft); border-color: var(--good); }
  .sticker:not(.got) .ic { filter: grayscale(1); opacity: 0.35; }

  .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 4px 0; }
  .foot .mid { color: var(--muted); font-family: "Inter", "Segoe UI", sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; }

  /* ==================================================================
     The Wehel design language, applied to the deck.

     One visual world on purpose: the design being adopted is a single
     dark theme, so every token is redefined here rather than left to the
     viewer's setting. The selector list carries the same specificity as
     the light block above and comes later, so it wins in both light and
     dark. The palette is Ehel Academy's own - gold #f4c95d is the action
     colour, teal #0f766e and coral #c2482c lifted to the same hues at a
     lightness that is legible on a dark ground.

     Copied from the Grade 1 Mathematics build. Do not re-solve it here:
     the two builds are meant to be indistinguishable in colour.
     ================================================================== */
  :root, :root:not([data-theme="light"]), :root[data-theme="dark"] {
    --ground: #0B1D2C;
    --card: #112A3D;
    --cell: #17384F;
    --line: #214560;
    --ink: #FFFFFF;
    --muted: #93AABE;
    --accent: #E9744F;
    --accent-ink: #2A1F05;
    --accent-soft: rgba(233, 116, 79, 0.18);
    --teal: #35BFB2;
    --teal-soft: #143A4A;
    --plum: #B78BD1;
    --gold: #F4C95D;
    --gold-press: #D0A326;
    --good: #4FD1A0;
    --good-soft: rgba(79, 209, 160, 0.18);
    --bad: #F0806F;
    --bad-soft: rgba(240, 128, 111, 0.18);
    --red: #F0806F;
    --blue: #6E9DE8;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 22px 50px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }

  body { background: var(--ground); color: var(--ink); font-size: 18px; }
  h1, h2 { letter-spacing: -0.02em; font-weight: 800; }

  .eyebrow { color: var(--teal); letter-spacing: 0.12em; }
  .hero h1 em { color: var(--teal); }

  /* ::before, matching the block above — the button itself stays transparent
     so the 28px tap area never paints. */
  .dots button::before { border: 2px solid var(--line); background: var(--card); }
  .dots button.now::before { background: var(--teal); border-color: var(--teal); }
  .dots button.done::before { background: var(--good); border-color: var(--good); }

  .deck {
    background: linear-gradient(160deg, #0E2434, #112A3D);
    border: 1px solid var(--line);
    border-radius: 26px;
    box-shadow: var(--shadow);
  }
  .slide-head .n { background: var(--teal); color: #06231F; font-weight: 800; }
  .slide h2 { font-weight: 800; }

  .say { background: var(--teal-soft); border: 1px solid #205468; }
  .say button { background: var(--teal); color: #06231F; }

  .big {
    background: var(--gold); color: var(--accent-ink);
    border-radius: 16px; font-weight: 800;
    box-shadow: 0 5px 0 var(--gold-press);
  }
  .big:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--gold-press); }
  .big.teal { background: var(--teal); color: #06231F; box-shadow: 0 5px 0 #1E8C86; }
  .big.teal:active { box-shadow: 0 2px 0 #1E8C86; }
  .big.ghost { background: rgba(255, 255, 255, 0.07); color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
  .big:disabled { opacity: 0.4; }

  .choice { background: var(--card); border: 3px solid var(--line); color: var(--ink); border-radius: 18px; font-weight: 800; }
  .choice.right { background: var(--good-soft); border-color: var(--good); }
  .choice.wrong { background: var(--bad-soft); border-color: var(--bad); }

  .fb.good { color: var(--good); } .fb.bad { color: var(--bad); }

  .sticker { background: var(--card); border: 1px solid var(--line); }
  .sticker.got { background: var(--good-soft); border-color: var(--good); }

  .foot .mid { color: var(--muted); }

  /* the fixed ground, painted by a pseudo-element rather than
     background-attachment, which iOS Safari does not honour */
  html { background: #183B56; }
  body { background: transparent; }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: linear-gradient(135deg, #183B56 0%, #24556B 100%);
  }
  :root, :root:not([data-theme="light"]), :root[data-theme="dark"] {
    --ground: #142B3E;
    --card: #1B3A52;
    --cell: #22485F;
    --line: #2B5673;
  }
  .deck { background: rgba(20, 43, 62, 0.88); }

  /* ---- the voice bar: the speaker reads the step, Explain walks
          through the idea behind it ---- */
  .say button.explain {
    flex: 0 0 auto;
    width: auto; height: auto;
    display: inline-flex; align-items: center; gap: 6px;
    margin-left: auto;
    padding: 9px 14px;
    border: 1px solid var(--teal, var(--accent));
    border-radius: 999px;
    background: transparent;
    color: var(--teal, var(--accent));
    font-family: inherit;
    font-size: 14px; font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .say button.explain:hover { background: color-mix(in srgb, var(--teal, var(--accent)) 14%, transparent); }
  .say button.explain:active { transform: scale(0.96); }
  body.voice-on .say button.speak {
    box-shadow: 0 0 0 0 color-mix(in srgb, var(--teal, var(--accent)) 55%, transparent);
    animation: voicePulse 1.5s ease-out infinite;
  }
  @keyframes voicePulse { to { box-shadow: 0 0 0 14px transparent; } }
  @media (prefers-reduced-motion: reduce) {
    body.voice-on .say button.speak { animation: none; }
  }
  @media (max-width: 420px) {
    .say button.explain .explain-t { display: none; }
    .say button.explain { width: 44px; height: 44px; padding: 0; justify-content: center; font-size: 18px; }
  }

  /* ==================================================================
     ENGLISH

     Everything below is this build's own. The rule it follows is that a
     new control borrows an existing token rather than introducing a
     colour: gold is the action, teal is the voice and the taught thing,
     coral is the thing being counted or pointed at, good/bad are the
     only verdicts. Nothing here invents a hue.
     ================================================================== */

  /* ---- a word card: the picture, the word, what it means ---- */
  .wordcard { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .wordpic { font-size: clamp(64px, 15vw, 104px); line-height: 1.1; }
  .wordpic.none { font-size: clamp(40px, 9vw, 60px); opacity: 0.5; }
  .bigword { font-family: "Inter", "Segoe UI", sans-serif; font-weight: 800; font-size: clamp(40px, 9vw, 68px); line-height: 1.05; color: var(--teal); }
  .wordmeaning { max-width: 30ch; color: var(--ink); font-size: 19px; }
  .wordpos { color: var(--muted); font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .wordsentence { max-width: 34ch; color: var(--muted); font-size: 17px; font-style: italic; }
  .wordsentencebox { width: 100%; max-width: 30em; border-radius: 16px; border: 1px solid var(--line);
    background: var(--cell); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; }
  .sentlabel { color: var(--teal); font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  .wordsentencebox .wordsentence { font-style: normal; color: var(--ink); font-size: 19px; max-width: none; }

  /* ---- a strip of word buttons, for tapping the word you heard ---- */
  .wordbtns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .wordbtn { min-width: 118px; padding: 14px 20px; border-radius: 18px; border: 3px solid var(--line);
    background: var(--card); color: var(--ink);
    font-family: "Inter", "Segoe UI", sans-serif; font-weight: 800; font-size: 30px; }
  .wordbtn .pic { display: block; font-size: 42px; line-height: 1.15; }
  .wordbtn:active { transform: scale(0.96); }
  .wordbtn.right { background: var(--good-soft); border-color: var(--good); }
  .wordbtn.wrong { background: var(--bad-soft); border-color: var(--bad); }
  .wordbtn:disabled { cursor: default; }

  /* ---- the story, one page at a time, with the line being read lit up.
          Gold, because it is the same "here you are" the dot rail uses. ---- */
  .story { width: 100%; max-width: 34em; display: flex; flex-direction: column; gap: 14px; }
  .story p { font-size: clamp(19px, 3.4vw, 23px); line-height: 1.6; }
  .story p.now { color: var(--gold); }
  .storytitle { font-family: "Inter", "Segoe UI", sans-serif; font-weight: 800; font-size: 26px; color: var(--teal); text-align: center; }

  /* ---- a rule card: what English does, said once and shown once ---- */
  .rule { width: 100%; max-width: 34em; display: flex; flex-direction: column; gap: 12px; }
  .rulepattern { font-family: "Inter", "Segoe UI", sans-serif; font-weight: 800;
    font-size: clamp(26px, 5vw, 38px); text-align: center; color: var(--gold); }
  .note { border-radius: 16px; border: 1px solid var(--line); background: var(--cell); padding: 12px 16px; font-size: 17px; }
  .note b { color: var(--teal); }
  .note.watch { border-color: var(--accent); background: var(--accent-soft); }
  .note.watch b { color: var(--accent); }

  /* ---- building a sentence by tapping words ---- */
  .build { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .buildline { min-height: 74px; width: 100%; max-width: 30em; display: flex; flex-wrap: wrap; gap: 8px;
    align-items: center; justify-content: center; padding: 12px;
    border-radius: 18px; border: 3px dashed var(--line); background: rgba(0,0,0,0.15); }
  .tile { padding: 10px 16px; border-radius: 14px; border: 3px solid var(--line); background: var(--card);
    color: var(--ink); font-family: "Inter", "Segoe UI", sans-serif; font-weight: 800; font-size: 24px; }
  .tile:active { transform: scale(0.96); }
  .buildline .tile { border-color: var(--teal); }
  .buildline.right { border-color: var(--good); border-style: solid; }
  .buildline.wrong { border-color: var(--bad); border-style: solid; }

  /* ---- say-it-out-loud: a model line, then the child's turn ---- */
  .saylines { width: 100%; max-width: 32em; display: flex; flex-direction: column; gap: 10px; }
  .sayline { display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    border-radius: 16px; border: 1px solid var(--line); background: var(--cell); font-size: 19px; }
  .sayline button.hear { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%; border: 0;
    background: var(--teal); color: #06231F; font-size: 20px; display: grid; place-items: center; }
  .sayline.said { border-color: var(--good); background: var(--good-soft); }
  .sayline .tick { margin-left: auto; flex: 0 0 auto; border-radius: 999px; border: 2px solid var(--line);
    background: transparent; color: var(--ink); font-size: 15px; font-weight: 700; padding: 7px 13px; }
  .sayline.said .tick { border-color: var(--good); color: var(--good); }

  /* ---- the question text above a set of choices ---- */
  .ask { max-width: 32ch; text-align: center; font-size: clamp(20px, 4vw, 26px); font-weight: 700;
    font-family: "Inter", "Segoe UI", sans-serif; }
  /* the book (or story) a question is about, above the question itself */
  .qbook { display: block; color: var(--teal); font-family: "Inter", "Segoe UI", sans-serif;
    font-size: 12.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em;
    margin-bottom: 6px; }

  .askpic { font-size: clamp(70px, 17vw, 120px); line-height: 1.1; }

  /* ---- long answers do not fit a 34px chunky button ---- */
  .choice.text { min-width: 0; width: 100%; max-width: 30em; height: auto; min-height: 62px;
    padding: 14px 18px; font-size: 20px; line-height: 1.35; text-align: left; }
  .choices.stack { flex-direction: column; align-items: stretch; width: 100%; }

  /* ---- Memory Pairs: reveal on tap, stay revealed once matched ---- */
  .pairsgrid { display: grid; grid-template-columns: repeat(2, minmax(140px, 1fr)); gap: 10px; width: 100%; max-width: 30em; }
  .pairtile { min-height: 76px; border-radius: 16px; border: 3px solid var(--line); background: var(--card);
    color: var(--ink); font-family: "Inter", "Segoe UI", sans-serif; font-weight: 700; font-size: 15px;
    line-height: 1.3; padding: 10px 12px; display: flex; align-items: center; justify-content: center; text-align: center; }
  .pairtile .face { display: none; }
  .pairtile .back { font-size: 26px; opacity: 0.6; }
  .pairtile.revealed .face, .pairtile.matched .face { display: block; }
  .pairtile.revealed .back, .pairtile.matched .back { display: none; }
  .pairtile.revealed { border-color: var(--teal); background: var(--teal-soft); }
  .pairtile.matched { border-color: var(--good); background: var(--good-soft); cursor: default; }
  .pairtile.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .pairtile:disabled { cursor: default; }

  /* ---- Picture books: the shelf, and the full-screen reader ---- */
  /* a stage that holds a shelf fills the slide - see the note in
     lesson-app-tools' sibling scripts: #stageN is a flex ITEM, so a
     child's width:100% resolves against a box shrunk to one card. */
  .stagewide { width: 100%; }
  .reviewnote { color: var(--muted); font-size: 13.5px; text-align: center;
    margin: 0; font-style: italic; }
  .shelf { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; width: 100%; }
  .bookcard { display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 18px;
    border: 3px solid var(--line); background: var(--card); text-align: left; }
  .bookcard .bookicon { font-size: 34px; line-height: 1; }
  .bookcard .booktitle { font-family: "Inter", "Segoe UI", sans-serif; font-weight: 800; font-size: 18px; }
  .bookcard .bookmeta { color: var(--muted); font-size: 13.5px; }
  .bookcard .big { margin-top: auto; align-self: flex-start; }

  .book-reader { position: fixed; inset: 0; z-index: 200; background: var(--ground);
    display: flex; flex-direction: column; }
  .book-reader-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; }
  .book-reader-top .booktitle { font-family: "Inter", "Segoe UI", sans-serif; font-weight: 800; font-size: 17px; }
  .book-close { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font-size: 18px; }
  .book-stage-wrap { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 10px; }
  .book-stage { position: relative; width: 100%; max-width: 720px; aspect-ratio: 1600 / 1000;
    border-radius: 18px; overflow: hidden; background: var(--card); border: 1px solid var(--line); }
  .book-stage svg { width: 100%; height: 100%; display: block; }
  .book-stage [data-tap] { cursor: pointer; }
  @keyframes tapPulse { 0% { filter: brightness(1); } 40% { filter: brightness(1.35); } 100% { filter: brightness(1); } }
  .book-stage [data-tap].tap-play { animation: tapPulse 700ms ease; }
  .book-reader-bottom { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px 14px 18px; flex-wrap: wrap; }
  .book-page-count { color: var(--muted); font-family: "Inter", "Segoe UI", sans-serif; font-weight: 700; font-size: 14px; min-width: 5em; text-align: center; }

  /* ---- the unit's video lesson ---- */
  .lecture { width: 100%; max-width: 720px; }
  .lecturevideo { width: 100%; display: block; border-radius: 18px; border: 1px solid var(--line);
    background: #000; aspect-ratio: 16 / 9; }

  /* ---- the Game Zone shelf ---- */
  .gamelist .gamecard.played { border-color: var(--good); background: var(--good-soft); }
  .game-overlay .game-stage { width: 100%; max-width: 720px; display: flex; flex-direction: column;
    align-items: center; gap: 14px; padding: 10px 0; }
  .game-overlay .gameprompt { font-family: "Inter", "Segoe UI", sans-serif; font-weight: 800;
    font-size: 21px; text-align: center; margin: 0; }
  .game-overlay .gameclue { color: var(--muted); font-size: 17px; text-align: center; margin: 0; max-width: 30em; }
  .game-overlay .fb { min-height: 1.6em; }
  .game-overlay .pairsgrid { max-width: 640px; }
  .tile.letter { min-width: 54px; text-align: center; text-transform: lowercase; font-size: 26px; }
  .game-done { text-align: center; }
  .game-done .gamebig { font-family: "Inter", "Segoe UI", sans-serif; font-weight: 800; font-size: 30px; margin: 0 0 6px; }

  /* ---- story questions for each book ---- */
  .bookq { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
  .bookq-scene { margin: 0; width: 100%; max-width: 520px; border-radius: 18px; overflow: hidden;
    border: 1px solid var(--line); background: var(--card); }
  .bookq-scene img { width: 100%; display: block; aspect-ratio: 1600 / 1000; object-fit: cover; }
  .bookq-pictures { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 640px; }
  .bookq-picture { position: relative; padding: 0; border-radius: 16px; overflow: hidden;
    border: 4px solid var(--line); background: var(--card); }
  .bookq-picture img { width: 100%; display: block; aspect-ratio: 1600 / 1000; object-fit: cover; }
  .bookq-picture.right { border-color: var(--good); }
  .bookq-picture.wrong { border-color: var(--bad); }
  .bookq-picture:disabled { cursor: default; opacity: 0.85; }
  .bookq-order-badge { position: absolute; top: 6px; left: 6px; min-width: 28px; height: 28px;
    border-radius: 999px; background: var(--teal); color: #fff; font-family: "Inter", "Segoe UI", sans-serif;
    font-weight: 800; font-size: 15px; display: grid; place-items: center; }
  .bookq-nav { margin-top: 4px; }
  @media (max-width: 560px) {
    .bookq-pictures { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .bookq-picture { border-width: 3px; }
  }

  /* ---- speaking: record, check, and the feedback ---- */
  .speech { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
  .speech-target { width: 100%; max-width: 30em; text-align: center; padding: 14px 16px;
    border-radius: 18px; border: 3px solid var(--teal); background: var(--card); }
  .speech-target span { display: block; color: var(--muted); font-size: 13.5px;
    font-family: "Inter", "Segoe UI", sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .speech-target p { margin: 6px 0 0; font-size: 24px; font-weight: 700; }
  .big.recording { background: var(--bad); color: #fff; }
  .speech-fb { width: 100%; max-width: 30em; text-align: center; min-height: 1.4em; }
  .speech-note { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
  .speech-score { color: var(--muted); font-size: 13.5px; margin: 6px 0 0; }
  .speech-words { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 8px; }
  .speech-word { padding: 5px 12px; border-radius: 999px; font-weight: 700; font-size: 17px;
    border: 2px solid var(--line); background: var(--card); }
  .speech-word.good { border-color: var(--good); background: var(--good-soft); }
  .speech-word.soft { border-color: var(--warn, #e0a83a); }
  .speech-word.miss { border-color: var(--line); color: var(--muted); text-decoration: line-through; }
  .speech-sound { margin: 8px 0 0; font-size: 17px; }
  .speech-sound .phoneme { display: inline-block; padding: 3px 10px; border-radius: 10px;
    background: var(--teal); color: #fff; font-weight: 800; font-size: 20px; }

  /* the say-it-out-loud list, now that a line can open a recorder */
  .sayline .sayrow { display: flex; align-items: center; gap: 10px; }
  .sayspeech { margin: 12px 0 4px; }

  /* ---- the unit's hands-on jobs ---- */
  .acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; width: 100%; }
  .act { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 18px;
    border: 3px solid var(--line); background: var(--card); }
  .act.did { border-color: var(--good); background: var(--good-soft); }
  .act-head { display: flex; align-items: center; gap: 8px; }
  .act-n { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 999px; background: var(--teal); color: #fff;
    display: grid; place-items: center; font-family: "Inter", "Segoe UI", sans-serif; font-weight: 800; font-size: 15px; }
  .act-kind { flex: 1 1 auto; color: var(--muted); font-family: "Inter", "Segoe UI", sans-serif;
    font-weight: 700; font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; }
  .act-lead { margin: 0; font-size: 17px; font-weight: 700; }
  .act-steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 5px; font-size: 16px; }
  .act-how { align-self: flex-start; border: 2px dashed var(--line); background: transparent; color: var(--muted);
    border-radius: 12px; padding: 5px 12px; font-family: "Inter", "Segoe UI", sans-serif; font-weight: 700; font-size: 13.5px; }
  .act-check { margin: 0; font-size: 14.5px; color: var(--muted); border-left: 3px solid var(--teal); padding-left: 10px; }
  .act-check span { display: block; font-family: "Inter", "Segoe UI", sans-serif; font-weight: 800;
    font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--teal); margin-bottom: 2px; }
  .act .tick { margin-top: auto; align-self: flex-start; }

  /* ---- the unit's study plan ---- */
  .plan { width: 100%; display: flex; flex-direction: column; gap: 4px; }
  .plan-when { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 6px; }
  .plan-when > div { padding: 12px 14px; border-radius: 16px; border: 3px solid var(--teal); background: var(--card); }
  .plan-when > div.wide { grid-column: 1 / -1; }
  .plan-when span { display: block; color: var(--muted); font-family: "Inter", "Segoe UI", sans-serif;
    font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; }
  .plan-when strong { font-size: 20px; }
  .plan-note { color: var(--muted); font-size: 14px; margin: 8px 0; }
  .plan-day { display: grid; grid-template-columns: 74px 100px 1fr; gap: 10px; align-items: baseline;
    padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); }
  .plan-day.last { border-color: var(--teal); }
  .plan-wk { color: var(--teal); font-family: "Inter", "Segoe UI", sans-serif; font-weight: 800; font-size: 12.5px; }
  .plan-dow { color: var(--muted); font-family: "Inter", "Segoe UI", sans-serif; font-weight: 700; font-size: 14px; }
  .plan-do { font-size: 16.5px; font-weight: 700; }
  @media (max-width: 560px) {
    .plan-day { grid-template-columns: 1fr; gap: 2px; }
    .plan-when { grid-template-columns: 1fr; }
  }

  /* ---- reading a unit text: a STORYBOOK PAGE ----
     The first pass made this legible and stopped there, so it still read as a
     document. A book a five-year-old wants to open has a drop cap, paper that
     looks like paper, and a page you can see the end of. */
  .read-reader .book-stage-wrap { padding: 12px 12px 0; }
  .read-stage { position: relative; width: 100%; max-width: 700px; max-height: 100%; overflow-y: auto;
    padding: 38px 40px 32px; border-radius: 26px;
    background:
      radial-gradient(120% 90% at 50% 0%, #fffdf6 0%, #fbf4e4 62%, #f4ead4 100%);
    color: #24313c;
    box-shadow: 0 26px 60px rgba(0,0,0,.45), 0 2px 0 rgba(255,255,255,.7) inset;
    border: 1px solid rgba(120, 96, 54, .18); }
  /* the soft crease down the inside edge, so it reads as a leaf of a book */
  .read-stage::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 16px;
    border-radius: 26px 0 0 26px; pointer-events: none;
    background: linear-gradient(90deg, rgba(120,96,54,.16), rgba(120,96,54,0)); }

  .read-title { margin: 0 0 22px; font-size: 30px; color: #123243; text-align: center;
    font-family: "Inter", "Segoe UI", sans-serif; font-weight: 800; letter-spacing: -.01em; }
  .read-title::after { content: "\2766"; display: block; margin: 10px auto 0;
    font-size: 21px; color: var(--teal); }

  .read-page p { font-size: 25px; line-height: 1.85; margin: 0 0 20px; }
  .read-page p:last-child { margin-bottom: 0; }
  /* A story starts here - the oldest signal in children's publishing. */
  .read-page.first > p:first-of-type::first-letter {
    float: left; font-family: "Inter", "Segoe UI", sans-serif; font-weight: 800;
    font-size: 68px; line-height: .82; padding: 6px 12px 0 0; color: var(--teal); }

  /* ---- the read-along highlight, on both surfaces ----
     A warm wash UNDER the words, not a block around them: the old version
     boxed the line in gold with a shadow ring, which cut it out of the page
     and made the highlight louder than the reading. */
  .rd-line, .cap-line { border-radius: 10px; padding: 2px 6px; margin: 0 -2px;
    transition: background 160ms ease, color 160ms ease, box-shadow 160ms ease; }
  .rd-line.on, .cap-line.on {
    background: linear-gradient(180deg, rgba(255,214,110,.55), rgba(250,190,60,.85));
    box-shadow: 0 2px 0 rgba(196,140,20,.35); color: #1e2a33; }

  /* ---- how far through the book you are ----
     Dots, because a five-year-old counts them faster than they read "3 of 12",
     and they show what is left rather than only where you are. */
  .page-pips { display: inline-flex; align-items: center; gap: 6px; min-width: 5em; justify-content: center; }
  .page-pips .pip { width: 9px; height: 9px; border-radius: 999px; background: rgba(255,255,255,.26); }
  .page-pips .pip.done { background: rgba(255,255,255,.5); }
  .page-pips .pip.on { width: 22px; background: var(--gold, #f2c14e); }

  @media (max-width: 560px) {
    .read-stage { padding: 26px 22px 20px; border-radius: 20px; }
    .read-page p { font-size: 21px; line-height: 1.8; }
    .read-page.first > p:first-of-type::first-letter { font-size: 54px; }
    .read-title { font-size: 24px; }
    .page-pips .pip { width: 7px; height: 7px; }
    .page-pips .pip.on { width: 17px; }
  }

  /* ---- the picture book's caption ----
     It belongs to the picture above it, so it points at it: a notch at the
     top, the same paper as a reading page, and the same highlight. Without
     that it reads as a strip parked underneath rather than as the words for
     what the child is looking at. */
  .book-caption { position: relative; flex: 0 0 auto; width: 100%; max-width: 640px;
    margin: 18px auto 0; padding: 18px 26px; border-radius: 20px;
    background: radial-gradient(120% 120% at 50% 0%, #fffdf6 0%, #fbf4e4 70%, #f5ebd6 100%);
    color: #24313c; font-size: 23px; line-height: 1.65; text-align: center;
    box-shadow: 0 14px 34px rgba(0,0,0,.35), 0 2px 0 rgba(255,255,255,.75) inset;
    border: 1px solid rgba(120,96,54,.18); }
  .book-caption::before { content: ""; position: absolute; top: -9px; left: 50%; width: 18px; height: 18px;
    transform: translateX(-50%) rotate(45deg); background: #fffdf6;
    border-left: 1px solid rgba(120,96,54,.18); border-top: 1px solid rgba(120,96,54,.18);
    border-radius: 4px 0 0 0; }
  @media (max-width: 560px) {
    .book-caption { font-size: 18.5px; padding: 14px 16px; line-height: 1.6; margin-top: 14px; }
  }

  /* ---- student resources: the drawer ---- */
  .res-stage { width: 100%; max-width: 760px; max-height: 100%; overflow-y: auto; padding: 4px 2px 10px; }
  .wordgroup { margin-bottom: 18px; }
  .wordgroup h4 { margin: 0 0 8px; font-family: "Inter", "Segoe UI", sans-serif; font-weight: 800;
    font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--teal); }
  .wordrow { display: grid; grid-template-columns: 42px 7em 1fr; gap: 10px; align-items: baseline;
    padding: 9px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); margin-bottom: 6px; }
  .wordrow strong { font-size: 19px; }
  .wordrow span { color: var(--muted); font-size: 15.5px; }
  .wordrow .hear { align-self: center; }
  .gloxq { width: 100%; padding: 13px 16px; border-radius: 14px; border: 3px solid var(--teal);
    background: var(--card); color: var(--ink); font-family: inherit; font-size: 19px; margin-bottom: 12px; }
  .gloxmore { color: var(--muted); font-size: 14px; text-align: center; }

  /* ---- how to write it ---- */
  .hw { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  /* 40 words is a lot of tabs; give them their own scroll rather than
     pushing the writing off the screen. */
  .hwpick { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center;
    max-height: 22vh; overflow-y: auto; padding: 2px; }
  .hwtab { padding: 6px 14px; border-radius: 999px; border: 2px solid var(--line); background: var(--card);
    color: var(--muted); font-family: "Inter", "Segoe UI", sans-serif; font-weight: 700; font-size: 14.5px; }
  .hwtab.on { border-color: var(--teal); background: var(--teal); color: var(--accent-ink, #06222f); }
  .hwstage { width: 100%; max-width: 640px; border-radius: 18px; padding: 10px 6px;
    background: radial-gradient(120% 120% at 50% 0%, #fffdf6, #f7efdc);
    display: flex; justify-content: center; }
  /* Height-first, not width-first. The word frame is nearly square, so a
     width:100% svg in a 640px box is 580px tall and runs off the bottom of
     the overlay - which is what it did. Bounding the HEIGHT and letting the
     width follow keeps the whole word on screen at any viewport. */
  .hwsvg { max-height: 34vh; max-width: 100%; width: auto; height: auto; display: block; }
  .hwl { stroke: #c8b997; stroke-width: 1.6; }
  .hwl.base { stroke: #8a99a4; stroke-width: 2.4; }
  .hws { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 9; }
  .hws.body { stroke: #17384a; }
  .hws.join { stroke: #7fb0c4; stroke-width: 6; }
  .hws.mark { stroke: var(--bad, #d4553f); }
  .hwsay { min-height: 1.5em; color: var(--muted); font-size: 17px; text-align: center; margin: 0; }
  @media (max-width: 560px) {
    .wordrow { grid-template-columns: 38px 1fr; }
    .wordrow span { grid-column: 2; }
  }

  /* ---- what this unit is about ---- */
  .ovw { width: 100%; max-width: 34em; margin: 0 auto; }
  .ovw-bits { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 0 0 16px; }
  .ovw-bits span { padding: 6px 14px; border-radius: 999px; background: var(--card);
    border: 2px solid var(--teal); font-family: "Inter", "Segoe UI", sans-serif; font-weight: 700; font-size: 14.5px; }
  .ovw-h { font-size: 19px; margin: 0 0 12px; text-align: center; }
  .ovw-list { margin: 0; padding-left: 26px; display: flex; flex-direction: column; gap: 11px; font-size: 19px; }
  .ovw-list li::marker { color: var(--teal); font-weight: 800; }

  /* ---- how did I do? ---- */
  .selfs { width: 100%; max-width: 36em; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .selfrow { padding: 14px 16px; border-radius: 16px; border: 3px solid var(--line); background: var(--card); }
  .selfrow.answered { border-color: var(--good); background: var(--good-soft); }
  .selfrow p { margin: 0 0 10px; font-size: 18px; font-weight: 700; }
  .selfopts { display: flex; flex-wrap: wrap; gap: 8px; }
  .selfopt { padding: 9px 16px; border-radius: 999px; border: 2px solid var(--line); background: var(--ground);
    color: var(--muted); font-family: "Inter", "Segoe UI", sans-serif; font-weight: 700; font-size: 15px; }
  .selfopt.on { border-color: var(--teal); background: var(--teal); color: var(--accent-ink, #06222f); }

  /* ---- live sessions and the grown-up guide ---- */
  .livelist { display: flex; flex-direction: column; gap: 12px; }
  .livecard { padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); }
  .livewhen { color: var(--teal); font-family: "Inter", "Segoe UI", sans-serif; font-weight: 800;
    font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .livecard h4 { margin: 4px 0 8px; font-size: 18px; }
  .livecard p { margin: 0 0 6px; font-size: 15.5px; color: var(--muted); }
  .livecard strong { color: var(--ink); }
  .guide { max-width: 44em; }
  .guide-intro { font-size: 18px; padding: 14px 16px; border-radius: 14px;
    background: var(--card); border-left: 4px solid var(--teal); }
  .guide section { margin-top: 18px; }
  .guide h4 { font-size: 17px; margin: 0 0 6px; }
  .guide p { font-size: 15.5px; line-height: 1.65; color: var(--muted); margin: 0 0 8px; }

  /* A shelf card the learner has been through - the picture-book shelf and
     the unit's own readings both use it. */
  .bookcard.played { border-color: var(--good); background: var(--good-soft); }

  /* ---- Word finder: the whole entry ---- */
  .gloxrow { display: flex; gap: 12px; align-items: flex-start; padding: 11px 4px;
    border-bottom: 1px solid var(--line); }
  .gloxrow:last-child { border-bottom: 0; }
  /* Fixed width whether or not there is a picture, so the words stay in a
     column - 54% of these entries have none, and a ragged left edge makes a
     list of 80 unreadable. */
  .gloxpic { flex: 0 0 2.1em; font-size: 27px; line-height: 1.1; text-align: center; }
  .gloxbody { flex: 1 1 auto; min-width: 0; }
  .gloxhead { display: flex; align-items: center; gap: 8px; }
  .gloxhead strong { font-size: 19px; }
  .gloxdef { margin: 3px 0 0; font-size: 15.5px; line-height: 1.5; color: var(--muted); }
  .gloxeg { margin: 4px 0 0; font-size: 15px; line-height: 1.5; font-style: italic; }
  .gloxdef .hear, .gloxeg .hear { vertical-align: middle; margin-left: 6px; }

/* ==================================================================
   INTENSIVE ENGLISH — this kit's own styles.

   The base above is the Mathematics design system, lifted through
   English. Nothing here introduces a new hue: it reuses the tokens
   (--teal, --plum, --gold, --accent) so the two builds read as one
   product.

   What it does change is REGISTER. This course is for adults, so the
   type is a little smaller and denser than the Grade 1 build's, the
   cards are quieter, and there is no reward furniture of any kind —
   no stickers, no confetti, no cheering colour. A finished step shows
   in the dot rail and nowhere else.
   ================================================================== */

body { font-size: 19px; }
.wrap { max-width: 980px; }
.hero .eyebrow { letter-spacing: .08em; text-transform: uppercase; font-size: 13px; }
.slide h2 { font-size: 30px; margin: 0 0 8px; text-wrap: balance; }
.slide h3 { font-size: 21px; margin: 18px 0 6px; }
.lead { color: var(--muted); margin: 0 0 14px; }

.panel {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 16px 18px; margin: 14px 0; box-shadow: var(--shadow);
}
.panel h3 { margin-top: 0; }
.panel.task { border-left: 4px solid var(--teal); }

.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; align-items: center; }
/* A display rule beats the hidden ATTRIBUTE, so .actions[hidden] drew
   anyway: the quiz shipped showing "Try again" before the first
   question. Anything hidden stays hidden, whatever it is. */
[hidden] { display: none !important; }

/* the pattern card: the rule is a laid-out column of examples, never prose */
pre.rule {
  font-family: "Atkinson Hyperlegible", "Segoe UI", monospace; font-size: 18px; line-height: 1.6;
  background: var(--cell); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px 16px; margin: 12px 0; white-space: pre-wrap; overflow-x: auto;
}
.drawer { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin: 10px 0; background: var(--card); }
.drawer > summary { cursor: pointer; font-weight: 700; }
.drawer.warn { border-color: #E7C9A8; background: #FDF6EE; }
.drawer p, .answers p, .criteria p, .reading p { margin: 6px 0; }
.tip { color: var(--plum); font-weight: 700; margin: 10px 0; }

.reading { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; margin: 12px 0; }
.reading.document {
  font-family: "Atkinson Hyperlegible", monospace; background: #FFFDF6; border-style: dashed;
  border-color: #D9CBA6; white-space: pre-wrap;
}

/* a word card. NOT .wordcard: the lifted design system already has that
   name for the Grade 1 word button, and two rules for one class is how a
   card ends up centred by a stylesheet nobody was reading. */
.ien-word { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; text-align: center; box-shadow: var(--shadow); }
.ien-word .pic { font-size: 64px; line-height: 1.1; display: block; }
.ien-word h3 { font-size: 38px; margin: 6px 0; }
.ien-word .pos { color: var(--muted); font-size: 14px; text-transform: uppercase; letter-spacing: .08em; margin: 0; }
.ien-word .meaning { font-size: 20px; margin: 8px 0; }
.ien-word .example { color: var(--teal); font-weight: 700; margin: 10px 0 0; }
.ien-word .starter { color: var(--muted); margin: 8px 0 0; }

.prompt { font-size: 24px; font-weight: 700; margin: 16px 0; text-wrap: balance; }
.options { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
.opt {
  font: inherit; font-weight: 700; background: var(--card); color: var(--ink);
  border: 2px solid var(--line); border-radius: 12px; padding: 12px 18px; cursor: pointer; min-height: 52px;
}
.opt.wide { flex: 1 1 260px; text-align: left; }
.opt:hover:not(:disabled) { border-color: var(--teal); }
.opt:disabled { cursor: default; opacity: .85; }
.opt.right { background: var(--good-soft); border-color: var(--good); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.feedback { min-height: 28px; font-weight: 700; color: var(--teal); }
.count { color: var(--muted); font-size: 15px; }

textarea.write {
  width: 100%; font: inherit; padding: 12px 14px; border: 1px solid var(--line);
  border-radius: 12px; background: var(--card); color: var(--ink); resize: vertical;
}
.criteria { background: var(--teal-soft); border-radius: 12px; padding: 10px 14px; margin: 10px 0; }
.criteria h4 { margin: 0 0 4px; }
.answers { background: var(--good-soft); border: 1px solid var(--good); border-radius: 12px; padding: 10px 14px; margin: 10px 0; }
.tick { display: flex; gap: 10px; align-items: center; margin: 12px 0 0; font-weight: 700; }
.tick input { width: 22px; height: 22px; }

.cando { list-style: none; padding: 0; margin: 0; }
.cando li { padding: 10px 0; border-bottom: 1px dashed var(--line); font-weight: 700; }
.cando li:last-child { border-bottom: 0; }
.cando small { display: block; font-weight: 400; color: var(--muted); }
.path { margin: 0; padding-left: 22px; }
.path li { margin: 6px 0; }

.self { list-style: none; padding: 0; margin: 0; }
.self li { padding: 12px 0; border-bottom: 1px dashed var(--line); }
.self li:last-child { border-bottom: 0; }
.self .scale { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.rate {
  font: inherit; font-size: 15px; background: var(--card); color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer;
}
.rate.chosen { background: var(--teal); border-color: var(--teal); color: #fff; }

@media (max-width: 640px) {
  body { font-size: 18px; }
  .slide h2 { font-size: 25px; }
  .ien-word h3 { font-size: 30px; }
  .prompt { font-size: 20px; }
  .opt.wide { flex-basis: 100%; }
}

/* --- a quiz item answered by writing it (see intensive.js :: quiz) --- */
.bank-label { margin: 0 0 6px; font-weight: 700; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
.bank span {
  padding: 6px 12px; border-radius: 999px;
  background: var(--card, #eef2f7); border: 1px solid var(--line, #cbd5e1);
  font-weight: 700;
}
input.typein {
  flex: 1 1 12rem; min-width: 8rem; padding: 12px 14px;
  font: inherit; font-weight: 700;
  border-radius: 10px; border: 2px solid var(--line, #cbd5e1);
  background: var(--card, #fff); color: inherit;
}
input.typein.right { border-color: #2f855a; }
input.typein.wrong { border-color: #c53030; }

  /* --- the way back to the hub, drawn only when the learner arrived from it;
         see lesson-app-tools/wire-navigation.py --- */
  .lesson-back {
    display: inline-flex; align-items: center; gap: 8px;
    margin: 0 0 14px;
    padding: 9px 17px 9px 13px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: "Inter", "Segoe UI", sans-serif;
    font-size: 14px; font-weight: 700;
    text-decoration: none;
  }
  .lesson-back:hover, .lesson-back:focus-visible { border-color: var(--teal); }

  /* WIRE-CSS-START -- owned by lesson-app-tools/wire-platform-controls.py.
     Everything to WIRE-CSS-END is REPLACED on a re-run: this tool used to skip
     a page it had already wired, so three separate changes to this block --
     the panel surfaces, the dark theme, the canned prompts -- reached nothing
     already built, and each needed its own carry-across tool afterwards. */
  /* --- a home for the class controls, and the tutor dock;
         see lesson-app-tools/wire-platform-controls.py --- */
  .hero-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; max-width: 55%; }
  .top-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  /* The session bar (seb-session.js) is a fixed pill at right:16 bottom:16
     with a z-index above everything, so in focus mode it lands squarely on
     top of Ask Wehel. Lift both above it when it is there, and only then.
     --seb-lift is MEASURED from the bar below, because the bar's contents wrap
     and it is half again as tall on a narrow screen as on a wide one; the
     fallback is only for the instant before the first measurement. */
  body:has(#seb-session-bar) .w-dock,
  body:has(#seb-session-bar) .w-drawer { bottom: var(--seb-lift, 78px); }
  .w-dock { position: fixed; right: 14px; bottom: 14px; z-index: 70; display: inline-flex;
    align-items: center; gap: 8px; border: none; border-radius: 999px; cursor: pointer;
    background: var(--plum); color: var(--plum-ink, #fff); font: inherit; font-size: 16px; font-weight: 700;
    padding: 12px 18px; box-shadow: var(--shadow); }
  .w-dock[hidden] { display: none; }
  .w-drawer { position: fixed; right: 14px; bottom: 14px; z-index: 71; width: min(420px, calc(100vw - 28px));
    height: min(620px, calc(100vh - 28px)); background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
  .w-drawer[hidden] { display: none; }
  .w-drawer-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    border-bottom: 1px solid var(--line); font-weight: 800; }
  .w-drawer-head button { margin-left: auto; border: 1px solid var(--line); background: var(--cell);
    color: var(--ink); border-radius: 999px; width: 34px; height: 34px; font-size: 17px; cursor: pointer; }
  .w-drawer-body { flex: 1 1 auto; min-height: 0; overflow: auto; }
  .w-toast { position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%); z-index: 90;
    background: var(--ink); color: var(--ground); padding: 10px 16px; border-radius: 999px;
    font-weight: 700; font-size: 15px; box-shadow: var(--shadow); }

  /* The dock's resting spot (bottom:14) can land on the Back/Next footer when
     a step is short enough that .foot is the last thing on screen -- routine
     on a phone or tablet, where the viewport is short relative to the deck --
     and reaches the same collision on a step long enough to NEED scrolling,
     at the scroll position where .foot comes into view, because .foot is the
     last thing in the document and the dock's footprint is fixed to the
     viewport rather than to a point in the page. A trailing padding-bottom on
     .wrap fixes neither case: .foot's position is set by the content ABOVE
     it, so padding added after it never moves it, which is what the first
     attempt at this got wrong (verified in the browser -- the overlap
     survived it unchanged, in the fits-without-scrolling case this comment
     first shipped for). Lift the dock clear instead, exactly as it already
     lifts above the session bar below, but tracked on scroll as well as
     resize -- see the script -- because unlike the session bar, .foot is
     ordinary content and its distance from the viewport's bottom edge is a
     function of scroll position, not a constant once measured. */
  .w-dock, .w-drawer { bottom: calc(14px + var(--wehel-foot-lift, 0px)); }

  /* WEHEL-THEME-START -- the tutor PANEL, dressed in this page's palette.
     The dock and the drawer above already use --card/--line/--ink, so before
     this the drawer was a dark card containing a white sheet: shell/wehel.js
     ships a light panel (--w-bg #fff, --w-ink #17324d) and these pages are
     always dark -- the bare `:root` in their theme selector makes the dark
     block unconditional, so there is no light case to preserve here.
     wehel.js now NAMES its surfaces instead of repeating literals, every
     default being the value it already had, so this block is the whole of the
     change a page needs and the five shell subjects that also load the tutor
     are untouched. Mapped by ROLE, not by hue: panel takes --card, anything
     raised off it takes --cell, so the bubbles, prompt buttons, compose row
     and timer stay readable against the panel rather than against the page. */
  /* DOUBLED selector, and that is load-bearing: wehel.js injects PANEL_STYLE
     with document.head.appendChild at mount, so its own `.wehel-panel{...}`
     always comes after this stylesheet. At equal specificity the later rule
     wins, so the single-class version of this block lost every declaration to
     it and the panel stayed white -- which only rendering it showed. */
  .wehel-panel.wehel-panel {
    --w-bg: var(--card); --w-surface: var(--card); --w-ink: var(--ink);
    --w-line: var(--line);
    --w-teal: var(--teal); --w-teal-2: #2AA79B; --w-teal-soft: var(--teal-soft);
    --w-bubble: var(--cell);
    --w-prompt-bg: var(--cell); --w-prompt-line: var(--line);
    /* NOT var(--teal) here. The page's teal on the prompt buttons' --cell
       ground measures 4.28:1, under the 4.5 floor -- the one surface in the
       panel that failed when this was measured rather than eyeballed. This
       lighter teal is 6.27:1 on the same ground. It is a literal because the
       palette has no light-teal token: --teal-soft is a dark fill (#143A4A),
       and --good (#4FD1A0) is the green that means "correct" in this build,
       which a row of suggestions must not borrow. */
    --w-prompt-ink: #7FE0D6;
    /* the strip along the top of the panel -- timer, Full screen, voice picker */
    --w-row-a: rgba(255, 255, 255, 0.07); --w-row-b: rgba(255, 255, 255, 0.03);
    --w-low-line: rgba(244, 201, 93, 0.55);
    --w-compose-bg: var(--cell);
    --w-timer-bg: var(--cell); --w-timer-track: var(--cell);
    /* the learner's own turn: plum, the page's third accent, so a child can
       tell their words from Wehel's at a glance without reading the label */
    --w-user-a: rgba(183, 139, 209, 0.30); --w-user-b: rgba(183, 139, 209, 0.16);
    --w-user-ink: var(--ink);
    --w-user-avatar-a: var(--plum); --w-user-avatar-b: #8E5AA8;
    /* time nearly up: the page's gold, not the light build's cream */
    --w-warm: var(--gold); --w-low-ink: var(--gold);
    --w-low-fill: rgba(244, 201, 93, 0.32); --w-low-track: rgba(244, 201, 93, 0.12);
  }
  .wehel-panel.wehel-panel .ai-compose input::placeholder { color: var(--muted); }

  /* THE CLASS CHAT, same treatment and a different scope. learner-controls.js
     draws that panel with INLINE styles -- deliberately, so a cosmetic rule in
     course-ui.css cannot make five other subjects' app tiers stale -- and an
     inline style cannot be overridden by a stylesheet. It reads --lc-* through
     var() instead, so this retints it; and the panel is appended to <body>
     rather than to the drawer, so these live at :root and not on a class.

     The bug this fixes is not only the tint. Every bubble set a background and
     NO colour, so the text inherited the page's --ink -- white -- and a child
     read white on #f2f4f6. The compose input was the same, so typing was
     invisible. The defaults in learner-controls.js are course-ui.css's own
     --ink (#17324d), which is exactly what the light subjects inherit today. */
  :root {
    --lc-panel-bg: var(--card); --lc-panel-line: var(--line);
    --lc-head-a: rgba(53, 191, 178, 0.22); --lc-head-b: rgba(53, 191, 178, 0.07);
    --lc-head-ink: var(--ink); --lc-head-sub: var(--muted);
    --lc-form-bg: var(--cell); --lc-form-line: var(--line);
    --lc-field-bg: var(--cell); --lc-field-ink: var(--ink);
    --lc-them-bg: var(--cell); --lc-them-ink: var(--ink);
    /* the learner's own turn in plum, the same signal the tutor panel uses */
    --lc-mine-bg: rgba(183, 139, 209, 0.30); --lc-mine-ink: var(--ink);
    /* "only your teacher sees this" keeps its amber, restated for a dark ground */
    --lc-private-bg: rgba(244, 201, 93, 0.18); --lc-private-line: rgba(244, 201, 93, 0.45);
    --lc-private-ink: var(--gold);
  }
  /* WEHEL-THEME-END */
  /* WIRE-CSS-END */

  /* --- said on the learner's own screen when their work is not reaching the
         school; see lesson-app-tools/wire-progress.py --- */
  .progress-notice {
    margin: 0 0 12px; padding: 10px 14px;
    border-radius: 12px;
    background: var(--bad-soft); border: 1px solid var(--bad);
    color: var(--ink);
    font-family: "Inter", "Segoe UI", sans-serif;
    font-size: 14px; font-weight: 600;
  }

  /* ---- the two header bars, modelled on the English shell ---- */
  .eh-bar1, .eh-bar2 { position: sticky; z-index: 40; display: flex; align-items: center; gap: 12px;
    background: var(--card); border-bottom: 1px solid var(--line); }
  .eh-bar1 { top: 0; padding: 8px 16px; }
  .eh-bar2 { top: 56px; padding: 8px 16px; background: var(--cell); }
  .eh-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); flex: 0 0 auto; }
  .eh-brand svg { width: 30px; height: 32px; color: var(--teal); display: block; }
  .eh-crest { width: 32px; height: 32px; display: block; flex: 0 0 auto; }
  .eh-brandtext { display: flex; flex-direction: column; line-height: 1.15; }
  .eh-brandtext b { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
  .eh-brandtext i { font-style: normal; font-size: 12.5px; font-weight: 700; color: var(--teal); }
  .eh-prog { display: flex; align-items: center; gap: 9px; background: var(--cell); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 14px 5px 6px; flex: 1 1 auto; max-width: 420px; min-width: 0; }
  .eh-pct { background: var(--teal); color: var(--teal-ink, #06231F); font-weight: 800; font-size: 13px; border-radius: 999px; padding: 4px 9px; }
  /* --ink, not --muted. At 13.5px this is normal text and needs 4.5:1; on the
     English Grade 1 palette --muted measured 4.04:1 on the --cell pill behind
     it and failed. A fixed colour cannot fix that here - the five apps that
     render this bar carry four different --muted values (#566669, #6B7F82,
     #93AABE, #A4B7C8), so each would need its own answer.

     --ink is the one that holds for all of them by construction: it is each
     palette's own text colour against --card and --cell, which is what
     .eh-brand and .eh-picker in this same bar already depend on. It also ends
     an inconsistency rather than making one - this label was the ONLY text in
     either bar not already drawn in --ink or --teal. */
  .eh-progtext { font-size: 13.5px; font-weight: 700; color: var(--ink); white-space: nowrap; }
  .eh-track { flex: 1 1 auto; height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; min-width: 40px; }
  .eh-track i { display: block; height: 100%; width: 0; background: var(--teal); border-radius: 999px; transition: width .3s ease; }
  .eh-b1right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .eh-picker { font: inherit; font-size: 14px; font-weight: 700; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; max-width: 200px; }
  .eh-icon { width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); font-size: 17px; cursor: pointer; }
  /* The focus chip. Emitted empty and hidden; shared/seb-session.js unhides it,
     writes the dot and the word, and sets is-ok / is-warn / is-bad, because that
     file owns the thresholds. A page without focus mode never shows it at all.
     It is a PILL with a label, not a bare dot: the dot-only version measured
     perfectly and could not be found on the page, and colour alone says nothing
     to anyone who cannot separate red from green. */
  .eh-focus { display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto;
    border-radius: 999px; padding: 5px 12px 5px 9px; white-space: nowrap;
    font-size: 12.5px; font-weight: 800; }
  .eh-focus i { width: 9px; height: 9px; border-radius: 999px; background: currentColor; display: block; }
  .eh-focus.is-ok { background: var(--good, #3E9C63); color: var(--good-ink, #06231F); }
  .eh-focus.is-warn { background: var(--gold, #E8B84B); color: var(--gold-ink, #2A1F05); }
  .eh-focus.is-bad { background: var(--bad, #D7584B); color: var(--bad-ink, #2A0A07); }
  .eh-focus b { font-weight: 800; }
  @media (max-width: 620px) { .eh-focus b { display: none; }
    .eh-focus { padding: 6px; gap: 0; } .eh-focus i { width: 11px; height: 11px; } }
  .eh-icon[aria-pressed="true"] { background: var(--cell); color: var(--muted); text-decoration: line-through; }
  .eh-round { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; border: none;
    background: var(--teal); color: var(--teal-ink, #06231F); font: inherit; font-size: 15px; font-weight: 700; padding: 9px 15px;
    cursor: pointer; text-decoration: none; }
  .eh-round.back { padding: 9px 13px; }
  .eh-section { font-size: 15px; font-weight: 700; color: var(--ink); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .eh-b2right { margin-left: auto; display: flex; gap: 8px; flex: 0 0 auto; }
  .eh-pill { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font: inherit; font-size: 15px; font-weight: 700;
    padding: 9px 15px; cursor: pointer; }
  .eh-steps { position: sticky; top: 104px; z-index: 39; background: var(--card); border-bottom: 1px solid var(--line);
    max-height: 55vh; overflow-y: auto; padding: 8px; }
  .eh-steps button { display: block; width: 100%; text-align: left; font: inherit; font-size: 16px;
    background: none; border: none; border-radius: 10px; padding: 10px 12px; cursor: pointer; color: var(--ink); }
  .eh-steps button:hover { background: var(--cell); }
  .eh-steps button.now { background: var(--teal); color: var(--teal-ink, #06231F); font-weight: 700; }
  .eh-steps button.done::after { content: " \2713"; color: var(--good); font-weight: 700; }
  .eh-steps button.now.done::after { color: var(--teal-ink, #06231F); }
  .hero .eyebrow { display: none; }   /* the brand bar says Primary Mathematics now */
  @media (max-width: 720px) {
    .eh-progtext, .eh-brandtext { display: none; }
    .eh-bar2 { top: 52px; } .eh-steps { top: 100px; }
    .eh-picker { max-width: 130px; }
  }

   "title": "The five dials of formality",
   "explanation": "Formality is not one switch. It is five separate dials, and most learners\nturn all five at once, which produces writing that is stiff rather than\nprofessional. Knowing which dial does what lets you be formal and readable\nat the same time.",
   "rule": "DIAL 1 — CONTRACTIONS\n  informal: we haven't received it       formal: we have not received it\n\nDIAL 2 — VOCABULARY, mostly Latin against plain English\n  ask -> enquire   tell -> notify   send on -> forward   do not -> refrain from\n\nDIAL 3 — THE PASSIVE, and whether a person is named\n  we have received your form  ->  your form has been received\n\nDIAL 4 — SENTENCE LENGTH AND CLAUSES\n  short and separate  ->  longer, with relative clauses\n\nDIAL 5 — DISTANCE FROM THE READER\n  you should  ->  applicants should  ->  the undersigned should\n\nThe mistake is turning all five to maximum. Dial 5 at maximum makes a\nletter unfriendly; dial 2 at maximum makes it unreadable.\nMost professional writing sits at about three out of five on dials 1 to 3\nand much lower on 4 and 5.\nPlain does not mean informal. A document can be formal and plain at once,\nand that is what you are aiming at.",
   "worked": "One done, step by step.\nMake this suitable for a letter to a customer you have not met.\n'We haven't got your form yet so we can't start.'\n1. Dial 1: expand the contractions. We have not, we cannot.\n2. Dial 2: got is very plain. received is better, and no further.\n3. Dial 3: the passive removes the blame from them. Your form has not been received.\n4. Dial 5: leave it low. Keep you, or the letter becomes cold.\nAnswer: Your form has not yet been received, so we are unable to begin.\nDials 4 and 5 were left alone, which is why it still sounds like a person.",

   "practice": "Say which dial each change turns, and whether it improves the sentence.\n1. we haven't -> we have not\n2. ask -> enquire\n3. we have received it -> it has been received\n4. you should -> the undersigned should\n5. two short sentences joined into one with a relative clause\n6. do not -> refrain from\nNow rewrite this for a customer, turning only dials 1 to 3.\n7. 'We haven't got your form yet so we can't start.'",

   "explanation": "Most formal words have an everyday equivalent, and choosing the formal one is\na matter of register. A few do not, and those are worth separating out,\nbecause the rule for them is different: use them only where the document is\ngenuinely legal, and recognise them everywhere.",
   "rule": "THE ONES WITH A PLAIN TWIN — usually prefer the twin:\nnotwithstanding = despite        pursuant to = under\naforementioned  = the, or that   herewith = with this\ntherein         = in it          prior to = before\n\nTHE ONE WITH NO TWIN, because it does what no plain word does:\nHEREBY — it makes the saying itself the act.\n  I hereby confirm that the work is complete.\n  I hereby give notice of my intention to terminate.\nThat sentence does not describe a confirmation. It IS one.\nWhich is why you cannot write I hereby went, or I hereby think.\n\nWHEREBY — no single-word twin, though by which comes close.\n\nTHE TEST for all the others: write the plain version beside it. If it says\nthe same thing, use it, unless the document is a contract.\nPursuant to clause 6 and under clause 6 mean the same, and one of them can\nbe read by the person it applies to.",

     Every line in this lesson is written as Azure SSML: <mstts:express-as>

     before an answer, <emphasis> for the word that carries the maths. That
     markup is the script we would post to en-GB-SoniaNeural, and it is kept
     here rather than flattened to plain text so the lesson can be moved onto
     a real TTS endpoint without rewriting a word.

     A published page cannot call Azure itself: it may not hold a
     subscription key, and its content policy blocks the request outright.
     So the page renders the same SSML through the browser's own speech
     engine - it asks for Sonia by name first (Edge and Windows publish her
     as "Microsoft Sonia Online (Natural) - English (United Kingdom)", which
     IS en-GB-SoniaNeural), then any other British voice, then any English
     one. Web Speech does not accept SSML, so the markup is walked into a
     queue of utterances carrying the rate, the pitch and the real silences
     the tags asked for.
     ================================================================== */

     Ehel already serves narration from its own endpoint, and this is the
     app's own contract, not a new one:

       POST <origin>/local/hubredirect/quiz_tts.php
       Authorization: Bearer <launch token>          (english.js :: platformHeaders)

     that as Lax, and Lax cookies are not sent on a cross-site POST.

     whole module reports itself unavailable, which is the honest state of
     a lesson opened as a standalone page: it falls through to the
     browser's own voice and nothing is requested.

     Two things this does NOT do, both worth knowing before reading the
     endpoint name as a promise:

       - It is not Azure. quiz_tts.php proxies ElevenLabs (wehel_speak.php

       Speech takes 0..1 and ALREADY sits at 1, so the authored "+20%" resolves to
       1.2 and then clamps straight back to 1. On this path the boost is a no-op:
       the browser can only be asked to speak quieter, never louder. The SSML still
       carries it verbatim, because Azure is the path where it lands. (An absolute
       Azure volume, 0..100, is likewise not converted and simply clamps.) Do not
       read a working browser preview as evidence that the boost is being applied. */
    const VOLUME_WORD = { silent: 0, "x-soft": 0.4, soft: 0.7, medium: 1, loud: 1.2, "x-loud": 1.4 };
    /* Azure's speaking styles, approximated in the two dials that carry a feeling -
       rate and pitch. Volume is a level rather than a mood, so no style moves it. */
    const STYLE = {
      cheerful: [1.04, 1.12], excited: [1.09, 1.16], friendly: [1.0, 1.05],
      hopeful: [0.98, 1.07], empathetic: [0.93, 0.98], calm: [0.9, 0.97],
      gentle: [0.94, 1.01], sad: [0.88, 0.94], shouting: [1.06, 1.14],

      if (/^<speak[\s>]/i.test(s)) return s;
      const body = /<(mstts:)?express-as|<prosody|<emphasis|<break|<say-as|<[sp]>/i.test(s) ? s : escapeText(s);
      /* A line that already names its own feeling keeps it: Azure forbids one

    const recent = [];

  /* ==================================================================
     WHAT SHE SAYS BACK

        cheer("1.6", 'Yes! <break time="120ms"/> That is <emphasis level="strong">exactly</emphasis> it.'),
        cheer("1.5", 'That is right. <break time="140ms"/> <prosody pitch="+8%">Well done.</prosody>'),
        cheer("1.7", '<prosody rate="fast" pitch="+12%">Spot on!</prosody>'),
        cheer("1.4", 'Lovely. <break time="120ms"/> You worked that out beautifully.'),
        cheer("1.6", '<prosody pitch="+10%">Brilliant.</prosody> <break time="120ms"/> Straight there.')

        kind('Close. <break time="200ms"/> Try one more time - you are nearly there.'),

        excite('<prosody pitch="+10%">You have done it!</prosody> <break time="150ms"/> Another sticker.'),
        excite('All done here. <break time="150ms"/> <emphasis level="strong">Great</emphasis> work.')

        excite('<prosody rate="fast" pitch="+14%">Three in a row!</prosody> <break time="150ms"/> You are flying.'),
        excite('<prosody pitch="+12%">That is three!</prosody> <break time="140ms"/> Keep going.')

  /* ==================================================================
     WATCHING, RATHER THAN BEING TOLD

     The lesson code already decides right from wrong: it puts .good or .bad
     on a feedback line, or .right / .wrong on an answer button. Reading
     those changes instead of editing every check keeps one description of
     "the child got it" rather than two that can drift apart - and it means
     a new question is reacted to the day it is written.
     ================================================================== */
  (function () {

    const last = new WeakMap();

       would praise a child who had just got it wrong. The changes from one tap
       are collected and judged together, and a wrong anywhere in the batch wins. */
    let batch = [], scheduled = false;

        const now = WRONG.test(cls) ? "wrong" : RIGHT.test(cls) ? "right" : "";
        if (!now) { last.delete(el); continue; }
        if (last.get(el) === now) continue;
        last.set(el, now);
        if (now === "wrong") { verdict = "wrong"; hint = hint || hintFor(el); }
        else if (verdict !== "wrong") { verdict = "right"; praiseText = praiseText || (el.matches(".fb") ? el.textContent : ""); }
      }
      if (verdict === "wrong") REACTION.wrong(hint);
      else if (verdict === "right") REACTION.right(praiseText);

      batch.push(el);

  /* ==================================================================
     THE EXPLAINER

     The speaker reads the instruction. Explain is the thing a teacher says
     when a child says "I do not get it" - a short spoken mini-lesson in four
     moves, about thirty to sixty seconds:

         NAME     the idea, in the plainest words there are
         SHOW     one worked example, using THIS step's own content
         WARN     the mistake children actually make here, named out loud
         HAND     back, with one small thing to try right now

     another and the walker below would flatten a nested pair anyway.
