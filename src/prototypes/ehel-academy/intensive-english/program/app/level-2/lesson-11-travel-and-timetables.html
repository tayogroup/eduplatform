  /* a drawing pad: the letter faint behind it, the learner's line on top */
  function drawingPad(el, id, glyph) {
    el.insertAdjacentHTML("beforeend", '<div class="tracebox"><span class="ghostglyph" id="' + id + '-ghost">' + esc(glyph) + "</span>" +
      '<canvas id="' + id + '-cv" width="640" height="280" aria-label="Drawing space: trace the letter"></canvas></div>' +
      '<div class="actions"><button type="button" class="big small ghost" id="' + id + '-clear">Clear</button></div>');
    const cv = $(id + "-cv"), cx = cv.getContext("2d");
    let down = false;
    const pos = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
    cv.addEventListener("pointerdown", (e) => { down = true; cv.setPointerCapture(e.pointerId); const [x, y] = pos(e); cx.beginPath(); cx.moveTo(x, y); });
    cv.addEventListener("pointermove", (e) => {
      if (!down) return;
      const [x, y] = pos(e);
      cx.lineWidth = 14; cx.lineCap = "round"; cx.lineJoin = "round";
      cx.strokeStyle = getComputedStyle(document.body).getPropertyValue("--accent").trim() || "#F26B2A";
      cx.lineTo(x, y); cx.stroke();
    });
    ["pointerup", "pointercancel", "pointerleave"].forEach((t) => cv.addEventListener(t, () => { down = false; }));
    $(id + "-clear").addEventListener("click", () => cx.clearRect(0, 0, cv.width, cv.height));
    /* a word is smaller than a letter, so that it fits the pad */
    const fit = (g) => { const n = String(g).length; $(id + "-ghost").style.fontSize = n <= 2 ? "" : n <= 4 ? "clamp(64px, 15vw, 140px)" : n <= 8 ? "clamp(44px, 10vw, 100px)" : "clamp(20px, 5vw, 44px)"; };
    fit(glyph);
    return { set(glyph2) { $(id + "-ghost").textContent = glyph2; fit(glyph2); cx.clearRect(0, 0, cv.width, cv.height); } };
  }

  /* letters (or, in lesson 1, shapes) to trace. A plain item takes its sound
     from this lesson's sound tiles; an item {g, spoken} says its own. */
  P.seeLetters = function (i, id, path) {
    const el = $(id), b = blockAt(path);
    const tiles = blockAt("hear.sounds").items;
    const items = b.items.map((x) => (typeof x === "string" ? { g: x, spoken: (tiles.find((s) => s.g === x) || {}).spoken } : x));
    el.innerHTML = litHead(i, b, "See and write the letters", "Choose a letter and listen to its sound. Trace it with your finger, pen or mouse. Then write it on paper.") +
      '<div class="examples" id="' + id + '-pick">' + items.map((x, n) => '<button type="button" class="mini letterpick" data-n="' + n + '">' + esc(shownG(x.g)) + "</button>").join("") + "</div>";
    const pad = drawingPad(el, id, items.length ? shownG(items[0].g) : "");
    $(id + "-pick").addEventListener("click", (e) => {
      const t = e.target.closest("[data-n]");
      if (!t) return;
      const x = items[Number(t.dataset.n)];
      pad.set(shownG(x.g));
      if (x.spoken) say(x.spoken);
    });
    doneButton(i, el, b.done || "I have written them");
  };

  P.copyWords = function (i, id, path) {
    const el = $(id), b = blockAt(path), ws = b.items;
    el.innerHTML = litHead(i, b, "Copy the words", "Tap a word to hear it. Write it three times on paper, saying its sounds as you write. Or trace it here.") +
      '<div class="examples" id="' + id + '-pick">' + ws.map((x, n) => '<button type="button" class="mini" data-n="' + n + '">' + esc(wordOf(x)) + "</button>").join("") + "</div>";
    const pad = drawingPad(el, id, ws.length ? wordOf(ws[0]) : "");
    $(id + "-pick").addEventListener("click", (e) => {
      const t = e.target.closest("[data-n]");
      if (!t) return;
      const x = ws[Number(t.dataset.n)];
      pad.set(wordOf(x));
      if (b.silent) return;
      if (typeof x !== "string" && x.spoken) say(x.spoken); else playClip(wordOf(x));
    });
    doneButton(i, el, b.done || "I have copied them");
  };

  P.blend = function (i, id, path) {
    const el = $(id), b = blockAt(path), items = b.items;
    let at = 0;
    el.innerHTML = litHead(i, b, "Blend the sounds", "Say each sound, then run them together to read the word.") +
      '<div class="blendrow" id="' + id + '-row"></div><p class="prompt" id="' + id + '-word" hidden></p>' +
      '<div class="actions"><button type="button" class="big small ghost" id="' + id + '-sounds">&#9654; ' + esc(b.partsLabel || "The sounds") + "</button>" +
      '<button type="button" class="big small" id="' + id + '-show">' + esc(b.wordLabel || "Read the word") + "</button>" +
      '<button type="button" class="big" id="' + id + '-next">Next &#9654;</button></div><p class="count" id="' + id + '-count"></p>';
    function draw() {
      const x = items[at];
      $(id + "-row").innerHTML = x.parts.map((p) => '<span class="blendpart">' + esc(shownG(p)) + "</span>").join("");
      $(id + "-word").hidden = true; $(id + "-word").textContent = x.word;
      $(id + "-count").textContent = "Word " + (at + 1) + " of " + items.length;
    }
    $(id + "-sounds").addEventListener("click", () => say(items[at].spoken));
    $(id + "-show").addEventListener("click", () => { $(id + "-word").hidden = false; playClip(items[at].word); if (at === items.length - 1) finish(i, ""); });
    $(id + "-next").addEventListener("click", () => { at = (at + 1) % items.length; draw(); });
    if (items.length) draw();
  };

  P.readWords = function (i, id, path) {
    const el = $(id), b = blockAt(path);
    el.innerHTML = litHead(i, b, "Read the words", "Read each word out loud. Then tap it to check.") + wordChips(b.items);
    wireListen(el); wireSounds(el);
    doneButton(i, el, b.done || "I have read them all");
  };

  P.tricky = function (i, id, path) {
    const el = $(id), b = blockAt(path);
    el.innerHTML = litHead(i, b, "Tricky words", "These words do not follow the sounds you know. Learn them by how they look. Tap to hear each one.") +
      (b.items.length ? wordChips(b.items) : '<p class="hint">No tricky words in this lesson.</p>');
    wireListen(el); wireSounds(el);
    doneButton(i, el, b.done || "I know them");
  };

  P.reader = function (i, id, path) {
    const el = $(id), r = blockAt(path);
    el.innerHTML = stepHead(i) + "<h2>" + (r.text ? "Read: " + esc(r.title) : "Read a short text") + "</h2>" +
      (r.text ? '<p class="lead">' + esc(r.lead || "Read it out loud first. Then listen and read along.") + '</p><div class="actions">' + listenBtn(r.text, "Listen") + '</div><div class="reading bigread">' + para(r.text) + "</div>"
        : '<p class="hint">No text in this lesson.</p>');
    wireListen(el);
    doneButton(i, el, "I have read it");
  };

  P.readAloud = function (i, id, path) {
    const el = $(id), b = blockAt(path), ws = b.items;
    el.innerHTML = litHead(i, b, "Read aloud", "Record yourself reading these words. Then listen back, and tap each word to check.") +
      '<p class="prompt">' + ws.map((x) => esc(wordOf(x))).join(" &middot; ") + "</p>" +
      '<div class="actions"><button type="button" class="big small" id="' + id + '-rec">&#9679; Record</button>' +
      '<button type="button" class="big small ghost" id="' + id + '-play" disabled>&#9654; Play back</button></div>' + wordChips(ws);
    wireListen(el); wireSounds(el);
    let rec = null, chunks = [], url = "";
    $(id + "-rec").addEventListener("click", async () => {
      const btn = $(id + "-rec");
      if (rec && rec.state === "recording") { rec.stop(); return; }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        rec = new MediaRecorder(stream); chunks = [];
        rec.ondataavailable = (e) => chunks.push(e.data);
        rec.onstop = () => {
          url = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType || "audio/webm" }));
          stream.getTracks().forEach((t) => t.stop());
          btn.innerHTML = "&#9679; Record again"; $(id + "-play").disabled = false;
        };
        rec.start(); btn.innerHTML = "&#9632; Stop";
      } catch (_) { btn.disabled = true; btn.textContent = "No microphone"; }
    });
    $(id + "-play").addEventListener("click", () => { if (url) { player.src = url; player.play(); } });
    doneButton(i, el, b.done || "I have read them");
  };

  P.dictation = function (i, id, path) {
    const el = $(id), b = blockAt(path), ws = b.items;
    let at = 0, right = 0;
    el.innerHTML = litHead(i, b, "Write what you hear", "Listen to the word. Say its sounds. Write it.") +
      '<div class="actions"><button type="button" class="big small" id="' + id + '-hear">&#9654; Hear it</button>' +
      '<input type="text" class="typein" id="' + id + '-in" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Write the word">' +
      '<button type="button" class="big small" id="' + id + '-ok">Check</button></div>' +
      '<p class="feedback" id="' + id + '-fb" role="status" aria-live="polite"></p><p class="count" id="' + id + '-count"></p>';
    const box = $(id + "-in");
    const hear = () => { const x = ws[at]; if (typeof x !== "string" && x.spoken) say(x.spoken); else playClip(wordOf(x)); };
    const draw = () => { box.value = ""; box.disabled = false; box.className = "typein"; $(id + "-ok").disabled = false; $(id + "-count").textContent = "Word " + (at + 1) + " of " + ws.length; };
    $(id + "-hear").addEventListener("click", hear);
    const go = () => {
      if (box.disabled) return;
      const want = wordOf(ws[at]);
      const ok = normal(box.value) === normal(want);
      box.disabled = true; $(id + "-ok").disabled = true; box.classList.add(ok ? "right" : "wrong");
      if (ok) right++;
      $(id + "-fb").textContent = ok ? "Yes: " + want + "." : "It is " + want + ".";
      setTimeout(() => {
        at++;
        if (at < ws.length) { $(id + "-fb").textContent = ""; draw(); return; }
        $(id + "-fb").textContent = "You wrote " + right + " of " + ws.length + " correctly."; $(id + "-count").textContent = "";
        attempt(i, ws.length, ws.length, "words"); finish(i, "");
      }, 1800);
    };
    $(id + "-ok").addEventListener("click", go);
    box.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); go(); } });
    if (ws.length) draw();
  };

  /* ================= the lesson menu ==================================== */
  function paintMenu() {
    const m = $("menu-path");
    if (!m) return;
    const groupNow = STEPS[cur] ? STEPS[cur].g : 0;
    m.innerHTML = GROUPS.map((g, gi) => {
      const idx = STEPS.map((s, k) => (s.g === gi ? k : -1)).filter((k) => k >= 0);
      const n = idx.filter((k) => done[k]).length;
      const open = gi === groupNow || m.dataset["open" + gi] === "1";
      return '<div class="pg-group' + (gi === groupNow ? " now" : "") + (n === idx.length ? " complete" : "") + '">' +
        '<button type="button" data-g="' + gi + '" aria-expanded="' + open + '"><span>' + esc(g.name) + '</span><span class="tally">' + (n === idx.length ? "&#10003; done" : n + " of " + idx.length) + "</span></button>" +
        (open ? '<ol class="pg-steps">' + idx.map((k) => '<li><button type="button" data-step="' + k + '"' + (k === cur ? ' aria-current="step"' : "") + '><span class="mark">' + (done[k] ? "&#10003;" : "") + "</span><span>" + esc(STEPS[k].t) + "</span></button></li>").join("") + "</ol>" : "") +
        "</div>";
    }).join("");
  }
  function openToolbox(tab) {
    const o = $("toolbox");
    o.hidden = false;
    selectTool(tab || TOOLS[0][0]);
    const b = o.querySelector('[data-tool="' + (tab || TOOLS[0][0]) + '"]');
    if (b) b.focus();
  }
  function closeToolbox() { $("toolbox").hidden = true; const b = $("toolbox-toggle"); if (b) b.focus(); }

  /* ================= the toolbox ======================================== */
  const wordRows = (items) => '<div class="wl">' + items.map((w) => "<div>" + (w.pic ? '<span aria-hidden="true">' + w.pic + "</span> " : "") + "<b>" + esc(w.w) + "</b> <small>" + esc(w.pos) + "</small><small>" + esc(w.meaning) + "</small><small>" + esc(w.example) + '</small><button type="button" class="mini" data-say="' + esc(w.w) + '">&#9654;</button></div>').join("") + "</div>";
  const answerRows = (items) => "<ol>" + items.map((q) => "<li>" + esc(q.q) + " <b>" + esc(q.a) + "</b>" + (q.why ? " <small>" + esc(q.why) + "</small>" : "") + "</li>").join("") + "</ol>";
  const lectureTool = ["lecture", "Unit lecture", () => LESSON.unitLecture.chapters.map((c, n) => "<h3>" + (n + 1) + ". " + esc(c.title) + '</h3><button type="button" class="mini" data-say="' + esc(lines(c.text).join(" ")) + '">&#9654; Listen</button>' + para(c.text)).join("")];
  const planTool = ["plan", "Lesson plan", () => "<h3>Your days for this lesson</h3><ol>" + LESSON.dayPlan.map((d) => "<li>" + esc(d) + "</li>").join("") + "</ol>" +
    (LESSON.teacher ? "<h3>In the live class</h3><ul>" + LESSON.teacher.map((d) => "<li>" + esc(d) + "</li>").join("") + "</ul>" : "")];
  const TOOLS = LESSON.kind === "literacy" ? [
    ["chart", "Sound chart", () => (LESSON.chart || []).length ? '<p class="hint">Every sound so far. Tap one to hear it.</p>' + LESSON.chart.map((c) =>
      "<h3>Lesson " + c.lesson + " &middot; " + esc(c.title) + '</h3><div class="soundtiles">' + c.sounds.map(soundTile).join("") + "</div>").join("")
      : '<p class="hint">No letter sounds yet. They start in Lesson 2.</p>'],
    ["words", "Words", () => {
      const w = blockAt("read.words").items, t = blockAt("read.tricky").items;
      return (w.length ? "<h3>Words to read</h3>" + wordChips(w) : "") + (t.length ? "<h3>" + esc(blockAt("read.tricky").title || "Tricky words") + "</h3>" + wordChips(t) : "") ||
        '<p class="hint">No words to read in this lesson. It is all listening and drawing.</p>';
    }],
    lectureTool,
    planTool,
  ] : [
    ["words", "Word list", () => "<h3>" + esc(LESSON.listen.words.title) + "</h3>" + wordRows(LESSON.listen.words.items) + "<h3>" + esc(LESSON.readWrite.words.title) + "</h3>" + wordRows(LESSON.readWrite.words.items)],
    ["phrases", "Phrasebook", () => '<ul class="phrases">' + LESSON.listen.phrases.map((p) => '<li><span class="ph">' + esc(p.text) + '</span><button type="button" class="mini" data-say="' + esc(p.text) + '">&#9654;</button><span class="use">' + esc(p.use) + "</span></li>").join("") +
      LESSON.task.prepare.phrases.map((p) => '<li><span class="ph">' + esc(p) + '</span><button type="button" class="mini" data-say="' + esc(p) + '">&#9654;</button><span class="use">For the task</span></li>').join("") + "</ul>"],
    ["grammar", "Grammar notes", () => LESSON.grammar.rules.map((r) => '<div class="rulecard"><h3>' + esc(r.title) + "</h3><ul>" + r.rule.map((l) => "<li>" + esc(l) + "</li>").join("") + "</ul>" + (r.mistake ? '<p class="mistake">' + esc(r.mistake) + "</p>" : "") + "</div>").join("")],
    lectureTool,
    ["transcripts", "Transcripts", () => "<h3>" + esc(LESSON.listen.conversation.title) + "</h3>" + dialogueHTML(LESSON.listen.conversation.lines) + "<h3>" + esc(LESSON.task.model.title) + "</h3>" + dialogueHTML(LESSON.task.model.lines)],
    ["answers", "Answers", () => "<p class=\"hint\">Try each exercise first, then check here.</p><h3>Conversation</h3>" + answerRows(LESSON.listen.conversation.questions) + "<h3>Grammar practice</h3>" + answerRows(LESSON.grammar.practice) +
      "<h3>Reading</h3>" + answerRows(LESSON.readWrite.gist.concat(LESSON.readWrite.detail)) + "<h3>Quiz</h3>" + answerRows(LESSON.review.quiz)],
    ["mywork", "My work", () => {
      const got = [["Your turn", "yourTurn"], ["Your note", "write"], ["Task notes", "prepare"], ["Before you read", "before"], ["About the book", "talk"]]
        .map(([t, k]) => [t, store.get("w:" + k, "")]).filter(([, v]) => String(v).trim());
      return got.length ? got.map(([t, v]) => "<h3>" + esc(t) + '</h3><div class="reading">' + para(v) + "</div>").join("") + '<p class="hint">Your writing is saved on this device only.</p>'
        : '<p class="hint">Nothing yet. What you write in this lesson appears here.</p>';
    }],
    ["library", "Library", () => '<div class="placeholder"><h3>Books for ' + esc(LESSON.levelShort) + '</h3><p>The books for this level are being prepared. Each lesson will have one; the Library will also hold extra books to read for pleasure.</p></div>'],
    ["wehel", "Wehel tutor", () => "<p>Wehel is your AI tutor. You can talk or write to it at any time.</p><h3>Role-play for this lesson</h3><div class=\"reading\">" + para(LESSON.task.doIt.wehel) + "</div>"],
    planTool,
  ];
  function selectTool(key) {
    const t = TOOLS.find((x) => x[0] === key) || TOOLS[0];
    document.querySelectorAll("#toolbox [data-tool]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tool === t[0])));
    const body = $("toolbox-body");
    body.innerHTML = t[2]();
    body.querySelectorAll(".mini[data-say]").forEach((b) => b.addEventListener("click", () => playClip(b.dataset.say)));
    wireSounds(body);
  }

  /* ================= wiring ============================================== */
  (function wire() {
    /* the menu and the toolbox lists */
    const tb = $("menu-tools");
    if (tb) tb.innerHTML = "<ul>" + TOOLS.map((t) => '<li><button type="button" data-open-tool="' + t[0] + '">' + esc(t[1]) + "</button></li>").join("") + "</ul>";
    $("toolbox-tabs").innerHTML = TOOLS.map((t) => '<button type="button" role="tab" data-tool="' + t[0] + '">' + esc(t[1]) + "</button>").join("");
    $("toolbox-tabs").addEventListener("click", (e) => { const b = e.target.closest("[data-tool]"); if (b) selectTool(b.dataset.tool); });
    document.addEventListener("click", (e) => {
      const ot = e.target.closest("[data-open-tool]");
      if (ot) openToolbox(ot.dataset.openTool);
    });
    $("toolbox-toggle").addEventListener("click", () => openToolbox());
    $("toolbox-close").addEventListener("click", closeToolbox);
    $("toolbox").addEventListener("click", (e) => { if (e.target.id === "toolbox") closeToolbox(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("toolbox").hidden) closeToolbox(); });
    const mt = $("menu-toggle");
    mt.addEventListener("click", () => {
      const m = $("menu"); const open = !m.classList.contains("open");
      m.classList.toggle("open", open); mt.setAttribute("aria-expanded", String(open));
    });
    $("menu-path").addEventListener("click", (e) => {
      const s = e.target.closest("[data-step]");
      if (s) { show(Number(s.dataset.step), true); if (window.innerWidth < 1100) { $("menu").classList.remove("open"); mt.setAttribute("aria-expanded", "false"); } return; }
      const g = e.target.closest("[data-g]");
      if (g) { const m = $("menu-path"); m.dataset["open" + g.dataset.g] = m.dataset["open" + g.dataset.g] === "1" ? "" : "1"; paintMenu(); }
    });
  })();

  /* show() and finish() come from the lifted deck. They are wrapped, never
     edited: progress is remembered here, and the menu repainted. */
  const showDeck = show;
  show = function (i, speak) {
    showDeck(i, speak);
    const s = STEPS[cur];
    if (s) $("where").textContent = GROUPS[s.g].name + " · " + s.t;
    const f = ONSHOW[cur];
    if (f) { try { f(); } catch (_) { /* a step must never break the deck */ } }
    try { localStorage.setItem("iep:" + LESSON.level + ":last", JSON.stringify({ lesson: LESSON.lesson, label: LESSON.label, title: LESSON.title, file: LESSON.file, step: cur, stepTitle: s ? s.t : "" })); } catch (_) {}
    paintMenu();
  };
  const finishDeck = finish;
  finish = function (i, msg) {
    finishDeck(i, msg);
    store.set("done", done.map((d, k) => (d ? k : -1)).filter((k) => k >= 0));
    paintMenu();
  };
  store.get("done", []).forEach((k) => { if (k < done.length) done[k] = true; });


  P.about(0, "s0");
  P.lecture(1, "s1");
  P.warmup(2, "s2");
  P.conversation(3, "s3");
  P.phrases(4, "s4");
  P.words(5, "s5", "listen");
  P.sound(6, "s6");
  P.sayIt(7, "s7");
  P.spot(8, "s8");
  P.rules(9, "s9");
  P.practice(10, "s10");
  P.yourTurn(11, "s11");
  P.readGist(12, "s12");
  P.readDetail(13, "s13");
  P.words(14, "s14", "readWrite");
  P.model(15, "s15");
  P.write(16, "s16");
  P.taskCard(17, "s17");
  P.prepare(18, "s18");
  P.doIt(19, "s19");
  P.compare(20, "s20");
  P.canDo(21, "s21");
  P.before(22, "s22");
  P.book(23, "s23");
  P.bookQuestions(24, "s24");
  P.talk(25, "s25");
  P.wordReview(26, "s26");
  P.quiz(27, "s27");
  window.__ehelPainting = false;
  /* ?step=N (the level page's Continue link) or #step-N. A launched page's
     links carry ?pwsToken&pwsEndpoint, and the carry script appends them after
     everything in an href, so a #fragment there would swallow them. */
  const want = new URLSearchParams(location.search).get("step") || (/^#step-(\d+)$/.exec(location.hash) || [])[1];
  show(want ? Math.min(Math.max(Number(want) - 1, 0), slides.length - 1) : 0, false);
})();
</script>

<script>
  /* wire-navigation.py :: back
     Only when ?from=iep-level-2: a lesson opened on its own has nowhere to go back to. */
  (function () {
    if (new URLSearchParams(location.search).get("from") !== "iep-level-2") return;
    var wrap = document.querySelector(".wrap");
    if (!wrap) return;
    var back = document.createElement("a");
    back.className = "lesson-back";
    back.href = "index.html";
    back.innerHTML = '<span aria-hidden="true">\u2190</span> Level 2 — Getting Things Done';
    wrap.insertBefore(back, wrap.firstChild);
  })();
</script>

<script>
  /* wire-navigation.py :: carry
     Keep ?pwsToken and ?pwsEndpoint alive on every in-app link. Without BOTH,
     the class controls and Wehel do not mount at all - they guard on them and
     return, so the symptom is silence rather than an error. Applied to every
     same-directory link so a control added later cannot reintroduce the gap.
     Done at run time because the values are only known then. */
  (function () {
    var q = new URLSearchParams(location.search);
    q.delete("from");
    if (!q.toString()) return;
    document.querySelectorAll("a[href]").forEach(function (a) {
      var href = a.getAttribute("href");
      if (!href || /^(https?:|mailto:|tel:|#)/i.test(href)) return;   // in-app only
      var base = href.split("?")[0];
      var own = new URLSearchParams(href.split("?")[1] || "");
      q.forEach(function (v, k) { if (!own.has(k)) own.set(k, v); });
      a.setAttribute("href", base + "?" + own.toString());
    });
  })();
</script>

<!-- WIRE-JS-START -->
<script type="module">
  /* The platform controls - see lesson-app-tools/wire-platform-controls.py.
     learner-controls.js holds the SAME singletons the shell mounts. */
  import { mountLearnerControls } from "./learner-controls.js";
  import { mountWehelChat, stopBrowserSpeech } from "./wehel.js";
  import { escapeHtml } from "./course-shell.js";
  /* Focus mode and the session bar. Imported for its side effect - it mounts
     itself, and mounts NOTHING unless the launch carries focusMode=1 or an
     exitUrl, which is why an ordinary launch and every local run see no
     change. It is what writes course_focus_break / course_left_early, so
     without it the live group board's away state can never fire for a learner
     in this build. */
  import "./seb-session.js";

  const q = new URLSearchParams(location.search);
  const launchToken = (q.get("pwsToken") || "").replace(/[^A-Za-z0-9._-]/g, "");
  const launchEndpoint = (q.get("pwsEndpoint") || "").trim();

  let toastEl = null;
  function toast(message) {
    if (toastEl) toastEl.remove();
    toastEl = document.createElement("div");
    toastEl.className = "w-toast";
    toastEl.textContent = message;
    document.body.appendChild(toastEl);
    setTimeout(() => { if (toastEl) { toastEl.remove(); toastEl = null; } }, 3200);
  }

  /* 1. Class chat, Hand up and the Join class pill. They place themselves into
        .top-actions and mount ONLY when the server says a teacher is watching,
        so nothing appears to a child working alone. */
  try {
    mountLearnerControls({
      token: q.get("pwsToken") || "", launchToken, launchEndpoint,
      progressUnit: "u11",
    });
  } catch (e) { console.error("learner controls:", e); }

  /* How far Ask Wehel has to sit above the session bar - see --seb-lift in the
     stylesheet. Measured rather than assumed: the bar wraps, so its height is
     a property of the screen. Re-measured on resize because its clock changes
     width every second and its buttons re-flow. */
  (function () {
    const seb = document.getElementById("seb-session-bar");
    if (!seb) return;                       /* no focus mode, nothing to avoid */
    const lift = () => document.documentElement.style
      .setProperty("--seb-lift", (seb.offsetHeight + 30) + "px");
    lift();
    try { new ResizeObserver(lift).observe(seb); } catch (e) { addEventListener("resize", lift); }
  })();

  /* How far the dock has to lift to clear the Back/Next footer - see
     --wehel-foot-lift in the stylesheet. Unlike the session bar above, .foot
     is ordinary content rather than a second fixed element, so its distance
     from the viewport's bottom edge is a function of SCROLL POSITION, not a
     constant a page-load measurement can capture once - a step long enough to
     need scrolling reaches the same collision the moment .foot is scrolled
     into view. Re-measured on scroll (rAF-throttled to at most once a frame,
     so it costs nothing while the page is still) as well as on resize. */
  (function () {
    const foot = document.querySelector(".foot");
    if (!foot) return;
    const lift = () => {
      const overlap = window.innerHeight - foot.getBoundingClientRect().top;
      document.documentElement.style
        .setProperty("--wehel-foot-lift", (overlap > 0 ? overlap + 14 : 0) + "px");
    };
    let queued = false;
    const onScroll = () => {
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => { queued = false; lift(); });
    };
    lift();
    addEventListener("scroll", onScroll, { passive: true });
    try { new ResizeObserver(lift).observe(foot); } catch (e) { addEventListener("resize", lift); }
  })();

  /* 2. Wehel. Mounted on first open, not on load: the panel asks the server for
        the day's allowance, and a lesson nobody opens the tutor on should not
        spend a request. */
  if (launchToken) {
    const dock = document.createElement("button");
    dock.type = "button"; dock.className = "w-dock"; dock.textContent = "\u{1F4AC} Ask Wehel";
    const drawer = document.createElement("div");
    drawer.className = "w-drawer"; drawer.hidden = true;
    drawer.innerHTML = '<div class="w-drawer-head">Wehel Tutor<button type="button" aria-label="Close">\u00d7</button></div><div class="w-drawer-body"></div>';
    let panel = null;
    function open() {
      drawer.hidden = false; dock.hidden = true;
      if (panel) return;
      try {
        panel = mountWehelChat({
          container: drawer.querySelector(".w-drawer-body"),
          meta: {
            subject: "intensive-english", subjectLabel: "Intensive English", grade: 2,
            unitNo: 11, unitTitle: "Travel and timetables",
            learnerCategory: q.get("category") || "",
          },
          store: {},
          ui: { escapeHtml, toast },
          tutorLabel: "Wehel Tutor",
          placeholder: "Ask about Travel and timetables\u2026",
          /* The chips a young learner presses, written as the sentence they
             would have said. Four, because a row a six-year-old scans has to
             be short and a fifth makes the other four less likely to be read.

             "Give me a hint" is the one that carries a teaching stance: it
             says "not the answer" in the message itself, so pressing it cannot
             turn the tutor into an answer machine even before the prompt file
             has its say.

             True of every app this tool wires - Grade 1 English and the four
             Mathematics builds - which is why none of them names a word, a
             sentence or a number. */
          quickPrompts: [
            { label: "I do not understand", message: "I do not understand this step. Please explain it again in a simpler way, with a small example." },
            { label: "Give me a hint", message: "Give me a hint for this step, not the answer, so I can try it myself." },
            { label: "Make it easier", message: "This is too hard for me right now. Break it into a smaller, easier step and start me there." },
            { label: "Quiz me", message: "Quiz me on this lesson, one question at a time." },
          ],
        });
      } catch (e) {
        console.error("wehel:", e);
        drawer.hidden = true; dock.hidden = false;
        toast("Wehel is not available on this page.");
      }
    }
    function close() { drawer.hidden = true; dock.hidden = false; }
    dock.addEventListener("click", open);
    drawer.querySelector("button").addEventListener("click", close);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !drawer.hidden) close(); });
    document.body.append(dock, drawer);

    /* ONE VOICE BETWEEN THE LESSON AND THE TUTOR. Wehel reads its replies
       aloud by default and knew nothing of the lesson's voice, so a reply
       could play over a line the lesson was reading. The lesson stops the
       tutor when it starts a line (__ehelTutorQuiet), and the lesson stops
       when the tutor starts reading - which the drawer shows as a Stop
       button, .voice-button.is-playing. Only the moment that button APPEARS
       counts: the panel repaints often, and repainting a reply already being
       read must not cut off a line the lesson has just begun. */
    window.__ehelTutorQuiet = stopBrowserSpeech;
    let tutorReading = false;
    new MutationObserver(() => {
      const now = !!drawer.querySelector(".voice-button.is-playing");
      if (now && !tutorReading && window.__ehelVoiceStop) window.__ehelVoiceStop();
      tutorReading = now;
    }).observe(drawer, { subtree: true, childList: true, attributes: true, attributeFilter: ["class"] });
  }
</script>

<script type="module">
  /* Progress reporting - see lesson-app-tools/wire-progress.py, especially
     THE UNIT PROBLEM for why this writes lNN and not uNN. */
  import { createProgressClient } from "./progress-client.js";

  const q = new URLSearchParams(location.search);
  const endpoint = (q.get("pwsEndpoint") || "").trim();
  const token = (q.get("pwsToken") || "").replace(/[^A-Za-z0-9._-]/g, "");

  const COURSE = "ehel-intensive-eng-l13";
  const UNIT = "u11";
  const STUDENT = q.get("studentid") || "local";

  /* Without a launch endpoint the backend is "local": everything still
     reduces into localStorage so resume works, and nothing is sent. That is
     the same rule the shell follows, and it is why opening a lesson as a file
     or an artifact costs nothing and reports nothing. */
  const ws = createProgressClient({
    course: COURSE, student: STUDENT,
    backend: endpoint ? "remote" : "local",
    endpoint: endpoint || undefined,
    token: token || undefined,
    /* A blocked or expired write path is INVISIBLE otherwise - the throw is
       caught, the events queue, and the learner is told nothing while their
       work stops reaching the school. Said on the learner's own screen
       because the server cannot tell a blocked learner from a closed tab. */
    onAuthLost: () => notice("Your session has expired. Your work is saved on this device \u2014 open the lesson again from your class page."),
    onDeliveryFailing: () => notice(navigator.onLine
      ? "Your work is saved here, but it is not reaching your school right now."
      : "You are offline. Your work is saved here and will be sent when you are back."),
    onDeliveryRecovered: () => clearNotice(),
  });

  const emit = (e) => { try { ws.emit(e); } catch (_) { /* never break the lesson */ } };

  let noticeEl = null;
  function notice(text) {
    if (!noticeEl) {
      noticeEl = document.createElement("p");
      noticeEl.className = "progress-notice";
      noticeEl.setAttribute("role", "status");
      document.querySelector(".wrap")?.prepend(noticeEl);
    }
    noticeEl.textContent = text;
  }
  function clearNotice() { if (noticeEl) { noticeEl.remove(); noticeEl = null; } }

  const slides = [...document.querySelectorAll(".slide")];
  /* The lesson's own arithmetic: show() prints "Step n of slides.length - 1",
     so the last slide is the sticker shelf and not a step. Read from the
     lesson rather than counted here, so the two cannot disagree. */
  const STEPS = Math.max(1, slides.length - 1);
  const sectionId = (i) => "step-" + String(i + 1).padStart(2, "0");
  const labelOf = (i) => (slides[i]?.querySelector("h2")?.textContent || "").trim() || sectionId(i);

  const doneIds = new Set();
  let unitSent = false;

  /* WHERE the learner is, which is not what sectionsDone says: a learner
     stuck twenty minutes into the next step is exactly the one a supervising
     teacher needs to see. `resumeLabel` rides beside the id because a board
     printing "step-04" shows a teacher a word that appears nowhere on the
     child's screen. */
  /* Activity-level participation, {section: {answered, total}}, and the words
     the learner has shown they know. Both ride on progress.summary because the
     reducer keeps them there and nowhere else; both are whole-map
     last-write-wins, so every summary sends everything known so far rather
     than a delta that could strand a count.

     The server caps `attempted` at 20 sections and requires
     ^[a-z0-9][a-z0-9_-]{0,39}$ - no dots, no slashes - so ids are kept in that
     shape here rather than being rejected silently there. */
  const attempted = {};
  const known = new Set();
  let lastAt = 0;

  /* WHAT THE RECORD ALREADY HOLDS FOR THIS UNIT, read once at load.

     Both maps above are REPLACED by the reducer, not merged, and both start
     empty on every page load - so without this the first participation event
     of a new session deletes every section reported in an earlier one. A child
     who read four books on Monday and answered one question on Tuesday would
     have Monday erased by Tuesday's first tick.

     It is kept SEPARATE from the live maps rather than copied into them,
     because hydrate is asynchronous and a report can fire before it lands.
     Merged at send time, an early report sends a partial map and the next one
     repairs it; a seed would simply have missed the window. If hydrate cannot
     be reached at all the baseline stays empty, which is the behaviour without
     it. */
  let baseAttempted = {};
  let baseKnown = [];
  /* step-NN -> the slide's 0-based index; anything else -> -1 */
  const indexOf = (id) => {
    const m = /^step-(\d{2})$/.exec(String(id || ""));
    return m ? Number(m[1]) - 1 : -1;
  };
  (async () => {
    try {
      const doc = await ws.hydrate();
      const u = doc && doc.units && doc.units[UNIT];
      if (!u) return;
      if (u.attempted && typeof u.attempted === "object") baseAttempted = u.attempted;
      if (Array.isArray(u.knownWords)) baseKnown = u.knownWords;
      /* RESUME. The sections the record says are done are done - seeded into
         doneIds too, so unit.completed still fires on the day the LAST step
         is finished even if the first seven were finished last week - and
         the deck is told to tick them and open where the learner was. Without
         this a child who closed the tab reopened to an empty dot rail and
         step 1, while the school's record said otherwise; measured on the
         Science build on 2026-09-10, and true of every build this tool wires. */
      const doneIdx = (Array.isArray(u.sectionsDone) ? u.sectionsDone : []).map(indexOf).filter((i) => i >= 0);
      for (const i of doneIdx) doneIds.add(sectionId(i));
      const resumeIdx = indexOf(u.resume);
      if (window.__ehelRestore && (doneIdx.length || resumeIdx > 0)) {
        try { window.__ehelRestore(doneIdx, resumeIdx); } catch (_) { /* never break the lesson */ }
      }
    } catch (_) { /* never break the lesson */ }
  })();


  function report(i) {
    lastAt = i;
    const ev = {
      type: "progress.summary", unit: UNIT,
      sectionsDone: [...doneIds],
      resume: sectionId(i), resumeLabel: labelOf(i),
      xp: doneIds.size,
    };
    /* This session's answers WIN over the stored ones for the same section -
       a child who re-does a step is telling us something newer. */
    const allAttempted = { ...baseAttempted, ...attempted };
    const allKnown = new Set([...baseKnown, ...known]);
    if (Object.keys(allAttempted).length) ev.attempted = allAttempted;
    if (allKnown.size) ev.knownWords = [...allKnown];
    emit(ev);
    try { ws.flush?.(); } catch (_) { /* never break the lesson */ }
  }

  window.__ehelStep = function (i, done) {
    const id = sectionId(i);
    if (!doneIds.has(id)) {
      doneIds.add(id);
      emit({ type: "section.completed", unit: UNIT, section: id, title: labelOf(i) });
    }
    if (!unitSent && doneIds.size >= STEPS) {
      unitSent = true;
      emit({ type: "unit.completed", unit: UNIT, sectionsDone: [...doneIds], total: STEPS });
    }
    report(i);
  };
  window.__ehelAt = function (i) { lastAt = i; report(i); };

  /* A SCORE, where a step actually produces one.
     checkpoint.result is the only event the reducer turns into something a
     teacher or a parent can read as a mark - the portal's quiz tables and the
     gradebook are both fed from it - and nothing here emitted it, so every
     scored step reported that it was DONE and never how it went.

     ADDITIVE ON PURPOSE. A lesson that never calls this behaves exactly as it
     did, which is what makes it safe in a tool three builds share.

     ONLY WHERE THERE IS A REAL DENOMINATOR. `total` must be the number of
     questions asked; a step that cannot say how many it asked must not call
     this, because a score with an invented denominator is a mark nobody
     measured. Play is deliberately excluded for the same reason the rollup
     drops the Quran app's `games` star counts: a game is for practising. */
  window.__ehelScore = function (i, right, total, sub, subTitle) {
    const n = Number(total) || 0;
    const got = Math.max(0, Math.min(Number(right) || 0, n));
    if (!n) return;
    /* `sub` gives ONE ACTIVITY INSIDE A STEP its own row - a single game out
       of the twelve, say. The reducer keys checkpoints by this string and does
       not validate it, so it is normalised here: lower case, hyphens only, and
       short enough to read in a portal table. */
    const key = sub
      ? sectionId(i) + "-" + String(sub).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 28)
      : sectionId(i);
    emit({
      type: "checkpoint.result", unit: UNIT, section: key,
      title: subTitle ? labelOf(i) + ": " + subTitle : labelOf(i),
      score: Math.round((got / n) * 100), correct: got, total: n,
    });
    try { ws.flush?.(); } catch (_) { /* never break the lesson */ }
  };

  /* PARTICIPATION where there is no score to give. "8 of 12 activities
     ticked" is a real fact about a learner and is not a mark; sending it as a
     checkpoint would put a percentage on work nobody assessed, which is the
     thing the rollup already refuses to do for the Quran app's game stars. */
  window.__ehelAttempt = function (i, answered, total, noun) {
    const n = Number(total) || 0;
    if (!n) return;
    /* WHAT THIS IS CALLED, and what the two numbers count. The section id is a
       POSITION here - `step-08` - and the same position is a different
       activity in each app sharing this pipeline, so no reader of the stored
       document can name it. `labelOf(i)` is the caption the learner is looking
       at, the same one resumeLabel carries for the same reason: a surface
       printing the id names a section nobody can find.

       The noun is passed by the call site because only it knows: books, words,
       rules, seconds. Both are optional and the server bounds them. */
    attempted[sectionId(i)] = {
      answered: Math.max(0, Math.min(Number(answered) || 0, n)),
      total: n,
      label: labelOf(i),
      ...(noun ? { noun: String(noun) } : {}),
    };
    report(i);
  };

  /* Words the learner has shown they know, by tapping the right one when it
     was said or pictured. A set, so hearing the same word in two steps counts
     once, and the summary sends the whole list because the reducer replaces
     rather than merges. */
  window.__ehelKnown = function (words) {
    const list = Array.isArray(words) ? words : [words];
    let added = false;
    for (const w of list) {
      const t = String(w || "").trim().toLowerCase();
      if (t && !known.has(t)) { known.add(t); added = true; }
    }
    // `cur` belongs to the deck's IIFE and this block is a separate module,
    // so it is not in scope here - reading it would throw. The last position
    // the deck told us about is, and that is the honest answer anyway.
    if (added) report(lastAt);
  };
</script>
