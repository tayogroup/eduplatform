        if (tag === "prosody") {
          c = { rate: relative(n.getAttribute("rate"), RATE_WORD, ctx.rate), pitch: relative(n.getAttribute("pitch"), PITCH_WORD, ctx.pitch), volume: relative(n.getAttribute("volume"), VOLUME_WORD, ctx.volume) };
        } else if (tag === "emphasis") {
          const k = { strong: 1, moderate: 0.55, reduced: -0.5, none: 0 }[n.getAttribute("level") || "moderate"] || 0.55;
          c = { rate: ctx.rate * (1 - 0.08 * k), pitch: ctx.pitch * (1 + 0.11 * k), volume: ctx.volume };
        } else if (tag === "express-as") {
          const s = STYLE[(n.getAttribute("style") || "").toLowerCase()] || [1, 1];
          const deg = Math.max(0.01, Math.min(2, parseFloat(n.getAttribute("styledegree") || "1") || 1));
          c = { rate: ctx.rate * (1 + (s[0] - 1) * deg), pitch: ctx.pitch * (1 + (s[1] - 1) * deg), volume: ctx.volume };
        }
        walk(n, c, out);
        if (tag === "p") out.push({ pause: 450 });
        else if (tag === "s") out.push({ pause: 240 });
      }
    }

    function escapeText(s) {
      return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    const OPEN = '<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xmlns:mstts="http://www.w3.org/2001/mstts" xml:lang="en-GB"><voice name="en-GB-SoniaNeural">';
    const SHUT = "</voice></speak>";
    /* Plain text is still SSML here - it just gets the house style put round it. */
    function wrap(x) {
      const s = String(x == null ? "" : x).trim();
      if (!s) return "";
      if (/^<speak[\s>]/i.test(s)) return s;
      const body = /<(mstts:)?express-as|<prosody|<emphasis|<break|<say-as|<[sp]>/i.test(s) ? s : escapeText(s);
      /* A line that already names its own feeling keeps it: Azure forbids one
         express-as inside another, so the house style stands aside. */
      if (/<(mstts:)?express-as[\s>]/i.test(body)) return OPEN + body + SHUT;
      return OPEN + '<mstts:express-as style="cheerful" styledegree="1.25">' + '<prosody volume="+20%" rate="+3%" pitch="+2%">' + body + "</prosody></mstts:express-as>" + SHUT;
    }

    function flatten(ssml) {
      const doc = new DOMParser().parseFromString(ssml, "application/xml");
      const out = [];
      if (doc.getElementsByTagName("parsererror").length) {
        out.push({ text: ssml.replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim(), rate: 1, pitch: 1, volume: 1 });
      } else {
        walk(doc.documentElement, { rate: 1, pitch: 1, volume: 1 }, out);
      }
      /* Chrome truncates a long utterance, so break on sentence ends. */
      const cut = [];
      for (const seg of out) {
        if (seg.pause != null) { cut.push(seg); continue; }
        let t = seg.text.trim();
        while (t.length > 170) {
          let at = t.lastIndexOf(". ", 170);
          if (at < 60) at = t.lastIndexOf(", ", 170);
          if (at < 60) at = t.lastIndexOf(" ", 170);
          if (at < 40) at = 170;
          cut.push({ text: t.slice(0, at + 1).trim(), rate: seg.rate, pitch: seg.pitch, volume: seg.volume });
          t = t.slice(at + 1).trim();
        }
        if (t) cut.push({ text: t, rate: seg.rate, pitch: seg.pitch, volume: seg.volume });
      }
      return cut;
    }

    /* ---- playing it ---- */
    let queue = [], at = 0, timer = null, keepAlive = null, speaking = false;
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    function mark(on) {
      speaking = on;
      document.body.classList.toggle("voice-on", on);
      if (on) {
        /* Chrome stops a long run dead at about fifteen seconds unless poked. */
        clearInterval(keepAlive);
        keepAlive = setInterval(() => { try { window.speechSynthesis.resume(); } catch (e) {} }, 6000);
      } else { clearInterval(keepAlive); keepAlive = null; }
    }
    /* The words a parsed queue would say, as one line. An endpoint that takes
       text and not SSML cannot be handed <break time="320ms"/>, so a real pause
       becomes the full stop it was standing in for, and the pictographs go the
       same way they go on the browser path. */
    function spoken(segs) {
      let out = "";
      for (const seg of segs) {
        if (seg.pause != null) {
          if (seg.pause >= 300 && out && !/[.!?\u2026][\"'\u201d\u2019)]*\s*$/.test(out)) out += ".";
          out += " ";
          continue;
        }
        out += (out && !/\s$/.test(out) ? " " : "") + seg.text;
      }
      return out.replace(PICTOGRAPH, " ").replace(/[ ]+/g, " ").trim();
    }

    /* The endpoint first, the browser's own voice if it refuses. A lesson that
       goes quiet because a server was down is worse than one read by whatever
       voice the device has. */
    function viaPlatform(segs, replace) {
      const line = spoken(segs);
      if (!line) { mark(false); return; }
      PLATFORM_VOICE.play(line, replace).then(function () {
        if (!PLATFORM_VOICE.busy()) mark(false);
      }, function () {
        if (!SUPPORTED) { mark(false); return; }
        queue = segs; at = 0; next();
      });
    }

    function stop() {
      clearTimeout(timer); timer = null; queue = []; at = 0;
      try { window.speechSynthesis.cancel(); } catch (e) {}
      PLATFORM_VOICE.stop();
      mark(false);
    }
    function next() {
      if (at >= queue.length) { mark(false); return; }
      const seg = queue[at++];
      if (seg.pause != null) { timer = setTimeout(next, seg.pause); return; }
      const words = seg.text.replace(PICTOGRAPH, " ").replace(/[ ]+/g, " ").trim();
      if (!words) { next(); return; }
      let u;
      try { u = new SpeechSynthesisUtterance(words); } catch (e) { mark(false); return; }
      if (voice) u.voice = voice;
      u.lang = (voice && voice.lang) || "en-GB";
      u.rate = clamp(BASE_RATE * seg.rate, 0.5, 2);
      u.pitch = clamp(BASE_PITCH * seg.pitch, 0.1, 2);
      /* 0..1 and already at 1, so an authored boost clamps away here - see VOLUME_WORD */
      u.volume = clamp(seg.volume == null ? 1 : seg.volume, 0, 1);
      u.onend = next;
      u.onerror = next;
      try { window.speechSynthesis.speak(u); } catch (e) { next(); }
    }
    function speak(x) {
      if (!SUPPORTED && !PLATFORM_VOICE.ready()) return;
      const ssml = wrap(x);
      if (!ssml) return;
      stop();
      queue = flatten(ssml);
      remember(queue);
      at = 0;
      if (!queue.length) return;
      mark(true);
      if (PLATFORM_VOICE.ready()) { viaPlatform(queue, true); return; }
      next();
    }
    /* queue rather than interrupt: a reaction should not cut off a sentence
       the child is still listening to, unless that sentence is the old one */
    function follow(x) {
      if (!SUPPORTED && !PLATFORM_VOICE.ready()) return;
      const ssml = wrap(x);
      if (!ssml) return;
      if (PLATFORM_VOICE.ready()) {
        /* the endpoint plays whole clips, so a follow-up is the next clip in
           the chain rather than more segments spliced into this one */
        const segs = flatten(ssml);
        remember(segs);
        if (!speaking) mark(true);
        viaPlatform(segs, false);
        return;
      }
      if (!speaking) return speak(ssml);
      queue = queue.slice(at).concat([{ pause: 250 }], flatten(ssml));
      remember(queue);
      at = 0;
    }


    /* What she has just said, so praise does not repeat the sentence the lesson
       spoke a beat earlier. "Ten! The frame is full." once, then "That is right." */
    const recent = [];
    function remember(segs) {
      for (const s of segs) if (s.text) recent.push(s.text.replace(/[ ]+/g, ' ').trim().toLowerCase());
      while (recent.length > 16) recent.shift();
    }
    function saidRecently(t) {
      const n = String(t == null ? '' : t).replace(/[ ]+/g, ' ').trim().toLowerCase();
      if (n.length < 8) return false;
      return recent.join(' | ').indexOf(n) >= 0;
    }
    return {
      speak: speak, follow: follow, stop: stop,
      supported: SUPPORTED,
      voiceName: () => (voice ? voice.name : null),
      isSonia: () => !!(voice && /\bsonia\b/i.test(voice.name)),
      OPEN: OPEN, SHUT: SHUT, esc: escapeText,
      speaking: () => speaking,
      saidRecently: saidRecently,
      /* which voice this page is actually using, for anyone checking */
      platformEndpoint: () => PLATFORM_VOICE.endpoint()
    };
  })();

  /* Every call site in this lesson already says say(...). It now goes to Sonia. */
  /* Silent while the deck paints -- see window.__ehelPainting in
     build-lessons.py. Every call site in this lesson goes through say(), so
     this is the one place the draw pass can be silenced without touching a
     single renderer. */
  function say(text) { if (window.__ehelPainting) return; VOICE.speak(text); }

  /* ==================================================================
     WHAT SHE SAYS BACK

     A lesson that only reads its own instructions is a page with a
     loudspeaker. These are the lines she says about what the child has just
     DONE - and after a wrong answer she reads the page's own hint aloud,
     so the help arrives in the ear as well as on the screen.

     Each bank is rotated rather than shuffled, so the same praise never
     lands twice running.
     ================================================================== */
  const REACTION = (function () {
    const S = VOICE.OPEN, E = VOICE.SHUT;
    const cheer = (deg, body) => S + '<mstts:express-as style="cheerful" styledegree="' + deg + '">' + body + "</mstts:express-as>" + E;
    const kind = (body) => S + '<mstts:express-as style="empathetic" styledegree="1.3">' + body + "</mstts:express-as>" + E;
    const excite = (body) => S + '<mstts:express-as style="excited" styledegree="1.7">' + body + "</mstts:express-as>" + E;

    const BANKS = {
      right: [
        cheer("1.6", 'Yes! <break time="120ms"/> That is <emphasis level="strong">exactly</emphasis> it.'),
        cheer("1.5", 'That is right. <break time="140ms"/> <prosody pitch="+8%">Well done.</prosody>'),
        cheer("1.7", '<prosody rate="fast" pitch="+12%">Spot on!</prosody>'),
        cheer("1.4", 'Lovely. <break time="120ms"/> You worked that out beautifully.'),
        cheer("1.6", '<prosody pitch="+10%">Brilliant.</prosody> <break time="120ms"/> Straight there.')
      ],
      wrong: [
        kind('Not quite. <break time="220ms"/> Have another look.'),
        kind('<prosody rate="slow">Hmm.</prosody> <break time="250ms"/> Not that one. Let us think it through again.'),
        kind('Close. <break time="200ms"/> Try one more time - you are nearly there.'),
        kind('Not this time. <break time="220ms"/> Read it once more, slowly.')
      ],
      stepDone: [
        excite('Step finished! <break time="150ms"/> That is a sticker for you.'),
        excite('<prosody pitch="+10%">You have done it!</prosody> <break time="150ms"/> Another sticker.'),
        excite('All done here. <break time="150ms"/> <emphasis level="strong">Great</emphasis> work.')
      ],
      streak: [
        excite('<prosody rate="fast" pitch="+14%">Three in a row!</prosody> <break time="150ms"/> You are flying.'),
        excite('<prosody pitch="+12%">That is three!</prosody> <break time="140ms"/> Keep going.')
      ],
      lessonDone: [
        S + '<mstts:express-as style="excited" styledegree="1.7"><prosody pitch="+8%">You have finished the whole lesson.</prosody></mstts:express-as>' +
            '<break time="300ms"/>' +
            '<mstts:express-as style="hopeful" styledegree="1.4">I am so proud of you.</mstts:express-as>' + E
      ]
    };
    const turn = {};
    function line(kindName) {
      const bank = BANKS[kindName];
      if (!bank || !bank.length) return "";
      const i = (turn[kindName] = ((turn[kindName] || 0) + 1) % bank.length);
      return bank[i];
    }

    let streak = 0, saidDone = false;
    function fire(kindName, alsoRead) {
      let ssml = line(kindName);
      if (!ssml) return;
      const extra = String(alsoRead || "").replace(/\s+/g, " ").trim();
      if (extra && !VOICE.saidRecently(extra)) {
        ssml = ssml.replace(VOICE.SHUT, '<break time="320ms"/><mstts:express-as style="friendly" styledegree="1.2">' +
          VOICE.esc(extra) + "</mstts:express-as>" + VOICE.SHUT);
      }
      /* queue rather than interrupt: when a step completes the lesson says its
         own line first, and praise that cuts the teaching off is worse than
         praise that waits its turn */
      VOICE.follow(ssml);
    }
    return {
      right: function (alsoRead) {
        streak += 1;
        if (streak > 0 && streak % 3 === 0) fire("streak", alsoRead);
        else fire("right", alsoRead);
      },
      wrong: function (alsoRead) { streak = 0; fire("wrong", alsoRead); },
      stepDone: function (alsoRead) { fire("stepDone", alsoRead); },
      lessonDone: function () { if (saidDone) return; saidDone = true; fire("lessonDone"); },
      fire: fire
    };
  })();

  /* ==================================================================
     WATCHING, RATHER THAN BEING TOLD

     The lesson code already decides right from wrong: it puts .good or .bad
     on a feedback line, or .right / .wrong on an answer button. Reading
     those changes instead of editing every check keeps one description of
     "the child got it" rather than two that can drift apart - and it means
     a new question is reacted to the day it is written.
     ================================================================== */
  (function () {
    if (!VOICE.supported) return;
    const RIGHT = /(^|\s)(good|right|correct)(\s|$)/;
    const WRONG = /(^|\s)(bad|wrong)(\s|$)/;
    const watched = ".fb, .opt, .card, .ocard, [data-answer]";
    const last = new WeakMap();

    /* One verdict per action, not one per element. Marking a wrong answer also
       lights the CORRECT option green, so reading each class change on its own
       would praise a child who had just got it wrong. The changes from one tap
       are collected and judged together, and a wrong anywhere in the batch wins. */
    let batch = [], scheduled = false;
    function judge() {
      scheduled = false;
      const items = batch; batch = [];
      let verdict = "", hint = "", praiseText = "";
      for (const el of items) {
        const cls = " " + el.className + " ";
        const now = WRONG.test(cls) ? "wrong" : RIGHT.test(cls) ? "right" : "";
        if (!now) { last.delete(el); continue; }
        if (last.get(el) === now) continue;
        last.set(el, now);
        if (now === "wrong") { verdict = "wrong"; hint = hint || hintFor(el); }
        else if (verdict !== "wrong") { verdict = "right"; praiseText = praiseText || (el.matches(".fb") ? el.textContent : ""); }
      }
      if (verdict === "wrong") REACTION.wrong(hint);
      else if (verdict === "right") REACTION.right(praiseText);
    }
    function queueJudge(el) {
      batch.push(el);
      if (scheduled) return;
      scheduled = true;
      setTimeout(judge, 0);
    }

    function hintFor(el) {
      /* the page's own explanation, if it has just put one up */
      const q = el.closest(".q, .slide, .step, .stage, section");
      if (!q) return el.textContent;
      const why = q.querySelector(".why, .fb.bad");
      const text = (why && why.textContent) || el.textContent || "";
      return text.length > 260 ? text.slice(0, 260) : text;
    }

    const obs = new MutationObserver((records) => {
      for (const r of records) {
        if (r.type === "attributes" && r.target.matches && r.target.matches(watched)) queueJudge(r.target);
        if (r.type === "childList") {
          for (const n of r.addedNodes) {
            if (n.nodeType === 1 && n.matches && n.matches(watched)) queueJudge(n);
          }
        }
      }
    });
    obs.observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["class"] });
  })();

  /* ==================================================================
     THE EXPLAINER

     The speaker reads the instruction. Explain is the thing a teacher says
     when a child says "I do not get it" - a short spoken mini-lesson in four
     moves, about thirty to sixty seconds:

         NAME     the idea, in the plainest words there are
         SHOW     one worked example, using THIS step's own content
         WARN     the mistake children actually make here, named out loud
         HAND     back, with one small thing to try right now

     Each move is its own <mstts:express-as> - calm, friendly, empathetic,
     cheerful - as SIBLINGS, never nested, because Azure forbids one inside
     another and the walker below would flatten a nested pair anyway.

     AUTHORED BEATS DERIVED. A step carries its own mini-lesson in a
     data-explain attribute on the .slide (or .step): the BODY of the SSML
     only, since the <speak> wrapper names the voice and lives in VOICE.OPEN,
     so re-voicing the course stays one edit. Where a step has none, the
     derived explainer below still speaks - thinner, never silent.

     The old version built one line out of the heading, the instruction and
     the note, so a child who did not understand the instruction heard the
     instruction again. It re-read the page instead of teaching it.
     ================================================================== */
  (function () {
    if (!VOICE.supported) return;
    const S = VOICE.OPEN, E = VOICE.SHUT, esc = VOICE.esc;
    const clean = (s) => String(s || "").replace(/\s+/g, " ").trim();
    /* say a number as a number, and lean on it - it is the thing being taught */
    function markNumbers(t) {
      return esc(t).replace(/(\d[\d,.]*\s?%?)/g, '<emphasis level="moderate">$1</emphasis>');
    }
    function sentences(parts) {
      return parts.filter(Boolean).map((p) => "<s>" + markNumbers(clean(p)) + "</s>").join('<break time="180ms"/>');
    }
    /* ".note" is a teaching aside in most of these lessons and a BANKNOTE in
       Coins and Change, where it is a button reading "100 sh" - which the
       explainer duly read out. Take it only where it is prose: not a control,
       and long enough to be a sentence rather than a label. */
    function proseNote(host) {
      for (const n of host.querySelectorAll(".note")) {
        if (n.closest("button, a, input, label")) continue;
        const t = clean(n.textContent);
        if (t.length > 24 && t.indexOf(" ") > 0) return t;
      }
      return "";
    }
    /* Azure refuses one express-as inside another, and this walker would give
       a nested pair the inner style with the outer one silently discarded -
       so a nested authored body is not a style bug, it is a different lesson
       than the one that was written. Rejected rather than spoken. */
    function nestsExpressAs(doc) {
      const all = doc.getElementsByTagNameNS("*", "express-as");
      for (let i = 0; i < all.length; i++) {
        for (let p = all[i].parentNode; p && p.nodeType === 1; p = p.parentNode) {
          if (String(p.localName || "").toLowerCase() === "express-as") return true;
        }
      }
      return false;
    }
    /* The step's own mini-lesson, if it was written one. A typo in the
       attribute must not become a flat tagless mumble - flatten() recovers
       from a parse error by stripping every tag, which still speaks but
       throws away every pause and every stress - so it is parsed HERE and
       the derived explainer takes over if it does not hold up. */
    function authoredFor(host) {
      const body = clean(host && host.getAttribute && host.getAttribute("data-explain"));
      if (!body) return "";
      const ssml = S + body + E;
      let doc;
      try { doc = new DOMParser().parseFromString(ssml, "application/xml"); } catch (e) { return ""; }
      if (!doc || doc.getElementsByTagName("parsererror").length) return "";
      if (nestsExpressAs(doc)) return "";
      return ssml;
    }
    /* No authored copy: say more than the page says, and say it in the same
       four moves, so the two never sound like different features. The slide's
       data-say is the teacher's framing of the idea and the explainer never
       used to read it; the .say line is the instruction. Naming what a child
       can do when still stuck is the closest a derived explainer gets to the
       WARN move, which needs a human who knows the maths. */
    function derivedFor(host) {
      const head = host.querySelector(".slide-head h2, .step-head h2, h2, h3");
      const lead = host.querySelector(".intro, .say > span, [data-say-text]");
      const title = clean(head && head.textContent);
      const idea = clean(host.getAttribute && host.getAttribute("data-say"));
      const task = clean(lead && lead.textContent);
      const note = proseNote(host);
      if (!title && !idea && !task) return "";
      /* data-say and the on-screen instruction usually say the same thing in
         almost the same words, and reading both made the derived explainer
         repeat itself sentence for sentence. Keep the first, drop a later
         source that adds nothing. */
      const said = [];
      /* Containment is not enough: "Press the plus to put a counter in the
         frame" and "Press + to put a counter in the frame" are the same
         sentence and neither contains the other. Compare word overlap against
         the shorter of the two instead. */
      const words = (t) => String(t || "").toLowerCase().replace(/[^a-z0-9 ]/gi, " ").split(/\s+/).filter(Boolean);
      const fresh = (t) => {
        const w = words(t);
        if (!w.length) return "";
        for (const p of said) {
          const small = Math.min(p.length, w.length);
          if (!small) continue;
          const shared = w.filter((x) => p.indexOf(x) >= 0).length;
          if (shared / small >= 0.8) return "";
        }
        said.push(w);
        return t;
      };
      const ideaOnce = fresh(idea);
      const taskOnce = fresh(task);
      const noteOnce = fresh(note);
      const name = sentences([title && "This step is called " + title + ".", ideaOnce]);
      const show = sentences([taskOnce, noteOnce]);
      return S +
        '<mstts:express-as style="calm" styledegree="1.15"><prosody rate="-8%">' +
        "<s>Let me talk you through this one.</s>" + '<break time="280ms"/>' + name +
        "</prosody></mstts:express-as>" +
        (show ? '<break time="330ms"/><mstts:express-as style="friendly" styledegree="1.25">' +
          "<s>Here is what to do.</s>" + '<break time="220ms"/>' + show + "</mstts:express-as>" : "") +
        '<break time="330ms"/>' +
        '<mstts:express-as style="cheerful" styledegree="1.45">' +
        "<s>Have a go at the first one.</s>" + '<break time="200ms"/>' +
        "<s>If you are not sure, press the speaker and I will read it to you again.</s>" +
        "</mstts:express-as>" + E;
    }
    function explainerFor(host) {
      return authoredFor(host) || derivedFor(host);
    }

    function button(host, label) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "explain";
      b.innerHTML = '<span aria-hidden="true">💬</span><span class="explain-t">' + label + "</span>";
      b.setAttribute("aria-label", "Explain this step to me");
      b.addEventListener("click", () => {
        const ssml = explainerFor(host);
        if (ssml) VOICE.speak(ssml);
      });
      return b;
    }

    /* the decks already carry a voice bar on every slide */
    document.querySelectorAll(".slide .say, .stage .say").forEach((bar) => {
      const host = bar.closest(".slide") || bar.parentElement;
      bar.appendChild(button(host, "Explain"));
    });
    /* the scrolling lessons carry none, so give each step one */
    document.querySelectorAll(".step").forEach((step) => {
      if (step.querySelector(".say")) return;
      const intro = step.querySelector(".intro");
      if (!intro) return;
      const bar = document.createElement("div");
      bar.className = "say";
      const read = document.createElement("button");
      read.type = "button";
      read.className = "speak";
      read.setAttribute("aria-label", "Read this step to me");
      read.textContent = "🔊";
      read.addEventListener("click", () => {
        VOICE.speak(S + '<mstts:express-as style="friendly" styledegree="1.25">' +
          markNumbers(clean(intro.textContent)) + "</mstts:express-as>" + E);
      });
      const span = document.createElement("span");
      span.textContent = "Listen to this step, or ask me to explain it.";
      bar.appendChild(read);
      bar.appendChild(span);
      bar.appendChild(button(step, "Explain"));
      intro.parentNode.insertBefore(bar, intro.nextSibling);
    });
  })();

  /* ==================================================================
     THE DECK - lifted verbatim from mathematics/grade-1-app/g1v2 with
     the two progress hooks REMOVED, because the shared progress step in
     lesson-app-tools puts them back and its anchors only match the
     unwired shape. Do not re-add them by hand: the gate asserts the
     call sites, and a second copy would report every step twice.

     Do not name that tool's FILE anywhere in a generated page either.
     Its own filename is the marker it tests for idempotence, so a
     comment mentioning it makes the tool skip a page it has never
     touched - and the page then ships reporting nothing, silently.
     This comment used to do exactly that.
     ================================================================== */
  const $ = (id) => document.getElementById(id);
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const cheer = () => ["Yes!", "Well done!", "Super!", "That's it!", "Brilliant!"][rnd(0, 4)];
  const plain = (html) => String(html).replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();


  /* ---- deck ---- */
  const slides = [...document.querySelectorAll(".slide")];
  const done = new Array(slides.length).fill(false);
  let cur = 0;
  function paintDots() {
    $("dots").innerHTML = slides.map((s, i) => '<button type="button" class="' + (i === cur ? "now" : done[i] ? "done" : "") + '" data-i="' + i + '" aria-label="Step ' + (i + 1) + '"></button>').join("");
  }
  function show(i, speak) {
    cur = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach((s, k) => s.classList.toggle("active", k === cur));
    $("back").disabled = cur === 0;
    $("next").disabled = cur === slides.length - 1;
    $("where").textContent = cur === slides.length - 1 ? "The end" : "Step " + (cur + 1) + " of " + (slides.length - 1);
    paintDots();
    if (cur === slides.length - 1) paintStickers();
    if (speak) say(slides[cur].dataset.say);
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (window.__ehelAt) { try { window.__ehelAt(cur); } catch (_) {} }
  }
  /* RESUME ON REOPEN. The stored record already knew which steps were
     done and where the learner was; until this hook every reopened
     lesson drew an empty dot rail and step 1. Called once, after the
     progress document hydrates, and only if the learner has not already
     moved off step 1 on their own - hydrate is asynchronous and a child
     who tapped Next is not to be yanked back. show() is looked up by
     name at call time, so every wrapper the build or the pipeline puts
     around it (the header bar\x27s percentage, a step\x27s arrival line)
     runs exactly as it does for a tap on a dot. */
  /* WHO HAS STARTED. Recorded from real input, not inferred from done[0]:
     a step that finishes when it is DRAWN marks itself done at load, before
     the record arrives, and read as the learner having touched the page it
     kept every reopened English lesson on step 1 (measured 2026-09-11). */
  let ehelInteracted = false;
  ["pointerdown", "keydown", "touchstart"].forEach((t) => document.addEventListener(t,
    () => { ehelInteracted = true; }, { capture: true, passive: true, once: true }));
  window.__ehelRestore = function (doneIdx, resumeIdx) {
    const untouched = cur === 0 && !ehelInteracted;
    let changed = false;
    for (const i of doneIdx || []) { if (i >= 0 && i < done.length - 1 && !done[i]) { done[i] = true; changed = true; } }
    if (changed) paintDots();
    const target = Number.isInteger(resumeIdx) && resumeIdx > 0 && resumeIdx < slides.length
      ? resumeIdx : done.findIndex((d, i) => !d && i < done.length - 1);
    if (untouched && target > 0) show(target, false);
    else if (changed) show(cur, false);
  };
  $("next").addEventListener("click", () => show(cur + 1, true));
  $("back").addEventListener("click", () => show(cur - 1, true));
  $("dots").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) show(Number(b.dataset.i), true); });
  document.querySelectorAll(".speak").forEach((b) => b.addEventListener("click", () => say(b.parentElement.querySelector("span").textContent)));
  /* ONLY THE STEP ON SCREEN MAY SPEAK. Every check step answers a tap with a
     2.2-2.7s timer that then finishes the step, and nothing cancels that timer
     when the child presses Next inside the window - so the old step's finish
     line arrived two seconds into the new one, and because speak() stops
     whatever is playing first, it cut the new step's instruction off
     (measured on the live Unit 1: "You know these words by their sound now."
     2.13s into "Words: home and classroom"). The tick and the dots still land
     on the step the child actually finished; only the voice asks whether that
     step is still the one showing, the way playHere() already does for clips. */
  function finish(i, msg) { if (!done[i]) { done[i] = true; paintDots(); } if (window.__ehelStep) { try { window.__ehelStep(i, done); } catch (_) {} } if (msg && cur === i) say(msg); }

  /* Hand a score to the progress client, if this page has one.
     NAMING THE PIPELINE TOOL HERE BREAKS THE BUILD, which is why this comment
     talks around it. Each shared step uses its own filename as its
     idempotence marker and skips any page already containing it - so a
     comment mentioning the progress step made all ten pages read as "already
     reports", and they shipped with no progress block at all. Made once
     earlier in this build and made again here; the tell is the step printing
     "skip ... already reports" on a page it has never touched. */
  function reportScore(i, right, total, sub, subTitle) {
    if (window.__ehelScore) { try { window.__ehelScore(i, right, total, sub, subTitle); } catch (_) { /* never break the lesson */ } }
  }
  /* Participation, where the step asked something but marked nothing. The
     noun says what the two numbers COUNT - books, words, seconds - because
     "3 of 7" alone is what made a family portal print a row nobody could
     read. */
  function reportAttempt(i, answered, total, noun) {
    if (window.__ehelAttempt) { try { window.__ehelAttempt(i, answered, total, noun); } catch (_) { /* same */ } }
  }
  /* A word the learner picked correctly for a sound or a picture - the one
     place this build has direct evidence that a word is known. */
  function reportKnown(words) {
    if (window.__ehelKnown) { try { window.__ehelKnown(words); } catch (_) { /* same */ } }
  }

  /* ---- one question after another ---- */
  function sequence(o) {
    let i = 0, right = 0, lock = false;
    const el = o.el;
    function draw() {
      lock = false;
      const it = o.items[i];
      /* THE STORY A QUESTION IS ABOUT, above the question (owner, 2026-09-10),
         the same eyebrow the book questions carry. Only the unit-story step
         supplies `srcTitle`, so the three other sequence() steps - the mid
         quiz, fluency and the unit quiz - draw exactly what they drew before.
         `ask` stays raw because it is authored markup; only the title we add
         is escaped, and it comes from the unit's own readings. */
      const src = it.srcTitle
        ? '<span class="qbook">' + String(it.srcTitle)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") + "</span>"
        : "";
      $(el.say).innerHTML = src + it.ask;
      $(el.stage).innerHTML = it.pic || "";
      $(el.ch).innerHTML = shuffle(it.opts).map((c) => '<button type="button" class="choice' + (o.smallOpts ? " small" : "") + '" data-ok="' + (c.ok ? 1 : 0) + '">' + c.t + "</button>").join("");
      $(el.fb).textContent = ""; $(el.fb).className = "fb";
      $(el.score).textContent = (o.label || "Question") + " " + (i + 1) + " of " + o.items.length;
      /* A WAY BACK TO THE TEXT THE QUESTIONS ARE ABOUT. The unit story used
         to be the step immediately before this one. It was removed on
         2026-09-08 as a duplicate of the same story on the book shelf, and
         that left these questions with nothing to go back to and an
         instruction - "go back a step" - that then pointed at Games.

         The book opens RIGHT HERE rather than sending a five-year-old eight
         steps back to pick the right one out of seven. Same reader as the
         shelf (openBookReader), so the tap sounds and Listen come with it. */
      if (o.readAgain && o.readAgain.id && el.again) {
        $(el.stage).innerHTML = '<div class="bigbtns"><button type="button" class="big small ghost" id="'
          + el.again + '">\u{1F4D6} Read the story again</button></div>';
        const back = $(el.again);
        if (back) back.addEventListener("click", () => {
          const book = (o.readAgain.books || []).find((b) => b.id === o.readAgain.id);
          if (book) openBookReader(book, null);
        });
      }
      /* The same guard as finish(), for the other thing the timer does: after
         ANY answer, not only the last, it redraws the next question and reads
         it out - on whichever step the child is now looking at. Measured:
         "Which classroom thing do you sit on?" 2.65s into "How English works".
         At page load this is silenced by __ehelPainting either way, and a
         child who comes back later is spoken to by show(), so nothing is lost. */
      if (cur === o.finish) say(plain(it.ask));
    }
    $(el.ch).addEventListener("click", (e) => {
      const b = e.target.closest(".choice"); if (!b || lock) return;
      lock = true;
      const ok = b.dataset.ok === "1", it = o.items[i];
      $(el.ch).querySelectorAll(".choice").forEach((c) => { c.disabled = true; if (c.dataset.ok === "1") c.classList.add("right"); });
      if (!ok) b.classList.add("wrong"); else right++;
      $(el.fb).className = "fb " + (ok ? "good" : "bad");
      $(el.fb).textContent = (ok ? cheer() + " " : "") + it.why;
      say((ok ? cheer() + " " : "") + it.why);
      i++;
      setTimeout(() => {
        if (i >= o.items.length) {
          $(el.ch).innerHTML = ""; $(el.score).textContent = "";
          $(el.fb).className = "fb good";
          $(el.fb).textContent = "You got " + right + " of " + o.items.length + ". " + o.done;
          /* SOME OF THESE QUESTIONS MAY NOT BE MARKED, and the step says which.
             The unit quizzes are authored as multiple choice, with their own
             options and a key: a tap there is a mark, and it is reported as
             one. The STORY questions are not. They are authored as oral
             questions - a child says the answer and a grown-up judges it -
             and the builder turns them into taps by borrowing the OTHER
             questions' answers about the same story as the wrong options. So
             a reading's six questions rotate one small pool between them, and
             a child who has answered two knows the third by elimination.
             Measured on the deployed Unit 4, which nothing was added to:
             three consecutive questions offered the same three options.

             The child still sees "You got 4 of 6" - that is their own feedback
             and it is honest about the taps they made. What changes is what
             leaves the page: participation, not a mark, on the channel the
             gateway keeps out of the gradebook (externallib_progress.php ::
             sanitise_attempted, "a count, never a percentage"). Reporting it
             as a score would put a comprehension percentage in front of a
             family that measures elimination. */
          if (o.attemptOnly) reportAttempt(o.finish, o.items.length, o.items.length, "questions");
          else reportScore(o.finish, right, o.items.length);
          finish(o.finish, o.done);
        } else draw();
      }, 2700);
    });
    draw();
  }

  /* ==================================================================
     THE INTENSIVE ENGLISH RENDERERS.

     One step per screen, in the design of the Grade 1 Mathematics and
     English standalone builds. The deck above puts every slide in the DOM
     at once and hides all but one, so everything here draws at load and
     nothing here may speak while it draws (window.__ehelPainting), and a
     clip may only play for the slide the learner is actually on
     (playHere / ONSHOW).

     ADULT COURSE. No stickers, no prizes, no cheering. A step that is
     finished says so once, plainly, and the dot rail carries the rest.
     paintStickers() is defined because the lifted deck calls it on the
     last slide; here it draws the "What you can do now" summary.
     ================================================================== */

  const esc = (s) => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const lines = (text) => String(text || "").split("\n").filter((l) => l.trim());
  const para = (text) => lines(text).map((l) => "<p>" + esc(l) + "</p>").join("");
  const pre = (text) => '<pre class="rule">' + esc(String(text || "")) + "</pre>";

  /* ---- the clip a text was recorded under -------------------------------
     cyrb53 of the DISPLAYED text, exactly as the course shell's
     staticVoiceKey computes it and as the generator names the file. The
     hash is computed here rather than baked in by the builder so the page
     and the recording can never disagree about which text was spoken. */
  function cyrb53(str, seed = 0) {
    let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (let i = 0, ch; i < str.length; i++) {
      ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
  }
  const AUDIO_IS_DEV = ["localhost", "127.0.0.1", ""].includes(location.hostname);
  /* Two trees, one file. In dev the clips sit beside this build
     (intensive-english/media/audio/tts); deployed they are fanned out per
     level into media/intensive-english/gNN/audio/tts by the uploader. */
  function clipFor(text) {
    const key = cyrb53(String(text || "").replace(/\s+/g, " ").trim());
    if (!key) return "";
    return AUDIO_IS_DEV
      ? "../media/audio/tts/" + key + ".mp3"
      : "../../../media/intensive-english/g" + String(LESSON.level).padStart(2, "0") + "/audio/tts/" + key + ".mp3";
  }

  /* One player, because two would talk over each other. A clip that will not
     play hands its words to the voice engine, which is also what happens for
     a text too short to have been recorded (the generator's floor). */
  const player = new Audio();
  player.preload = "none";
  function playClip(text, spoken) {
    if (window.__ehelPainting) return Promise.resolve(false);
    const url = clipFor(text);
    const fallback = spoken || text;
    if (!url) { if (fallback) say(fallback); return Promise.resolve(false); }
    try { VOICE.stop && VOICE.stop(); } catch (_) { /* the voice may be mid-sentence */ }
    return new Promise((resolve) => {
      let settled = false;
      const finished = (ok) => { if (settled) return; settled = true; resolve(ok); };
      player.onended = () => finished(true);
      player.onerror = () => { if (fallback) say(fallback); finished(false); };
      player.src = url;
      const p = player.play();
      if (p && p.catch) p.catch(() => { if (fallback) say(fallback); finished(false); });
    });
  }

  /* show() is wrapped rather than edited: it is lifted verbatim and the
     shared progress step patches it by matching its exact text. */
  const ONSHOW = [];
  const showWithoutClips = show;
  show = function (i, speak) {
    showWithoutClips(i, speak);
    const f = ONSHOW[cur];
    if (f) { try { f(); } catch (_) { /* a step must never break the deck */ } }
  };
  function playHere(idx, text, spoken) { if (cur === idx) playClip(text, spoken); }
  /* A read-only step is done when it is SEEN, not when it is drawn. */
  function finishOnArrival(i, msg) {
    ONSHOW[i] = () => { finish(i, msg || ""); };
  }
  const attempt = (i, answered, total, noun) => {
    if (window.__ehelAttempt) { try { window.__ehelAttempt(i, answered, total, noun); } catch (_) {} }
  };
  const knownWords = (words) => {
    if (window.__ehelKnown) { try { window.__ehelKnown(words); } catch (_) {} }
  };
  const listenBtn = (text, label) =>
    '<button type="button" class="big small ghost listen" data-say="' + esc(text) + '">&#9654; ' + esc(label || "Listen") + "</button>";

  function wireListen(root) {
    root.querySelectorAll(".listen").forEach((b) => {
      b.addEventListener("click", () => playClip(b.dataset.say));
    });
  }

  /* ================= 1. what this unit is for ======================== */
  function unitOverview(i, id) {
    const el = $(id);
    el.innerHTML =
      '<p class="eyebrow">' + esc(LESSON.levelLabel) + " &middot; Unit " + LESSON.unit + " &middot; CEFR " + esc(LESSON.band) + "</p>" +
      "<h2>" + esc(LESSON.title) + "</h2>" +
      '<p class="lead">' + esc(LESSON.overview) + "</p>" +
      '<div class="panel"><h3>By the end of this unit</h3><ul class="cando">' +
      LESSON.outcomes.map((o) => "<li>" + esc(o.can) + "<small>" + esc(o.detail) + "</small></li>").join("") +
      "</ul></div>" +
      (LESSON.path.length
        ? '<div class="panel"><h3>How to work through it</h3><ol class="path">' +
          LESSON.path.map((p) => "<li>" + esc(p) + "</li>").join("") + "</ol></div>"
        : "");
    finishOnArrival(i);
  }

  /* ================= 2. the lesson ================================== */
  function lecture(i, id) {
    const el = $(id);
    const text = LESSON.lecture;
    el.innerHTML =
      "<h2>The lesson</h2>" +
      '<p class="lead">Listen first. Then read it and listen again. Then read it out loud yourself.</p>' +
      '<div class="actions">' + listenBtn(text, "Listen to the lesson") + "</div>" +
      '<div class="reading">' + para(text) + "</div>" +
      '<div class="actions"><button type="button" class="big" id="' + id + '-done">I have read and listened</button></div>';
    wireListen(el);
    $(id + "-done").addEventListener("click", () => finish(i, "Now the words."));
  }

  /* ================= 3. the words =================================== */
  function wordWalk(i, id, group) {
    const el = $(id);
    const words = group.words;
    let at = 0, sentence = 0;
    const seen = new Set();
    el.innerHTML =
      "<h2>" + esc(group.title) + "</h2>" +
      '<p class="lead">Tap Hear it. Say the word. Then read the sentences.</p>' +
      '<div class="ien-word" id="' + id + '-card"></div>' +
      '<div class="actions">' +
      '<button type="button" class="big small ghost" id="' + id + '-prev">&#9664; Back</button>' +
      '<button type="button" class="big small" id="' + id + '-hear">&#9654; Hear it</button>' +
      '<button type="button" class="big small ghost" id="' + id + '-more">Another sentence</button>' +
      '<button type="button" class="big" id="' + id + '-next">Next word &#9654;</button>' +
      "</div>" +
      '<p class="count" id="' + id + '-count"></p>';

    function draw(speakIt) {
      const w = words[at];
      seen.add(w.w);
      $(id + "-card").innerHTML =
        (w.pic ? '<span class="pic" aria-hidden="true">' + w.pic + "</span>" : "") +
        '<p class="pos">' + esc(w.pos) + "</p>" +
        "<h3>" + esc(w.w) + "</h3>" +
        '<p class="meaning">' + esc(w.meaning) + "</p>" +
        '<p class="example">' + esc(w.sentences[sentence] || w.example) + "</p>" +
        (w.starter ? '<p class="starter">Your turn: ' + esc(w.starter) + " &hellip;</p>" : "");
      $(id + "-count").textContent = "Word " + (at + 1) + " of " + words.length;
      $(id + "-prev").disabled = at === 0;
      if (speakIt) playHere(i, w.w, w.w);
      if (seen.size === words.length) { finish(i, ""); knownWords([...seen]); attempt(i, seen.size, words.length, "words"); }
    }
    $(id + "-hear").addEventListener("click", () => playClip(words[at].w, words[at].w));
    $(id + "-more").addEventListener("click", () => {
      const w = words[at];
      sentence = (sentence + 1) % Math.max(1, w.sentences.length);
      draw(false);
      playClip(w.sentences[sentence] || w.example);
    });
    $(id + "-next").addEventListener("click", () => { at = (at + 1) % words.length; sentence = 0; draw(true); });
    $(id + "-prev").addEventListener("click", () => { at = Math.max(0, at - 1); sentence = 0; draw(true); });
    draw(false);
    ONSHOW[i] = () => playHere(i, words[at].w, words[at].w);
  }

  /* ---- which word means this? --------------------------------------- */
  function wordCheck(i, id, words) {
    const el = $(id);
    const items = shuffle(words).slice(0, Math.min(8, words.length));
    let at = 0, right = 0;
    el.innerHTML =
      "<h2>Which word?</h2>" +
      '<p class="lead">Read the meaning. Tap the word it belongs to.</p>' +
      '<p class="prompt" id="' + id + '-q"></p>' +
      '<div class="options" id="' + id + '-opts"></div>' +
      '<p class="feedback" id="' + id + '-fb" role="status" aria-live="polite"></p>' +
      '<p class="count" id="' + id + '-count"></p>';

    function draw() {
      const item = items[at];
      const wrong = shuffle(words.filter((w) => w.w !== item.w)).slice(0, 3);
      const opts = shuffle([item, ...wrong]);
      $(id + "-q").textContent = item.meaning;
      $(id + "-count").textContent = "Question " + (at + 1) + " of " + items.length;
      $(id + "-opts").innerHTML = opts.map((o) => '<button type="button" class="opt" data-w="' + esc(o.w) + '">' + esc(o.w) + "</button>").join("");
      $(id + "-opts").querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => {
        if (b.disabled) return;
        const ok = b.dataset.w === item.w;
        $(id + "-opts").querySelectorAll(".opt").forEach((x) => { x.disabled = true; if (x.dataset.w === item.w) x.classList.add("right"); });
        if (!ok) b.classList.add("wrong");
        if (ok) { right += 1; knownWords([item.w]); }
        $(id + "-fb").textContent = ok ? "Yes. " + item.w + "." : "It is " + item.w + ".";
        setTimeout(() => {
          at += 1;
          if (at < items.length) { $(id + "-fb").textContent = ""; draw(); }
          else {
            $(id + "-fb").textContent = right + " of " + items.length + " right.";
            $(id + "-opts").innerHTML = "";
            $(id + "-count").textContent = "";
            attempt(i, items.length, items.length, "words");
            finish(i, "");
          }
        }, 1400);
      }));
    }
    draw();
  }

  /* ================= 4. a pattern =================================== */
  function pattern(i, id, card) {
    const el = $(id);
    el.innerHTML =
      '<p class="eyebrow">Pattern</p>' +
      "<h2>" + esc(card.title) + "</h2>" +
      '<div class="actions">' + listenBtn(card.title + ". " + card.explanation, "Hear it") + "</div>" +
      '<div class="lead">' + para(card.explanation) + "</div>" +
      pre(card.rule) +
      '<details class="drawer" open><summary>One done for you</summary>' + para(card.worked) + "</details>" +
      (card.mistake ? '<details class="drawer warn"><summary>The easy mistake</summary>' + para(card.mistake) + "</details>" : "") +
      (card.tip ? '<p class="tip">' + esc(card.tip) + "</p>" : "") +
      (card.practice
        ? '<div class="panel"><h3>Your turn</h3>' + para(card.practice) +
          '<textarea class="write" rows="4" id="' + id + '-write" placeholder="Write your answers here."></textarea>' +
          '<div class="actions"><button type="button" class="big small" id="' + id + '-check">Check yourself</button></div>' +
          '<div class="answers" id="' + id + '-ans" hidden>' + para(card.answers) + "</div></div>"
        : "");
    wireListen(el);
    if (card.practice) {
      const box = $(id + "-write");
      const saveKey = "ien-" + LESSON.level + "-" + LESSON.unit + "-" + id;
      try { box.value = localStorage.getItem(saveKey) || ""; } catch (_) {}
      box.addEventListener("input", () => { try { localStorage.setItem(saveKey, box.value); } catch (_) {} });
      $(id + "-check").addEventListener("click", () => {
        $(id + "-ans").hidden = false;
        finish(i, "");
      });
    } else {
      finishOnArrival(i);
    }
    ONSHOW[i] = () => playHere(i, card.title + ". " + card.explanation);
  }

  /* ================= 5. a text ====================================== */
  function reading(i, id, r) {
    const el = $(id);
    const label = r.doc ? r.doc : r.type;
    el.innerHTML =
      '<p class="eyebrow">' + esc(label) + "</p>" +
      "<h2>" + esc(r.title) + "</h2>" +
      '<div class="actions">' + listenBtn(r.speech || r.passage, "Listen") + "</div>" +
      '<div class="reading' + (r.doc ? " document" : "") + '">' + para(r.passage) + "</div>" +
      '<div class="actions"><button type="button" class="big" id="' + id + '-done">I have read it</button></div>';
    wireListen(el);
    $(id + "-done").addEventListener("click", () => finish(i, ""));
  }

  /* ---- questions about the texts ------------------------------------ */
  function questions(i, id, items) {
    const el = $(id);
    let at = 0, right = 0;
    el.innerHTML =
      "<h2>Questions</h2>" +
      '<p class="lead">Look back at the text if you need to.</p>' +
      '<p class="prompt" id="' + id + '-q"></p>' +
      '<div class="options" id="' + id + '-opts"></div>' +
      '<p class="feedback" id="' + id + '-fb" role="status" aria-live="polite"></p>' +
      '<p class="count" id="' + id + '-count"></p>';

    function draw() {
      const item = items[at];
      const opts = shuffle([item.a, ...item.wrong]);
      $(id + "-q").textContent = item.q;
      $(id + "-count").textContent = "Question " + (at + 1) + " of " + items.length;
      $(id + "-opts").innerHTML = opts.map((o) => '<button type="button" class="opt wide" data-a="' + esc(o) + '">' + esc(o) + "</button>").join("");
      $(id + "-opts").querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => {
        if (b.disabled) return;
        const ok = b.dataset.a === item.a;
        $(id + "-opts").querySelectorAll(".opt").forEach((x) => { x.disabled = true; if (x.dataset.a === item.a) x.classList.add("right"); });
        if (!ok) b.classList.add("wrong");
        if (ok) right += 1;
        $(id + "-fb").textContent = item.why;
        setTimeout(() => {
          at += 1;
          if (at < items.length) { $(id + "-fb").textContent = ""; draw(); }
          else {
            $(id + "-fb").textContent = right + " of " + items.length + " right.";
            $(id + "-opts").innerHTML = "";
            $(id + "-count").textContent = "";
            attempt(i, items.length, items.length, "questions");
            finish(i, "");
          }
        }, 2600);
      }));
    }
    draw();
  }

  /* ================= 6. say it out loud ============================== */
  function speaking(i, id, tasks) {
    const el = $(id);
    el.innerHTML =
      "<h2>Say it out loud</h2>" +
      '<p class="lead">Listen to the model. Say it yourself. Record, then listen back and check.</p>' +
      tasks.map((t, n) => '<div class="panel task">' +
        "<h3>" + esc(t.title) + "</h3>" +
        '<div class="actions">' + listenBtn(t.speech || t.instructions, "Listen") +
        '<button type="button" class="big small rec" data-n="' + n + '">&#9679; Record</button>' +
        '<button type="button" class="big small ghost play" data-n="' + n + '" disabled>&#9654; Play back</button></div>' +
        '<div class="reading">' + para(t.instructions) + "</div>" +
        '<label class="tick"><input type="checkbox" class="said" data-n="' + n + '"> I have said it and listened back</label>' +
        "</div>").join("");
    wireListen(el);

    /* One recorder for the page. A learner with no microphone still has the
       model and the checklist, so the tick is what finishes the step. */
    let media = null, chunks = [], activeBtn = null;
    const clips = {};
    el.querySelectorAll(".rec").forEach((b) => b.addEventListener("click", async () => {
      const n = b.dataset.n;
      if (media && media.state === "recording") { media.stop(); return; }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        media = new MediaRecorder(stream);
        chunks = [];
        activeBtn = b;
        media.ondataavailable = (e) => chunks.push(e.data);
        media.onstop = () => {
          clips[n] = URL.createObjectURL(new Blob(chunks, { type: "audio/webm" }));
          stream.getTracks().forEach((t) => t.stop());
          b.textContent = "● Record again";
          el.querySelector('.play[data-n="' + n + '"]').disabled = false;
        };
        media.start();
        b.textContent = "■ Stop";
      } catch (_) {
        b.disabled = true;
        b.textContent = "No microphone";
      }
    }));
    el.querySelectorAll(".play").forEach((b) => b.addEventListener("click", () => {
      const url = clips[b.dataset.n];
      if (!url) return;
      try { VOICE.stop && VOICE.stop(); } catch (_) {}
      player.src = url;
      player.play();
    }));
    const ticks = [...el.querySelectorAll(".said")];
    ticks.forEach((t) => t.addEventListener("change", () => {
      const done = ticks.filter((x) => x.checked).length;
      attempt(i, done, ticks.length, "tasks");
      if (done === ticks.length) finish(i, "");
    }));
  }

  /* ================= 7. write it ==================================== */
  function writing(i, id, tasks) {
    const el = $(id);
    el.innerHTML =
      "<h2>Write it</h2>" +
      tasks.map((t, n) => '<div class="panel task">' +
        "<h3>" + esc(t.title) + "</h3>" +
        '<div class="reading">' + para(t.prompt) + "</div>" +
        (t.starter ? '<p class="starter">Start like this: ' + esc(t.starter) + "</p>" : "") +
        '<textarea class="write" rows="6" data-n="' + n + '" placeholder="Write here. Your writing stays on this device."></textarea>' +
        (t.criteria ? '<div class="criteria"><h4>Check your writing</h4>' + para(t.criteria) + "</div>" : "") +
        (t.support ? '<details class="drawer"><summary>If you are stuck</summary>' + para(t.support) + "</details>" : "") +
        (t.model ? '<details class="drawer"><summary>See one done</summary>' + para(t.model) + "</details>" : "") +
        (t.extension ? '<details class="drawer"><summary>Do more</summary>' + para(t.extension) + "</details>" : "") +
        '<label class="tick"><input type="checkbox" class="wrote" data-n="' + n + '"> I have written it and checked it</label>' +
        "</div>").join("");
    el.querySelectorAll("textarea.write").forEach((box) => {
      const saveKey = "ien-" + LESSON.level + "-" + LESSON.unit + "-w" + box.dataset.n;
      try { box.value = localStorage.getItem(saveKey) || ""; } catch (_) {}
      box.addEventListener("input", () => { try { localStorage.setItem(saveKey, box.value); } catch (_) {} });
    });
    const ticks = [...el.querySelectorAll(".wrote")];
    ticks.forEach((t) => t.addEventListener("change", () => {
      const done = ticks.filter((x) => x.checked).length;
      attempt(i, done, ticks.length, "tasks");
      if (done === ticks.length) finish(i, "");
    }));
  }

  /* ================= 8. practice ==================================== */
  function practice(i, id, items) {
    const el = $(id);
    el.innerHTML =
      "<h2>Practice</h2>" +
      '<p class="lead">Write your answers, then check yourself. The key says what a score means.</p>' +
      items.map((it, n) => '<div class="panel task">' +
        "<h3>" + esc(it.title) + "</h3>" +
        '<p class="pos">' + esc(it.type) + "</p>" +
        '<div class="reading">' + para(it.instructions) + "</div>" +
        '<textarea class="write" rows="5" data-n="' + n + '" placeholder="Write your answers here."></textarea>' +
        '<div class="actions"><button type="button" class="big small check" data-n="' + n + '">Check yourself</button></div>' +
        '<div class="answers" data-n="' + n + '" hidden>' + para(it.answers) + "</div>" +
        (it.solo ? '<p class="tip">' + esc(it.solo) + "</p>" : "") +
        "</div>").join("");
    el.querySelectorAll("textarea.write").forEach((box) => {
      const saveKey = "ien-" + LESSON.level + "-" + LESSON.unit + "-p" + box.dataset.n;
      try { box.value = localStorage.getItem(saveKey) || ""; } catch (_) {}
      box.addEventListener("input", () => { try { localStorage.setItem(saveKey, box.value); } catch (_) {} });
    });
    const revealed = new Set();
    el.querySelectorAll(".check").forEach((b) => b.addEventListener("click", () => {
      el.querySelector('.answers[data-n="' + b.dataset.n + '"]').hidden = false;
      revealed.add(b.dataset.n);
      attempt(i, revealed.size, items.length, "exercises");
      if (revealed.size === items.length) finish(i, "");
    }));
  }

  /* ================= 9. the quiz ==================================== */
  function quiz(i, id, items) {
    const el = $(id);
    let at = 0, right = 0;
    el.innerHTML =
      "<h2>Check what you know</h2>" +
      '<p class="lead">' + items.length + " questions. You can try again.</p>" +
      '<p class="prompt" id="' + id + '-q"></p>' +
      '<div class="options" id="' + id + '-opts"></div>' +
      '<p class="feedback" id="' + id + '-fb" role="status" aria-live="polite"></p>' +
      '<p class="count" id="' + id + '-count"></p>' +
      '<div class="actions" id="' + id + '-again" hidden><button type="button" class="big small ghost">Try again</button></div>';

    function draw() {
      const item = items[at];
      $(id + "-q").textContent = item.q;
      $(id + "-count").textContent = "Question " + (at + 1) + " of " + items.length + " · " + right + " right";
      $(id + "-opts").innerHTML = item.options.map((o) => '<button type="button" class="opt wide" data-a="' + esc(o) + '">' + esc(o) + "</button>").join("");
      $(id + "-opts").querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => {
        if (b.disabled) return;
        const ok = b.dataset.a === item.a;
        $(id + "-opts").querySelectorAll(".opt").forEach((x) => { x.disabled = true; if (x.dataset.a === item.a) x.classList.add("right"); });
        if (!ok) b.classList.add("wrong");
        if (ok) right += 1;
        $(id + "-fb").textContent = item.why;
        setTimeout(() => {
          at += 1;
          if (at < items.length) { $(id + "-fb").textContent = ""; draw(); }
          else {
            $(id + "-fb").textContent = "You scored " + right + " of " + items.length + ".";
            $(id + "-opts").innerHTML = "";
            $(id + "-count").textContent = "";
            $(id + "-again").hidden = false;
            if (window.__ehelScore) { try { window.__ehelScore(i, right, items.length); } catch (_) {} }
            attempt(i, items.length, items.length, "questions");
            finish(i, "");
          }
        }, 2600);
      }));
    }
    $(id + "-again").querySelector("button").addEventListener("click", () => {
      at = 0; right = 0; $(id + "-fb").textContent = ""; $(id + "-again").hidden = true; draw();
    });
    draw();
  }

  /* ================= 10. what you can do now ========================= */
  /* The lifted deck calls paintStickers() on the last slide. This course is
     for adults: the last slide is the unit's own can-do list, rated by the
     learner, and the assignment that carries the unit's evidence. */
  function paintStickers() {
    const el = $("summary");
    if (!el || el.dataset.painted) return;
    el.dataset.painted = "1";
    const a = LESSON.assignment;
    el.innerHTML =
      "<h2>What you can do now</h2>" +
      '<p class="lead">Mark each one honestly. It is for you: nobody else sees it.</p>' +
      '<div class="panel"><ul class="self">' +
      LESSON.self.map((s, n) => "<li><span>" + esc(s) + "</span>" +
        '<span class="scale">' + ["Not yet", "A little", "I can do this", "I could show someone else"]
          .map((label, k) => '<button type="button" class="rate" data-n="' + n + '" data-k="' + k + '">' + esc(label) + "</button>").join("") +
        "</span></li>").join("") +
      "</ul></div>" +
      (a ? '<div class="panel"><h3>' + esc(a.title) + "</h3>" +
        '<p class="pos">' + esc(a.submissionType) + " &middot; " + a.marks + " marks</p>" +
        '<div class="reading">' + para(a.instructions) + "</div>" +
        '<p class="tip">Marked on: ' + esc(a.criteria.join(", ")) + "</p></div>" : "") +
      '<p class="tip">Next: Unit ' + (LESSON.unit + 1) + ", or back to the level page.</p>";
    el.querySelectorAll(".rate").forEach((b) => b.addEventListener("click", () => {
      el.querySelectorAll('.rate[data-n="' + b.dataset.n + '"]').forEach((x) => x.classList.remove("chosen"));
      b.classList.add("chosen");
      try { localStorage.setItem("ien-" + LESSON.level + "-" + LESSON.unit + "-self" + b.dataset.n, b.dataset.k); } catch (_) {}
    }));
    try {
      LESSON.self.forEach((_, n) => {
        const k = localStorage.getItem("ien-" + LESSON.level + "-" + LESSON.unit + "-self" + n);
        if (k !== null) { const b = el.querySelector('.rate[data-n="' + n + '"][data-k="' + k + '"]'); if (b) b.classList.add("chosen"); }
      });
    } catch (_) {}
  }


  unitOverview(0, 's0');
  lecture(1, 's1');
  wordWalk(2, 's2', LESSON.groups[0]);
  wordWalk(3, 's3', LESSON.groups[1]);
  wordWalk(4, 's4', LESSON.groups[2]);
  wordWalk(5, 's5', LESSON.groups[3]);
  wordCheck(6, 's6', LESSON.groups.flatMap(g => g.words));
  pattern(7, 's7', LESSON.patterns[0]);
  pattern(8, 's8', LESSON.patterns[1]);
  pattern(9, 's9', LESSON.patterns[2]);
  pattern(10, 's10', LESSON.patterns[3]);
  reading(11, 's11', LESSON.readings[0]);
  reading(12, 's12', LESSON.readings[1]);
  reading(13, 's13', LESSON.readings[2]);
  questions(14, 's14', LESSON.questions);
  speaking(15, 's15', LESSON.speaking);
  writing(16, 's16', LESSON.writing);
  practice(17, 's17', LESSON.practice);
  quiz(18, 's18', LESSON.quiz);
  window.__ehelPainting = false;   /* the draw pass is over: sound is allowed */
  show(0, false);


  /* ================= the two header bars =================
     Everything here is answered by this page. The class controls are not
     painted here - they mount themselves into .top-actions on bar 2, and only
     when the server confirms a teacher is watching. */
  (function () {
    const earnable = slides.length - 1;            // teaching slides + the check
    const pctEl = $("ehPct"), fillEl = $("ehFill");
    function ehPaint() {
      const n = done.slice(0, earnable).filter(Boolean).length;
      const p = earnable ? Math.round((n / earnable) * 100) : 0;
      pctEl.textContent = p + "%";
      fillEl.style.width = p + "%";
      const box = $("ehSteps");
      if (box && !box.hidden) ehSteps();
    }
    function ehSteps() {
      $("ehSteps").innerHTML = slides.map(function (s, i) {
        const h = s.querySelector("h2");
        return '<button type="button" data-i="' + i + '" class="' +
          (i === cur ? "now " : "") + (done[i] ? "done" : "") + '">' +
          (i + 1) + ". " + (h ? h.textContent : "Step " + (i + 1)) + "</button>";
      }).join("");
    }
    $("ehSteps").addEventListener("click", function (e) {
      const b = e.target.closest("button[data-i]");
      if (!b) return;
      show(+b.dataset.i, true);
      $("ehSteps").hidden = true;
      $("ehMenu").setAttribute("aria-expanded", "false");
    });
    $("ehMenu").addEventListener("click", function () {
      const box = $("ehSteps"), open = box.hidden;
      if (open) ehSteps();
      box.hidden = !open;
      $("ehMenu").setAttribute("aria-expanded", open ? "true" : "false");
    });
    $("ehPicker").addEventListener("change", function (e) {
      if (e.target.value) location.href = e.target.value + location.search;
    });
    $("ehFull").addEventListener("click", function () {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    });
    document.addEventListener("fullscreenchange", function () {
      $("ehFull").innerHTML = document.fullscreenElement ? "\u26f6 Leave full screen" : "\u26f6 Full screen";
    });
    /* the voice toggle mutes what SHE says; it does not touch the Listen
       buttons, which a child presses on purpose */
    let muted = false;
    const realSay = say;
    say = function (t) { if (!muted) realSay(t); };
    $("ehAudio").addEventListener("click", function () {
      muted = !muted;
      if (muted && window.VOICE && VOICE.stop) VOICE.stop();
      $("ehAudio").setAttribute("aria-pressed", muted ? "true" : "false");
      $("ehAudio").title = muted ? "Turn the voice on" : "Turn the voice off";
    });
    /* every completion repaints the rail, so that is where the pill hangs */
    const realPaintDots = paintDots;
    paintDots = function () { realPaintDots(); ehPaint(); };
    const realShow = show;
    show = function (i, speak) { realShow(i, speak); ehPaint(); };
    ehPaint();
  })();

  })();
</script>

     Only when ?from=ien2: a lesson opened on its own has nowhere to go back to. */

    if (!wrap) return;
    var back = document.createElement("a");
    back.className = "lesson-back";

<script>
  /* wire-navigation.py :: carry
     Keep ?pwsToken and ?pwsEndpoint alive on every in-app link. Without BOTH,
     the class controls and Wehel do not mount at all - they guard on them and
     return, so the symptom is silence rather than an error. Applied to every
     same-directory link so a control added later cannot reintroduce the gap.
     Done at run time because the values are only known then. */
  (function () {
    var q = new URLSearchParams(location.search);
    q.delete("from");
    if (!q.toString()) return;
    document.querySelectorAll("a[href]").forEach(function (a) {
      var href = a.getAttribute("href");
      if (!href || /^(https?:|mailto:|tel:|#)/i.test(href)) return;   // in-app only
      var base = href.split("?")[0];
      var own = new URLSearchParams(href.split("?")[1] || "");
      q.forEach(function (v, k) { if (!own.has(k)) own.set(k, v); });
      a.setAttribute("href", base + "?" + own.toString());
    });
  })();
</script>

<script type="module">
  /* The platform controls - see lesson-app-tools/wire-platform-controls.py.
     learner-controls.js holds the SAME singletons the shell mounts. */
  import { mountLearnerControls } from "./learner-controls.js";
  import { mountWehelChat } from "./wehel.js";
  import { escapeHtml } from "./course-shell.js";
  /* Focus mode and the session bar. Imported for its side effect - it mounts
     itself, and mounts NOTHING unless the launch carries focusMode=1 or an
     exitUrl, which is why an ordinary launch and every local run see no
     change. It is what writes course_focus_break / course_left_early, so
     without it the live group board's away state can never fire for a learner
     in this build. */
  import "./seb-session.js";

  const q = new URLSearchParams(location.search);
  const launchToken = (q.get("pwsToken") || "").replace(/[^A-Za-z0-9._-]/g, "");
  const launchEndpoint = (q.get("pwsEndpoint") || "").trim();

  let toastEl = null;
  function toast(message) {
    if (toastEl) toastEl.remove();
    toastEl = document.createElement("div");
    toastEl.className = "w-toast";
    toastEl.textContent = message;
    document.body.appendChild(toastEl);
    setTimeout(() => { if (toastEl) { toastEl.remove(); toastEl = null; } }, 3200);
  }

  /* 1. Class chat, Hand up and the Join class pill. They place themselves into
        .top-actions and mount ONLY when the server says a teacher is watching,
        so nothing appears to a child working alone. */
  try {
    mountLearnerControls({
      token: q.get("pwsToken") || "", launchToken, launchEndpoint,
      progressUnit: "u09",
    });
  } catch (e) { console.error("learner controls:", e); }

  /* How far Ask Wehel has to sit above the session bar - see --seb-lift in the
     stylesheet. Measured rather than assumed: the bar wraps, so its height is
     a property of the screen. Re-measured on resize because its clock changes
     width every second and its buttons re-flow. */
  (function () {
    const seb = document.getElementById("seb-session-bar");
    if (!seb) return;                       /* no focus mode, nothing to avoid */
    const lift = () => document.documentElement.style
      .setProperty("--seb-lift", (seb.offsetHeight + 30) + "px");
    lift();
    try { new ResizeObserver(lift).observe(seb); } catch (e) { addEventListener("resize", lift); }
  })();

  /* 2. Wehel. Mounted on first open, not on load: the panel asks the server for
        the day's allowance, and a lesson nobody opens the tutor on should not
        spend a request. */
  if (launchToken) {
    const dock = document.createElement("button");
    dock.type = "button"; dock.className = "w-dock"; dock.textContent = "\u{1F4AC} Ask Wehel";
    const drawer = document.createElement("div");
    drawer.className = "w-drawer"; drawer.hidden = true;
    drawer.innerHTML = '<div class="w-drawer-head">Wehel Tutor<button type="button" aria-label="Close">\u00d7</button></div><div class="w-drawer-body"></div>';
    let panel = null;
    function open() {
      drawer.hidden = false; dock.hidden = true;
      if (panel) return;
      try {
        panel = mountWehelChat({
          container: drawer.querySelector(".w-drawer-body"),
          meta: {
            subject: "intensive-english", subjectLabel: "Intensive English", grade: 2,
            unitNo: 9, unitTitle: "Boring or Bored",
            learnerCategory: q.get("category") || "",
          },
          store: {},
          ui: { escapeHtml, toast },
          tutorLabel: "Wehel Tutor",
          placeholder: "Ask about Boring or Bored\u2026",
          /* The chips a young learner presses, written as the sentence they
             would have said. Four, because a row a six-year-old scans has to
             be short and a fifth makes the other four less likely to be read.

             "Give me a hint" is the one that carries a teaching stance: it
             says "not the answer" in the message itself, so pressing it cannot
             turn the tutor into an answer machine even before the prompt file
             has its say.

             True of every app this tool wires - Grade 1 English and the four
             Mathematics builds - which is why none of them names a word, a
             sentence or a number. */
          quickPrompts: [
            { label: "I do not understand", message: "I do not understand this step. Please explain it again in a simpler way, with a small example." },
            { label: "Give me a hint", message: "Give me a hint for this step, not the answer, so I can try it myself." },
            { label: "Make it easier", message: "This is too hard for me right now. Break it into a smaller, easier step and start me there." },
            { label: "Quiz me", message: "Quiz me on this lesson, one question at a time." },
          ],
        });
      } catch (e) {
        console.error("wehel:", e);
        drawer.hidden = true; dock.hidden = false;
        toast("Wehel is not available on this page.");
      }
    }
    function close() { drawer.hidden = true; dock.hidden = false; }
    dock.addEventListener("click", open);
    drawer.querySelector("button").addEventListener("click", close);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !drawer.hidden) close(); });
    document.body.append(dock, drawer);
  }
</script>
